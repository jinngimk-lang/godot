name: MPFB Thumb Screen Target v72

on:
  push:
    branches:
      - spike/mpfb-thumb-screen-target-v72
    paths:
      - 'tools/author_mpfb_thumb_screen_target_v72.py'
      - '.github/workflows/mpfb-thumb-screen-target-v72.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  thumb-screen-target:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-thumb-screen-target-v72
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v72/{reports,logs,frames} docs/superpowers/evidence/mpfb-v72
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Author one v71-derived camera-space thumb correction
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/author_mpfb_thumb_screen_target_v72.py -- \
            bl_ext.mpfb_ci.mpfb artifacts/mpfb_v72/frames artifacts/mpfb_v72/reports/thumb-screen-target-v72.json \
            2>&1 | tee artifacts/mpfb_v72/logs/author.log
          grep -Fq 'MPFB_THUMB_SCREEN_TARGET_V72_SUCCESS' artifacts/mpfb_v72/logs/author.log
      - name: Enforce single-change screen-space contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v72/reports/thumb-screen-target-v72.json'))
          assert r['staging_only'] and not r['production_candidate']
          assert r['base_pose']=='pristine v65-B' and r['single_screen_space_authoring'] is True
          assert r['parameter_sweep_used'] is False and r['ccd_used'] is False and r['endpoint_optimizer_used'] is False
          assert r['non_thumb_matrix_max_abs_delta'] <= 1e-7, r['non_thumb_matrix_max_abs_delta']
          b,c=r['baseline'],r['candidate']
          assert c['bbox_outside_px'] >= b['bbox_outside_px'] + 2.0, (b['bbox_outside_px'],c['bbox_outside_px'])
          assert c['root_tip_span_px'] >= b['root_tip_span_px']*0.80, (b['root_tip_span_px'],c['root_tip_span_px'])
          print('MPFB_THUMB_SCREEN_TARGET_V72_STRUCTURAL_PASS')
          PY
      - name: Persist v72 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v72/reports/thumb-screen-target-v72.json docs/superpowers/evidence/mpfb-v72/
          cp artifacts/mpfb_v72/frames/*.png docs/superpowers/evidence/mpfb-v72/
          cp artifacts/mpfb_v72/frames/*pose.json docs/superpowers/evidence/mpfb-v72/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v72
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist thumb screen target v72'
            git pull --rebase origin spike/mpfb-thumb-screen-target-v72
            git push origin HEAD:spike/mpfb-thumb-screen-target-v72
          fi
      - name: Upload v72 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-thumb-screen-target-v72
          path: artifacts/mpfb_v72/
          if-no-files-found: error
          retention-days: 14
