name: MPFB Hero Limb Godot Import v31

on:
  push:
    branches:
      - spike/mpfb-hero-limb-godot-import-v31
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  staging-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_limb/{assets,reports,logs,licenses,previews}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz" | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo "92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz" | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          cp .preview-tools/mpfb2-2.0.17/LICENSE.ASSETS.md artifacts/mpfb_limb/licenses/
          cp .preview-tools/mpfb2-2.0.17/LICENSE.CODE.md artifacts/mpfb_limb/licenses/
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name "MPFB CI" --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Build and extract right hero limb
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- bl_ext.mpfb_ci.mpfb artifacts/mpfb_limb/assets/mpfb-human-source.glb artifacts/mpfb_limb/reports/mpfb-human-source.json 2>&1 | tee artifacts/mpfb_limb/logs/build.log
          grep -Fq "MPFB_LIMB_BUILD_SUCCESS" artifacts/mpfb_limb/logs/build.log
          .preview-tools/blender/blender --background --python tools/extract_mpfb_hero_limb.py -- artifacts/mpfb_limb/assets/mpfb-human-source.glb right artifacts/mpfb_limb/assets/mpfb-right-hero-limb.glb artifacts/mpfb_limb/reports/mpfb-right-hero-limb.json 2>&1 | tee artifacts/mpfb_limb/logs/extract-right.log
          grep -Fq "MPFB_HERO_LIMB_EXTRACT_SUCCESS" artifacts/mpfb_limb/logs/extract-right.log
      - name: Re-prove v30 precision pose gate
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/render_mpfb_precision_v30.py -- assets/models/hands/hand_right.glb artifacts/mpfb_limb/assets/mpfb-right-hero-limb.glb artifacts/mpfb_limb/previews 2>&1 | tee artifacts/mpfb_limb/logs/precision-v30.log
          grep -Fq "MPFB_PRECISION_V30_SUCCESS" artifacts/mpfb_limb/logs/precision-v30.log
          test -s artifacts/mpfb_limb/previews/contact_v23_cup_ik.png
          test -s artifacts/mpfb_limb/previews/surface_v29_root_align.png
      - name: Export rigged support and pinch staging GLBs
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/export_mpfb_pose_candidates_v31.py -- assets/models/hands/hand_right.glb artifacts/mpfb_limb/assets/mpfb-right-hero-limb.glb artifacts/mpfb_limb/assets artifacts/mpfb_limb/reports/pose-candidates-v31.json 2>&1 | tee artifacts/mpfb_limb/logs/export-v31.log
          grep -Fq "MPFB_POSE_CANDIDATE_EXPORT_V31_SUCCESS" artifacts/mpfb_limb/logs/export-v31.log
          test -s artifacts/mpfb_limb/assets/mpfb-right-support-wrap-v31.glb
          test -s artifacts/mpfb_limb/assets/mpfb-right-label-pinch-v31.glb
      - name: Install pinned Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import and inspect generated pose candidates in Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/generated_staging
          cp artifacts/mpfb_limb/assets/mpfb-right-support-wrap-v31.glb assets/generated_staging/
          cp artifacts/mpfb_limb/assets/mpfb-right-label-pinch-v31.glb assets/generated_staging/
          ./godot --headless --editor --path . --quit 2>&1 | tee artifacts/mpfb_limb/logs/godot-import-v31.log
          if grep -E "SCRIPT ERROR: Parse Error|ERROR: Failed to load script" artifacts/mpfb_limb/logs/godot-import-v31.log; then
            exit 1
          fi
          ./godot --headless --path . --script res://tests/inspect_mpfb_staging_candidate.gd 2>&1 | tee artifacts/mpfb_limb/logs/godot-inspect-v31.log
          grep -Fq "MPFB_GODOT_STAGING_IMPORT_V31_SUCCESS" artifacts/mpfb_limb/logs/godot-inspect-v31.log
      - name: Persist selected visual/import evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          evidence=docs/superpowers/evidence/mpfb-v31
          mkdir -p "$evidence"
          cp artifacts/mpfb_limb/previews/contact_v23_cup_ik.png "$evidence/support-wrap.png"
          cp artifacts/mpfb_limb/previews/surface_v29_root_align.png "$evidence/label-pinch.png"
          cp artifacts/mpfb_limb/reports/pose-candidates-v31.json "$evidence/pose-candidates-v31.json"
          cp artifacts/mpfb_limb/logs/godot-inspect-v31.log "$evidence/godot-inspect-v31.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$evidence"
          git commit -m "docs: persist MPFB v31 visual evidence [skip ci]"
          git push origin HEAD:spike/mpfb-hero-limb-godot-import-v31
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-hero-limb-godot-import-v31
          path: artifacts/mpfb_limb/
          if-no-files-found: error
          retention-days: 14
