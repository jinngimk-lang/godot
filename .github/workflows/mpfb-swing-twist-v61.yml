name: MPFB Swing Twist v61

on:
  push:
    branches:
      - spike/mpfb-hero-limb-swing-twist-v61
    paths-ignore:
      - 'docs/superpowers/evidence/mpfb-v61/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  swing-twist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-swing-twist-v61

      - name: Acquire official CC0 holding-object anatomy source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mpfb_v61/{source,assets,reports,logs,previews} docs/superpowers/evidence/mpfb-v61 .preview-tools
          URL='https://files2.makehumancommunity.org/asset_packs/poses01/poses01_cc0.zip'
          curl -L --fail --retry 3 -o artifacts/mpfb_v61/source/poses01_cc0.zip "$URL"
          python tools/inspect_makehuman_pose_v50.py \
            artifacts/mpfb_v61/source/poses01_cc0.zip \
            artifacts/mpfb_v61/source/holding-wine-glass \
            artifacts/mpfb_v61/reports/source-pose.json \
            2>&1 | tee artifacts/mpfb_v61/logs/source.log
          grep -Fq 'MAKEHUMAN_POSE_REFERENCE_V50_INSPECT_SUCCESS' artifacts/mpfb_v61/logs/source.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v61/reports/source-pose.json'))
          assert r['declared_license_from_official_pack_page'] == 'CC0', r
          assert r['automatic_retarget_allowed'] is False, r
          assert r['production_candidate'] is False, r
          print('V61_SOURCE_PROVENANCE_PASS', r['source_pack_sha256'])
          PY

      - name: Install headless runtime and pinned Blender/MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Build continuous GameEngine target limb
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_v61/assets/mpfb-human-source.glb \
            artifacts/mpfb_v61/reports/mpfb-human-source.json \
            2>&1 | tee artifacts/mpfb_v61/logs/build.log
          grep -Fq 'MPFB_LIMB_BUILD_SUCCESS' artifacts/mpfb_v61/logs/build.log

      - name: Author non-destructive source-frame swing/twist pose
        shell: bash
        run: |
          set -euo pipefail
          BVH="$(find artifacts/mpfb_v61/source/holding-wine-glass -type f -iname '*.bvh' -print -quit)"
          test -n "$BVH"
          .preview-tools/blender/blender --background --python tools/author_mpfb_swing_twist_v61.py -- \
            assets/models/hands/hand_right.glb \
            artifacts/mpfb_v61/assets/mpfb-human-source.glb \
            "$BVH" \
            artifacts/mpfb_v61/previews \
            artifacts/mpfb_v61/assets/right-support-wrap-v61.pose.json \
            artifacts/mpfb_v61/reports/right-support-wrap-v61.json \
            2>&1 | tee artifacts/mpfb_v61/logs/author.log
          grep -Fq 'MPFB_SWING_TWIST_V61_SUCCESS' artifacts/mpfb_v61/logs/author.log
          test -s artifacts/mpfb_v61/previews/swing_twist_v61_candidate.png
          test -s artifacts/mpfb_v61/previews/swing_twist_v61_thumbnail.png

      - name: Enforce non-destructive target-rig contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v61/reports/right-support-wrap-v61.json'))
          assert r['staging_only'] is True, r
          assert r['production_candidate'] is False, r
          assert r['source_license'].startswith('CC0'), r
          assert r['source_edit_bone_roll_copied'] is False, r
          assert r['source_pose_matrix_copied'] is False, r
          assert r['target_solver_used'] is False, r
          assert r['contact_servo_used'] is False, r
          assert r['camera_focus_preserves_pose'] is True, r
          assert r['pose_bone_count'] == 17, r
          assert r['target_rest_structure_error'] <= 1e-10, r
          assert r['max_reload_matrix_error'] <= 1e-6, r
          assert set(r['source_chains']) == {'thumb','index','middle','ring','pinky'}, r
          print('MPFB_SWING_TWIST_V61_CONTRACT_PASS')
          PY

      - name: Persist visual evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v61/previews/swing_twist_v61_candidate.png docs/superpowers/evidence/mpfb-v61/support-wrap-full.png
          cp artifacts/mpfb_v61/previews/swing_twist_v61_thumbnail.png docs/superpowers/evidence/mpfb-v61/support-wrap-thumbnail.png
          cp artifacts/mpfb_v61/reports/right-support-wrap-v61.json docs/superpowers/evidence/mpfb-v61/support-wrap-report.json
          cp artifacts/mpfb_v61/reports/source-pose.json docs/superpowers/evidence/mpfb-v61/source-pose-provenance.json
          .preview-tools/blender/blender --background --python tools/export_render_rgbhex.py -- \
            docs/superpowers/evidence/mpfb-v61/support-wrap-thumbnail.png \
            docs/superpowers/evidence/mpfb-v61/support-wrap-thumbnail.rgbhex \
            192 108
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v61
          git commit -m 'evidence: persist swing twist support pose v61'
          git push origin HEAD:spike/mpfb-hero-limb-swing-twist-v61

      - name: Upload redundant artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-swing-twist-v61
          path: artifacts/mpfb_v61/
          if-no-files-found: error
          retention-days: 14
