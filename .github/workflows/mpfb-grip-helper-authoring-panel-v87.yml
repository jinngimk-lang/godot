name: MPFB Grip Helper Authoring Panel v87

on:
  push:
    branches:
      - spike/mpfb-grip-helper-authoring-panel-v87b
    paths:
      - 'tools/build_mpfb_grip_helper_authoring_panel_v87.py'
      - 'tools/build_mpfb_grip_helper_authoring_overlay_v86.py'
      - 'tools/build_mpfb_grip_helper_ghost_v85.py'
      - 'tools/build_mpfb_grip_helper_authoring_v84.py'
      - 'art/reference_sources/contactpose-v79-full6-use-hand1.json'
      - '.github/workflows/mpfb-grip-helper-authoring-panel-v87.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  authoring-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-grip-helper-authoring-panel-v87b

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v87/{scene,reports,logs}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Build non-mutating direct-artist authoring panel
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_grip_helper_authoring_panel_v87.py -- \
            bl_ext.mpfb_ci.mpfb \
            art/reference_sources/contactpose-v79-full6-use-hand1.json \
            artifacts/mpfb_v87/scene \
            artifacts/mpfb_v87/reports/build.json \
            2>&1 | tee artifacts/mpfb_v87/logs/build.log
          grep -Fq 'MPFB_GRIP_HELPER_AUTHORING_PANEL_V87_SUCCESS' artifacts/mpfb_v87/logs/build.log
          test -s artifacts/mpfb_v87/scene/peel-calm-grip-helper-authoring-panel-v87.blend
          test -s artifacts/mpfb_v87/scene/v86-unchanged-opaque-macro.png
          test -s artifacts/mpfb_v87/scene/v86-authoring-overlay-anatomy.png

      - name: Reopen and verify panel cannot mutate the pose contract
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background artifacts/mpfb_v87/scene/peel-calm-grip-helper-authoring-panel-v87.blend --python-expr "import bpy,json; arm=bpy.data.objects['MPFB_V84_AuthoringRig']; controls=json.loads(arm['editable_controls']); s=bpy.context.scene; assert arm['peel_calm_authoring_version']=='v87'; assert len(controls)==7; assert arm['direct_artist_control_collection']=='PEEL_CALM_DIRECT_ARTIST_CONTROLS_V87'; assert all(arm.pose.bones[n].custom_shape is not None for n in controls); assert all(bool(arm.pose.bones[n]['peel_calm_semantic_control']) for n in controls); assert s['peel_calm_visual_verdict']=='PENDING_DIRECT_ARTIST_EDIT'; assert not s['production_candidate']; assert not s['v87_panel_pose_mutation']; assert not s['v87_panel_is_optimizer']; assert not s['v87_panel_automatic_retarget']; assert not s['v87_panel_parameter_sweep']; assert s['v87_panel_control_max_matrix_delta'] <= 1e-9; assert s['v87_panel_vessel_matrix_delta'] <= 1e-9; assert s['v87_panel_camera_matrix_delta'] <= 1e-9; assert bpy.data.objects['LOCKED_VesselProxy'].hide_select; assert bpy.data.objects['LOCKED_V84_Camera'].hide_select; assert bpy.data.texts.get('PEEL_CALM_V87_DIRECT_ARTIST_BRIEF') is not None; print('MPFB_GRIP_HELPER_AUTHORING_PANEL_V87_REOPEN_PASS')" 2>&1 | tee artifacts/mpfb_v87/logs/reopen.log
          grep -Fq 'MPFB_GRIP_HELPER_AUTHORING_PANEL_V87_REOPEN_PASS' artifacts/mpfb_v87/logs/reopen.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v87/reports/build.json'))
          assert r['production_candidate'] is False, r
          assert r['visual_verdict']=='PENDING_DIRECT_ARTIST_EDIT', r
          assert r['reference_set']==['bar_v1','market_v1'], r
          assert len(r['editable_controls'])==7, r
          assert r['direct_artist_control_collection']=='PEEL_CALM_DIRECT_ARTIST_CONTROLS_V87', r
          assert set(r['custom_shapes_assigned'])==set(r['editable_controls']), r
          assert r['pose_control_max_matrix_delta_from_v86'] <= 1e-9, r
          assert r['vessel_matrix_delta_from_v86'] <= 1e-9, r
          assert r['camera_matrix_delta_from_v86'] <= 1e-9, r
          assert r['vessel_locked'] and r['camera_locked'], r
          assert r['automatic_retarget_used'] is False, r
          assert r['parameter_sweep_used'] is False, r
          assert r['optimizer_used'] is False, r
          print('MPFB_GRIP_HELPER_AUTHORING_PANEL_V87_BOUNDARY_PASS')
          PY

      - name: Upload editable authoring-panel scene
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-grip-helper-authoring-panel-v87
          path: artifacts/mpfb_v87/
          if-no-files-found: error
          retention-days: 14
