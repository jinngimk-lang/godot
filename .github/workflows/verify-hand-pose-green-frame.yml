name: Verify Hand Pose Green Frame

on:
  push:
    branches:
      - verify/hand-pose-green-frame-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit

      - name: Render repaired production frame
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 45s \
            ./godot --path . --display-driver x11 --audio-driver Dummy --rendering-method gl_compatibility \
            --script res://tests/capture_scene.gd 2>&1 | tee hand-pose-green.log
          test -s artifacts/peel_scene.png
          grep -Fq 'HAND_POSE_GREEN left=Default pose right=Pinch Up' hand-pose-green.log
          grep -Fq 'CAPTURE_OK:' hand-pose-green.log
          if grep -E '(^|[[:space:]])(SCRIPT )?ERROR:' hand-pose-green.log; then
            echo "Repaired hand visual capture emitted a Godot error."
            exit 1
          fi

      - name: Upload repaired hand frame
        uses: actions/upload-artifact@v4
        with:
          name: owner-hand-pose-green-frame
          path: |
            artifacts/peel_scene.png
            hand-pose-green.log
          if-no-files-found: error
          retention-days: 7
