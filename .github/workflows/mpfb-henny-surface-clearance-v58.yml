name: MPFB Henny Surface Clearance v58

on:
  push:
    branches:
      - spike/mpfb-henny-surface-clearance-v58
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Acquire official CC0 Henny source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_henny_surface_v58/{source,assets,reports,logs,previews}
          URL='https://files2.makehumancommunity.org/asset_packs/poses02/poses02_cc0.zip'
          curl -L --fail --retry 3 -o artifacts/mpfb_henny_surface_v58/source/poses02_cc0.zip "$URL"
          python tools/extract_makehuman_pose_sources_v56.py \
            artifacts/mpfb_henny_surface_v58/source/poses02_cc0.zip \
            artifacts/mpfb_henny_surface_v58/source/candidates \
            artifacts/mpfb_henny_surface_v58/reports/sources.json \
            2>&1 | tee artifacts/mpfb_henny_surface_v58/logs/source-extract.log
          grep -Fq 'MAKEHUMAN_POSES02_GRIP_SOURCE_V56_SUCCESS' artifacts/mpfb_henny_surface_v58/logs/source-extract.log

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz" | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo "92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz" | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name "MPFB CI" --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Build stable GameEngine human
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_henny_surface_v58/assets/mpfb-human-source.glb \
            artifacts/mpfb_henny_surface_v58/reports/mpfb-human-source.json \
            2>&1 | tee artifacts/mpfb_henny_surface_v58/logs/build.log
          grep -Fq 'MPFB_LIMB_BUILD_SUCCESS' artifacts/mpfb_henny_surface_v58/logs/build.log

      - name: Author frozen Henny pose and solve only whole-limb surface clearance
        shell: bash
        run: |
          set -euo pipefail
          BVH="$(find artifacts/mpfb_henny_surface_v58/source/candidates/henny_cyclist_normal -type f -iname '*.bvh' -print -quit)"
          test -n "$BVH"
          export PEEL_MH_SOURCE_BVH="$PWD/$BVH"
          .preview-tools/blender/blender --background --python tools/author_mpfb_henny_surface_clearance_v58.py -- \
            assets/models/hands/hand_right.glb \
            artifacts/mpfb_henny_surface_v58/assets/mpfb-human-source.glb \
            artifacts/mpfb_henny_surface_v58/previews \
            artifacts/mpfb_henny_surface_v58/assets/right-support-wrap-v58.pose.json \
            artifacts/mpfb_henny_surface_v58/reports/right-support-wrap-v58.json \
            2>&1 | tee artifacts/mpfb_henny_surface_v58/logs/author.log
          grep -Fq 'MPFB_HENNY_SURFACE_CLEARANCE_V58_SUCCESS' artifacts/mpfb_henny_surface_v58/logs/author.log

      - name: Enforce one-variable clearance contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_henny_surface_v58/reports/right-support-wrap-v58.json'))
          s=json.load(open('artifacts/mpfb_henny_surface_v58/reports/sources.json'))
          assert r['staging_only'] is True and r['production_candidate'] is False, r
          assert r['automatic_retarget'] is False and r['retarget_source_transforms_used'] is False, r
          assert r['source_local_rotations_copied'] is False, r
          assert r['source_matrix_basis_copied'] is False, r
          assert r['source_bone_roll_modified'] is False, r
          assert r['source_direction_coefficients_only'] is True, r
          assert r['target_solver_used'] is False and r['bend_toward_center_used'] is False, r
          assert r['finger_joint_changes_after_v57'] is False, r
          assert r['whole_limb_clearance_only'] is True, r
          assert r['pose_bone_count'] == 17, r
          assert r['max_reload_matrix_error'] <= 1e-6, r
          assert r['surface_clearance_outward_shift'] <= 0.065 + 1e-6, r
          assert r['source_bvh_sha256'] == s['candidates']['henny_cyclist_normal']['sha256'], r
          print('HENNY_SURFACE_CLEARANCE_V58_CONTRACT_PASS', {
              'objective_pass': r['surface_clearance_objective_pass'],
              'pre_min': r['surface_clearance_pre_min_radial'],
              'post_min': r['surface_clearance_post_min_radial'],
              'shift': r['surface_clearance_outward_shift'],
          })
          PY
          test -s artifacts/mpfb_henny_surface_v58/previews/henny_surface_clearance_v58_candidate.png
          test -s artifacts/mpfb_henny_surface_v58/previews/henny_surface_clearance_v58_thumbnail.png

      - name: Upload v58 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-henny-surface-clearance-v58
          path: artifacts/mpfb_henny_surface_v58/
          if-no-files-found: error
          retention-days: 14
