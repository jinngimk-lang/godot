name: MPFB Thumb Bone ID v73

on:
  push:
    branches:
      - spike/mpfb-thumb-bone-id-v73
    paths:
      - 'tools/diagnose_mpfb_thumb_bone_id_v73.py'
      - '.github/workflows/mpfb-thumb-bone-id-v73.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  thumb-bone-id:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-thumb-bone-id-v73
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v73/{reports,logs,frames} docs/superpowers/evidence/mpfb-v73
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Render per-bone v65-B thumb influence
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/diagnose_mpfb_thumb_bone_id_v73.py -- \
            bl_ext.mpfb_ci.mpfb artifacts/mpfb_v73/frames artifacts/mpfb_v73/reports/thumb-bone-id-v73.json \
            2>&1 | tee artifacts/mpfb_v73/logs/diagnose.log
          grep -Fq 'MPFB_THUMB_BONE_ID_V73_SUCCESS' artifacts/mpfb_v73/logs/diagnose.log
      - name: Enforce diagnostic-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v73/reports/thumb-bone-id-v73.json'))
          assert r['diagnostic_only'] and not r['production_candidate']
          assert r['base_pose']=='pristine v65-B' and r['pose_changed_from_v65_b'] is False
          assert r['bones']==['finger1-1.R','finger1-2.R','finger1-3.R']
          for bone in r['bones']:
              assert r['screen_metrics']['bones'][bone]['count'] > 0, bone
          print('MPFB_THUMB_BONE_ID_V73_DIAGNOSTIC_PASS')
          PY
      - name: Persist v73 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v73/reports/thumb-bone-id-v73.json docs/superpowers/evidence/mpfb-v73/
          cp artifacts/mpfb_v73/frames/*.png docs/superpowers/evidence/mpfb-v73/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v73
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist thumb bone ID diagnostic v73'
            git pull --rebase origin spike/mpfb-thumb-bone-id-v73
            git push origin HEAD:spike/mpfb-thumb-bone-id-v73
          fi
      - name: Upload v73 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-thumb-bone-id-v73
          path: artifacts/mpfb_v73/
          if-no-files-found: error
          retention-days: 14
