name: MPFB Grip Helper ContactPose v86

on:
  push:
    branches:
      - spike/mpfb-grip-helper-contactpose-v86
    paths:
      - 'tools/author_mpfb_grip_helper_contactpose_v86.py'
      - 'tools/build_mpfb_grip_helper_ghost_v85.py'
      - 'tools/build_mpfb_grip_helper_authoring_v84.py'
      - 'art/reference_sources/contactpose-v79-full6-use-hand1.json'
      - '.github/workflows/mpfb-grip-helper-contactpose-v86.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  single-semantic-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-grip-helper-contactpose-v86

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v86/{scene,reports,logs}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Build exactly one human-reference semantic grip
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/author_mpfb_grip_helper_contactpose_v86.py -- \
            bl_ext.mpfb_ci.mpfb \
            art/reference_sources/contactpose-v79-full6-use-hand1.json \
            artifacts/mpfb_v86/scene \
            artifacts/mpfb_v86/reports/build.json \
            2>&1 | tee artifacts/mpfb_v86/logs/build.log
          grep -Fq 'MPFB_GRIP_HELPER_CONTACTPOSE_V86_SUCCESS' artifacts/mpfb_v86/logs/build.log
          test -s artifacts/mpfb_v86/scene/peel-calm-grip-helper-contactpose-v86.blend
          test -s artifacts/mpfb_v86/scene/v86-support-thumbnail.png
          test -s artifacts/mpfb_v86/scene/v86-support-anatomy.png
          test -s artifacts/mpfb_v86/scene/v86-guide-overlay.png

      - name: Reopen and verify single-candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background artifacts/mpfb_v86/scene/peel-calm-grip-helper-contactpose-v86.blend --python-expr "import bpy,json; arm=bpy.data.objects['MPFB_V84_AuthoringRig']; assert arm['peel_calm_authoring_version']=='v86'; assert bpy.context.scene['peel_calm_visual_verdict']=='PENDING_VISUAL_REVIEW'; assert not bpy.context.scene['production_candidate']; assert not bpy.context.scene['automatic_retarget_used']; assert not bpy.context.scene['parameter_sweep_used']; assert bpy.context.scene['candidate_count']==1; assert bpy.data.objects['LOCKED_VesselProxy'].hide_select; assert bpy.data.objects['LOCKED_V84_Camera'].hide_select; print('MPFB_GRIP_HELPER_CONTACTPOSE_V86_REOPEN_PASS')" 2>&1 | tee artifacts/mpfb_v86/logs/reopen.log
          grep -Fq 'MPFB_GRIP_HELPER_CONTACTPOSE_V86_REOPEN_PASS' artifacts/mpfb_v86/logs/reopen.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v86/reports/build.json'))
          assert r['production_candidate'] is False, r
          assert r['visual_verdict']=='PENDING_VISUAL_REVIEW', r
          assert r['candidate_count']==1, r
          assert r['reference_set']==['bar_v1','market_v1'], r
          assert r['guide_used_for_bone_retarget'] is False, r
          assert r['automatic_retarget_used'] is False, r
          assert r['parameter_sweep_used'] is False, r
          assert r['endpoint_optimizer_used'] is False, r
          assert r['contact_servo_used'] is False, r
          assert r['wrist_changed'] is False, r
          assert r['wrist_matrix_delta'] <= 1e-12, r
          assert r['vessel_locked'] is True and r['camera_locked'] is True, r
          assert r['effective_non_thumb_closure_intent_deg']=={'index':30.6,'middle':42.2,'ring':49.0,'pinky':60.6}, r
          print('MPFB_GRIP_HELPER_CONTACTPOSE_V86_BOUNDARY_PASS')
          PY

      - name: Upload single-candidate visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-grip-helper-contactpose-v86
          path: artifacts/mpfb_v86/
          if-no-files-found: error
          retention-days: 14
