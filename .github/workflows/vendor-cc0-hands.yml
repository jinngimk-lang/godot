name: Vendor CC0 Hand Models

on:
  push:
    branches:
      - assist/rigged-hand-v2
    paths:
      - .github/workflows/vendor-cc0-hands.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authoring branch
        uses: actions/checkout@v4
        with:
          ref: assist/rigged-hand-v2

      - name: Install authoring-only Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -n 2

      - name: Download pinned CC0 source hands
        shell: bash
        env:
          XR_TOOLS_SHA: 2d8db860d1adbee97c0968c4b07afe9348263926
        run: |
          set -euo pipefail
          mkdir -p /tmp/peel-calm-hands assets/models/hands
          base="https://raw.githubusercontent.com/GodotVR/godot-xr-tools/${XR_TOOLS_SHA}/addons/godot-xr-tools/hands"
          curl -L --fail --retry 3 "$base/blend/hand_l.blend" -o /tmp/peel-calm-hands/hand_l.blend
          curl -L --fail --retry 3 "$base/blend/hand_r.blend" -o /tmp/peel-calm-hands/hand_r.blend
          curl -L --fail --retry 3 "$base/License.md" -o assets/models/hands/GODOT_XR_TOOLS_HANDS_CC0.md
          curl -L --fail --retry 3 "$base/About.md" -o /tmp/peel-calm-hands/About.md
          test -s /tmp/peel-calm-hands/hand_l.blend
          test -s /tmp/peel-calm-hands/hand_r.blend
          grep -q "CC0 1.0 Universal" assets/models/hands/GODOT_XR_TOOLS_HANDS_CC0.md

      - name: Export repository-local GLB hands
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/peel-calm-hands/export_glb.py <<'PY'
          import bpy
          import sys
          from pathlib import Path

          target = Path(sys.argv[-1]).resolve()
          for obj in list(bpy.data.objects):
              if obj.type in {"CAMERA", "LIGHT"}:
                  bpy.data.objects.remove(obj, do_unlink=True)

          target.parent.mkdir(parents=True, exist_ok=True)
          bpy.ops.export_scene.gltf(
              filepath=str(target),
              export_format="GLB",
              export_yup=True,
              export_apply=False,
              export_animations=True,
              export_skins=True,
              export_materials="EXPORT",
          )
          if not target.exists() or target.stat().st_size < 4096:
              raise RuntimeError(f"GLB export missing or unexpectedly small: {target}")
          print(f"exported {target} ({target.stat().st_size} bytes)")
          PY

          blender -b /tmp/peel-calm-hands/hand_l.blend --python /tmp/peel-calm-hands/export_glb.py -- assets/models/hands/hand_left.glb
          blender -b /tmp/peel-calm-hands/hand_r.blend --python /tmp/peel-calm-hands/export_glb.py -- assets/models/hands/hand_right.glb
          test -s assets/models/hands/hand_left.glb
          test -s assets/models/hands/hand_right.glb
          sha256sum assets/models/hands/hand_left.glb assets/models/hands/hand_right.glb

      - name: Record source and conversion ledger
        shell: bash
        run: |
          set -euo pipefail
          cat > assets/models/hands/ATTRIBUTION.md <<'EOF'
          # Hand model provenance

          ## Godot XR Tools hand models

          - Upstream project: `GodotVR/godot-xr-tools`
          - Upstream pinned commit: `2d8db860d1adbee97c0968c4b07afe9348263926`
          - Source files: `addons/godot-xr-tools/hands/blend/hand_l.blend` and `hand_r.blend`
          - Original hand-model author credited upstream: DigitalN8m4r3 / Miodrag Sejic
          - Upstream creation note: MakeHuman Community Edition base, modified in Blender 3D, textured in Substance Painter
          - License: CC0 1.0 Universal; a verbatim upstream license copy is stored as `GODOT_XR_TOOLS_HANDS_CC0.md`
          - Local files: `hand_left.glb`, `hand_right.glb`
          - Local modification: format conversion from the pinned `.blend` sources to self-contained glTF 2.0 binary (`.glb`); cameras/lights removed; mesh, armature/skin, materials and source animations retained where exportable
          - Runtime dependency: none on Blender or Godot XR Tools; these GLBs are repository-local presentation assets

          The game does not vendor the Godot XR Tools addon. Its hand assets are consumed behind Peel Calm's own hand presentation contract.
          EOF

      - name: Commit vendored assets and remove one-time writer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/hands
          git rm .github/workflows/vendor-cc0-hands.yml
          git commit -m "assets: vendor CC0 rigged hand GLBs"
          git push origin HEAD:assist/rigged-hand-v2
