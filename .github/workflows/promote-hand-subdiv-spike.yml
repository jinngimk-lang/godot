name: Promote hand subdivision spike

on:
  push:
    branches:
      - spike/hero-hand-subdiv-v91

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[hand-subdiv-promoted]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/hero-hand-subdiv-v91
          fetch-depth: 1
      - name: Download prior same-repo candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/9281903731/zip > /tmp/hand-subdiv.zip
          rm -rf /tmp/hand-subdiv
          mkdir -p /tmp/hand-subdiv
          unzip -q /tmp/hand-subdiv.zip -d /tmp/hand-subdiv
          test -f /tmp/hand-subdiv/hand_left_subdiv.glb
          test -f /tmp/hand-subdiv/hand_right_subdiv.glb
          cp /tmp/hand-subdiv/hand_left_subdiv.glb assets/models/hands/hand_left.glb
          cp /tmp/hand-subdiv/hand_right_subdiv.glb assets/models/hands/hand_right.glb
          rm .github/workflows/promote-hand-subdiv-spike.yml
      - name: Commit binary spike candidate and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/hands/hand_left.glb assets/models/hands/hand_right.glb .github/workflows/promote-hand-subdiv-spike.yml
          git commit -m "spike: runtime-test subdivided authored hands [hand-subdiv-promoted]"
          git push origin HEAD:spike/hero-hand-subdiv-v91
