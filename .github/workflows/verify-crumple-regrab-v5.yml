name: Verify Crumple Regrab V5

on:
  push:
    branches:
      - verify/challenge-crumple-regrab-v5

permissions:
  contents: read

jobs:
  verify-regrab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR: Parse Error|ERROR: Failed to load script" godot-import.log; then
            exit 1
          fi

      - name: Repeated crumple re-grab verifier
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s ./godot --headless --path . --script res://tests/verify_crumple_regrab_v5.gd 2>&1 | tee crumple-regrab.log
