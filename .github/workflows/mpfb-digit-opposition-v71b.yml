name: MPFB Digit Opposition Diagnostic v71b

on:
  push:
    branches:
      - spike/mpfb-hero-limb-digit-opposition-v71b
    paths:
      - 'tools/diagnose_mpfb_digit_opposition_v71b.py'
      - '.github/workflows/mpfb-digit-opposition-v71b.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  digit-opposition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-digit-opposition-v71b

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v71b/{renders,reports,logs} docs/superpowers/evidence/mpfb-v71b
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Render and measure frozen v65-B digit opposition
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/diagnose_mpfb_digit_opposition_v71b.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_v71b/renders \
            artifacts/mpfb_v71b/reports/digit-opposition-v71b.json \
            2>&1 | tee artifacts/mpfb_v71b/logs/diagnose.log
          grep -Fq 'MPFB_DIGIT_OPPOSITION_V71B_SUCCESS' artifacts/mpfb_v71b/logs/diagnose.log

      - name: Enforce render-space-only diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/mpfb_v71b/reports/digit-opposition-v71b.json')
          r=json.load(p.open())
          assert r['diagnostic_only'] is True and r['production_candidate'] is False, r
          assert r['pose_authored_in_v71b'] is False and r['base_pose']=='pristine v65-B', r
          assert r['render_space_only'] is True and r['bone_projection_used'] is False, r
          assert r['screen']=={'width':192,'height':108}, r
          assert r['reference_set']==['bar_v1','market_v1'], r
          assert set(r['digit_signed_side_px'])=={'thumb','index','middle','ring','pinky'}, r
          assert r['vessel_centerline']['row_count'] >= 8, r
          image=Path('artifacts/mpfb_v71b/renders/digit-opposition-v65b-192x108.png')
          assert image.is_file() and image.stat().st_size>0, image
          print('MPFB_DIGIT_OPPOSITION_V71B_CONTRACT_PASS')
          print(json.dumps({
            'digit_sides':r['digit_signed_side_px'],
            'median_four_finger_side_px':r['median_four_finger_side_px'],
            'thumb_side_px':r['thumb_side_px'],
            'opposite_sign':r['thumb_and_fingers_have_opposite_sign'],
            'thumb_touches_top':r['masks']['thumb']['touches_top'],
            'gate':r['screen_space_opposition_gate'],
          },indent=2))
          PY

      - name: Persist v71b evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v71b/reports/digit-opposition-v71b.json docs/superpowers/evidence/mpfb-v71b/
          cp artifacts/mpfb_v71b/renders/*.png docs/superpowers/evidence/mpfb-v71b/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v71b
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist digit opposition diagnostic v71b'
            git pull --rebase origin spike/mpfb-hero-limb-digit-opposition-v71b
            git push origin HEAD:spike/mpfb-hero-limb-digit-opposition-v71b
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-digit-opposition-v71b
          path: artifacts/mpfb_v71b/
          if-no-files-found: error
          retention-days: 14
