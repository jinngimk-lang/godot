name: MPFB Authored Support v47

on:
  push:
    branches:
      - spike/mpfb-hero-limb-authored-support-v47
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_authored_support_v47/{assets,reports,logs,previews}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz" | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo "92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz" | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name "MPFB CI" --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Build and extract continuous right hero limb
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- bl_ext.mpfb_ci.mpfb artifacts/mpfb_authored_support_v47/assets/mpfb-human-source.glb artifacts/mpfb_authored_support_v47/reports/mpfb-human-source.json 2>&1 | tee artifacts/mpfb_authored_support_v47/logs/build.log
          grep -Fq "MPFB_LIMB_BUILD_SUCCESS" artifacts/mpfb_authored_support_v47/logs/build.log
          .preview-tools/blender/blender --background --python tools/extract_mpfb_hero_limb.py -- artifacts/mpfb_authored_support_v47/assets/mpfb-human-source.glb right artifacts/mpfb_authored_support_v47/assets/mpfb-right-hero-limb.glb artifacts/mpfb_authored_support_v47/reports/mpfb-right-hero-limb.json 2>&1 | tee artifacts/mpfb_authored_support_v47/logs/extract-right.log
          grep -Fq "MPFB_HERO_LIMB_EXTRACT_SUCCESS" artifacts/mpfb_authored_support_v47/logs/extract-right.log
      - name: Render one artist-authored support grasp
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/render_mpfb_authored_support_v47.py -- assets/models/hands/hand_right.glb artifacts/mpfb_authored_support_v47/assets/mpfb-right-hero-limb.glb artifacts/mpfb_authored_support_v47/previews 2>&1 | tee artifacts/mpfb_authored_support_v47/logs/authored-support-v47.log
          grep -Fq "MPFB_AUTHORED_SUPPORT_V47_SUCCESS" artifacts/mpfb_authored_support_v47/logs/authored-support-v47.log
          test "$(find artifacts/mpfb_authored_support_v47/previews -name 'authored_support_v47_*.png' | wc -l)" -eq 2
      - name: Export reconstructable visual grid
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/export_render_rgbhex.py -- artifacts/mpfb_authored_support_v47/previews/authored_support_v47_full.png artifacts/mpfb_authored_support_v47/previews/authored_support_v47_128.rgbhex 128 128
          grep -Fq "RGBHEX 128 128" artifacts/mpfb_authored_support_v47/previews/authored_support_v47_128.rgbhex
      - name: Persist visual evidence on the staging branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/superpowers/evidence/mpfb-v47
          cp artifacts/mpfb_authored_support_v47/previews/authored_support_v47_full.png docs/superpowers/evidence/mpfb-v47/authored-support-full.png
          cp artifacts/mpfb_authored_support_v47/previews/authored_support_v47_thumbnail.png docs/superpowers/evidence/mpfb-v47/authored-support-thumbnail.png
          cp artifacts/mpfb_authored_support_v47/previews/authored_support_v47_128.rgbhex docs/superpowers/evidence/mpfb-v47/authored-support-128.rgbhex
          cp artifacts/mpfb_authored_support_v47/logs/authored-support-v47.log docs/superpowers/evidence/mpfb-v47/authored-support-v47.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/evidence/mpfb-v47
          if ! git diff --cached --quiet; then
            git commit -m "art: persist v47 authored support evidence"
            git push
          fi
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-authored-support-v47
          path: artifacts/mpfb_authored_support_v47/
          if-no-files-found: error
          retention-days: 14
