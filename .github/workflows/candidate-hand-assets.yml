name: Candidate Renderable Hand Assets

on:
  push:
    branches:
      - assist/fix-authored-hand-render-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install authoring and display tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri libglx-mesa0
          blender --version

      - name: Download pinned CC0 hand sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hand-src
          base="https://raw.githubusercontent.com/GodotVR/godot-xr-tools/2d8db860d1adbee97c0968c4b07afe9348263926/addons/godot-xr-tools/hands/blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/hand_l.blend "$base/hand_l.blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/hand_r.blend "$base/hand_r.blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/animations_hand_l.blend "$base/animations/animations_hand_l.blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/animations_hand_r.blend "$base/animations/animations_hand_r.blend"

      - name: Combine semi-realistic meshes, materials and authored actions
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/models/hands/hand_left.glb assets/models/hands/hand_right.glb

          cat > /tmp/build_hand.py <<'PY'
          import bpy
          import os
          import sys

          args = sys.argv[sys.argv.index("--") + 1:]
          static_path, animation_path, output_path, suffix = args
          bpy.ops.wm.open_mainfile(filepath=static_path)

          armature = bpy.data.objects.get("Armature")
          if armature is None or armature.type != "ARMATURE":
              raise RuntimeError("static hand source has no Armature object")
          if len(armature.data.bones) != 26:
              raise RuntimeError(f"unexpected armature bone count: {len(armature.data.bones)}")

          hand = bpy.data.objects.get(f"mesh_Hand_{suffix}")
          nails = bpy.data.objects.get(f"mesh_Hand_Nails_{suffix}")
          for obj, label in [(hand, "hand"), (nails, "nails")]:
              if obj is None or obj.type != "MESH" or len(obj.data.vertices) <= 0:
                  raise RuntimeError(f"required {label} render mesh missing or empty")
              obj.hide_viewport = False
              obj.hide_render = False
              obj.hide_select = False
              obj.hide_set(False)
          print("CANDIDATE_SOURCE_MESHES", [(hand.name, len(hand.data.vertices)), (nails.name, len(nails.data.vertices))])

          def make_material(name, base_color, roughness):
              mat = bpy.data.materials.get(name) or bpy.data.materials.new(name=name)
              mat.name = name
              mat.use_nodes = True
              mat.diffuse_color = base_color
              bsdf = mat.node_tree.nodes.get("Principled BSDF")
              if bsdf is None:
                  raise RuntimeError(f"{name} has no Principled BSDF")
              bsdf.inputs["Base Color"].default_value = base_color
              bsdf.inputs["Roughness"].default_value = roughness
              bsdf.inputs["Metallic"].default_value = 0.0
              return mat

          skin = make_material("HandSkin", (0.72, 0.46, 0.35, 1.0), 0.62)
          nail = make_material("HandNail", (0.90, 0.67, 0.61, 1.0), 0.46)
          hand.data.materials.clear()
          hand.data.materials.append(skin)
          nails.data.materials.clear()
          nails.data.materials.append(nail)

          bpy.ops.object.select_all(action="DESELECT")
          hand.select_set(True)
          nails.select_set(True)
          bpy.context.view_layer.objects.active = hand
          selected = [obj.name for obj in bpy.context.selected_objects]
          if hand.name not in selected or nails.name not in selected:
              raise RuntimeError(f"hand+nails were not both selected for join: {selected}")
          bpy.ops.object.join()
          joined = bpy.context.view_layer.objects.active
          joined.name = f"PeelCalmHand_{suffix}"
          if len(joined.data.vertices) < 3000:
              raise RuntimeError(f"joined hand+nails lost geometry: {len(joined.data.vertices)} vertices")
          material_names = [slot.material.name if slot.material else "" for slot in joined.material_slots]
          if "HandSkin" not in material_names or "HandNail" not in material_names:
              raise RuntimeError(f"joined hand lost semantic material slots: {material_names}")
          print("CANDIDATE_JOINED", joined.name, len(joined.data.vertices), material_names)

          with bpy.data.libraries.load(animation_path, link=False) as (data_from, data_to):
              data_to.actions = list(data_from.actions)
          actions = [action for action in data_to.actions if action is not None]
          action_names = [action.name for action in actions]
          for required in ["Default pose", "Cup", "Hold", "Pinch Tight", "Pinch Up"]:
              if required not in action_names:
                  raise RuntimeError(f"required authored action missing after append: {required}")
          print("CANDIDATE_ACTIONS", action_names)

          armature.animation_data_create()
          armature.animation_data.action = bpy.data.actions.get("Default pose")

          bpy.ops.object.select_all(action="DESELECT")
          armature.hide_set(False)
          armature.hide_select = False
          armature.select_set(True)
          joined.select_set(True)
          bpy.context.view_layer.objects.active = armature

          operator = bpy.ops.export_scene.gltf
          rna = operator.get_rna_type()
          properties = set(rna.properties.keys())
          kwargs = {
              "filepath": output_path,
              "export_format": "GLB",
              "use_selection": True,
              "export_animations": True,
              "export_skins": True,
          }
          if "export_animation_mode" in properties:
              enum_items = [item.identifier for item in rna.properties["export_animation_mode"].enum_items]
              if "ACTIONS" in enum_items:
                  kwargs["export_animation_mode"] = "ACTIONS"
              elif "ACTIVE_ACTIONS" in enum_items:
                  kwargs["export_animation_mode"] = "ACTIVE_ACTIONS"
          if "export_nla_strips" in properties and "export_animation_mode" not in kwargs:
              kwargs["export_nla_strips"] = False
          if "export_force_sampling" in properties:
              kwargs["export_force_sampling"] = True

          print("GLTF_EXPORT_KWARGS", kwargs)
          result = operator(**kwargs)
          if "FINISHED" not in result:
              raise RuntimeError(f"glTF export did not finish: {result}")
          if not os.path.exists(output_path) or os.path.getsize(output_path) <= 4096:
              raise RuntimeError("candidate GLB missing or implausibly small")
          print("CANDIDATE_GLB", output_path, os.path.getsize(output_path))
          PY

          blender -b --python /tmp/build_hand.py -- \
            /tmp/hand-src/hand_l.blend /tmp/hand-src/animations_hand_l.blend \
            "$GITHUB_WORKSPACE/assets/models/hands/hand_left.glb" L 2>&1 | tee /tmp/build-left.log
          grep -q '^CANDIDATE_GLB ' /tmp/build-left.log
          test -s assets/models/hands/hand_left.glb

          blender -b --python /tmp/build_hand.py -- \
            /tmp/hand-src/hand_r.blend /tmp/hand-src/animations_hand_r.blend \
            "$GITHUB_WORKSPACE/assets/models/hands/hand_right.glb" R 2>&1 | tee /tmp/build-right.log
          grep -q '^CANDIDATE_GLB ' /tmp/build-right.log
          test -s assets/models/hands/hand_right.glb

          sha256sum assets/models/hands/hand_left.glb assets/models/hands/hand_right.glb
          ls -lh assets/models/hands/hand_*.glb

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and run canonical tests against candidate assets
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee candidate-import.log
          if grep -E "SCRIPT ERROR: Parse Error|ERROR: Failed to load script" candidate-import.log; then
            echo "Godot reported a script parse/load failure during candidate import."
            exit 1
          fi
          ./godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee candidate-tests.log
          ./godot --headless --path . --script res://tests/smoke_scene.gd 2>&1 | tee candidate-smoke.log

      - name: Capture candidate scene frame
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          cat > tests/_candidate_capture.gd <<'GD'
          extends SceneTree

          func _init() -> void:
            call_deferred("_run")

          func _run() -> void:
            var packed := load("res://scenes/peel_lab/peel_lab.tscn") as PackedScene
            if packed == null:
              push_error("CANDIDATE_CAPTURE: scene failed to load")
              quit(1)
              return
            var scene := packed.instantiate()
            root.add_child(scene)
            for _frame in range(24):
              await process_frame
            for hand_name in ["LeftHand", "RightHand"]:
              var hand := scene.get_node_or_null(hand_name)
              var meshes: Array[MeshInstance3D] = []
              if hand != null:
                _collect_meshes(hand, meshes)
              var vertices := 0
              var materials: Array[String] = []
              for mesh_instance in meshes:
                if mesh_instance.mesh == null:
                  continue
                for surface_index in range(mesh_instance.mesh.get_surface_count()):
                  var arrays := mesh_instance.mesh.surface_get_arrays(surface_index)
                  if arrays.size() > Mesh.ARRAY_VERTEX and arrays[Mesh.ARRAY_VERTEX] is PackedVector3Array:
                    vertices += (arrays[Mesh.ARRAY_VERTEX] as PackedVector3Array).size()
                  var material := mesh_instance.mesh.surface_get_material(surface_index)
                  if material != null and not material.resource_name.is_empty() and not materials.has(material.resource_name):
                    materials.append(material.resource_name)
              print("CANDIDATE_HAND_DIAG %s meshes=%d vertices=%d materials=%s" % [hand_name, meshes.size(), vertices, str(materials)])
              if meshes.is_empty() or vertices <= 0 or not materials.has("HandSkin") or not materials.has("HandNail"):
                push_error("CANDIDATE_CAPTURE: %s does not have complete render presentation" % hand_name)
                quit(1)
                return
            var image := root.get_texture().get_image()
            if image == null or image.is_empty():
              push_error("CANDIDATE_CAPTURE: viewport image empty")
              quit(1)
              return
            DirAccess.make_dir_recursive_absolute(OS.get_environment("GITHUB_WORKSPACE").path_join("artifacts"))
            var path := OS.get_environment("GITHUB_WORKSPACE").path_join("artifacts/peel_scene_candidate.png")
            var err := image.save_png(path)
            if err != OK:
              push_error("CANDIDATE_CAPTURE: save failed")
              quit(1)
              return
            print("CANDIDATE_CAPTURE_OK: %s" % path)
            scene.queue_free()
            await process_frame
            quit(0)

          func _collect_meshes(node: Node, output: Array[MeshInstance3D]) -> void:
            if node is MeshInstance3D:
              output.append(node as MeshInstance3D)
            for child in node.get_children():
              _collect_meshes(child, output)
          GD
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 45s \
            ./godot --path . --display-driver x11 --rendering-method gl_compatibility \
            --script res://tests/_candidate_capture.gd 2>&1 | tee candidate-capture.log
          test -s artifacts/peel_scene_candidate.png
          file artifacts/peel_scene_candidate.png

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: renderable-hand-candidate
          path: |
            assets/models/hands/hand_left.glb
            assets/models/hands/hand_right.glb
            artifacts/peel_scene_candidate.png
            candidate-import.log
            candidate-tests.log
            candidate-smoke.log
            candidate-capture.log
            /tmp/build-left.log
            /tmp/build-right.log
          if-no-files-found: error
          retention-days: 7
