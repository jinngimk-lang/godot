name: PR53 Exact-Head Local Challenger V2

on:
  push:
    branches:
      - verify/pr53-local-challenger-v1

permissions:
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact PR53 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 446981e0ef97915268883577911b03dd6b4f289c
          git checkout --detach 446981e0ef97915268883577911b03dd6b4f289c
          test "$(git rev-parse HEAD)" = "446981e0ef97915268883577911b03dd6b4f289c"
          git fetch origin main:refs/remotes/origin/main

      - name: Deterministic scope and ownership guards
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = "tests/capture_reference_frames.gd"
          grep -Fq 'scene.set_process(false)' tests/capture_reference_frames.gd
          grep -Fq 'scene.set_process(true)' tests/capture_reference_frames.gd
          grep -Fq '_assert_staged_peel_survived_settle' tests/capture_reference_frames.gd
          test "$(grep -c '_assert_staged_peel_survived_settle(scene,' tests/capture_reference_frames.gd)" -eq 3
          test "$(grep -c '_resume_hand_choreography(scene)' tests/capture_reference_frames.gd)" -eq 3
          grep -Fq '_right_hand.set_pinch_amount(_interaction_presentation.derive_pinch_amount(_peel))' scripts/peel_lab.gd
          grep -Fq '_right_hand.tick(delta)' scripts/peel_lab.gd

      - name: Prepare minimal exact-head packet
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'EXPECTED_HEAD_SHA=446981e0ef97915268883577911b03dd6b4f289c'
            echo '=== EXACT PR DIFF ==='
            git diff --unified=50 origin/main...HEAD -- tests/capture_reference_frames.gd
            echo '=== CURRENT CAPTURE HELPER ==='
            cat tests/capture_reference_frames.gd
            echo '=== CHOREOGRAPHY PROCESS OWNER ==='
            sed -n '1,150p' scripts/presentation/hand_choreography_presentation.gd
            echo '=== HANDVISUAL TICK/POSE CONTRACT ==='
            sed -n '25,95p' scripts/hands/hand_visual.gd
            sed -n '145,195p' scripts/hands/hand_visual.gd
            echo '=== PEELLAB PROCESS OWNER ==='
            grep -n -B18 -A28 '_right_hand.tick(delta)' scripts/peel_lab.gd
          } > /tmp/review-packet.txt
          bytes="$(wc -c < /tmp/review-packet.txt)"
          echo "review packet bytes=$bytes"
          test "$bytes" -lt 26000

      - name: Install local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 &
          for _ in {1..40}; do
            if ollama list >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-server.log
          exit 1

      - name: Pull local code model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5-coder:3b

      - name: Run constrained adversarial analysis
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'PROMPT'
          You are an independent CHALLENGER. Review ONLY the exact changed capture helper and directly invoked ownership contracts in this packet.

          Candidate: 446981e0ef97915268883577911b03dd6b4f289c
          Changed path: tests/capture_reference_frames.gd only.

          Builder claim: while a test-owned partial-peel screenshot waits five settle frames, it freezes BOTH mutation owners that previously overwrite the staged right hand: PeelLab._process() and HandChoreographyPresentation. It then asserts after settling that pose is still Pinch Tight and pinch world position remains within 0.5 mm of the staged grip, writes the screenshot, removes capture metadata, and restores both process owners before continuing.

          A NEEDS_FIX defect MUST cite a changed capture behavior or a directly invoked production ownership contract included here and describe a concrete execution path defeating truthfulness or cleanup. Unchanged tests, formatting style, subjective hand aesthetics, and parse/syntax claims are out of scope; exact-head Godot 4.7.1 already parsed and executed this file successfully.

          Attack these five points:
          1. Can anything included here still mutate RightHand during the five settle frames?
          2. Can scene/choreography processing remain disabled after a successful partial-peel capture and contaminate the next variant?
          3. Can the post-settle pose/contact assertion pass while the screenshot hand is materially elsewhere because of coordinate-space mismatch?
          4. Does freezing PeelLab._process() suppress required label/residue evolution even though those states are staged directly before settling?
          5. Is capture metadata cleaned between variants?

          If no concrete counterexample survives, explicitly conclude VERIFIED. If one does, conclude NEEDS_FIX with exact evidence. Do not output code.
          PROMPT
            cat /tmp/review-packet.txt
          } > /tmp/review-prompt.txt
          ollama run qwen2.5-coder:3b < /tmp/review-prompt.txt | tee /tmp/review-analysis.txt
          test -s /tmp/review-analysis.txt

      - name: Normalize structured verdict
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg analysis "$(head -c 12000 /tmp/review-analysis.txt)" \
            '{model:"qwen2.5-coder:3b",stream:false,prompt:("Normalize only the conclusion supported by this constrained review. A NEEDS_FIX defect is valid only if it cites the changed capture helper or directly included ownership path and gives a concrete counterexample. Unrelated unchanged-code or syntax claims are invalid. If no valid counterexample exists, verdict VERIFIED.\n"+$analysis),format:{type:"object",properties:{verdict:{type:"string",enum:["VERIFIED","NEEDS_FIX"]},defect:{type:"string"},min_test:{type:"string"},evidence:{type:"string"}},required:["verdict","defect","min_test","evidence"],additionalProperties:false}}' > /tmp/request.json
          curl -fsS http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' --data-binary @/tmp/request.json > /tmp/response.json
          jq -er '.response' /tmp/response.json | jq -r . > /tmp/verdict.json
          verdict="$(jq -er '.verdict | select(. == "VERIFIED" or . == "NEEDS_FIX")' /tmp/verdict.json)"
          defect="$(jq -er '.defect | strings' /tmp/verdict.json)"
          min_test="$(jq -er '.min_test | strings' /tmp/verdict.json)"
          evidence="$(jq -er '.evidence | strings' /tmp/verdict.json)"
          {
            printf 'VERDICT: %s\n' "$verdict"
            printf 'DEFECT: %s\n' "$defect"
            printf 'MIN_TEST: %s\n' "$min_test"
            printf 'EVIDENCE: %s\n' "$evidence"
          } | tee /tmp/review-report.txt
          test "$(wc -l < /tmp/review-report.txt)" -eq 4
          grep -Fxq 'VERDICT: VERIFIED' /tmp/review-report.txt
