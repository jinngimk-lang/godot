name: MPFB Same-Family Swing Retarget v61

on:
  push:
    branches:
      - spike/mpfb-hero-limb-samefamily-retarget-v61
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-samefamily-retarget-v61

      - name: Acquire official CC0 holding-object source pose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mpfb_samefamily_v61/{source,assets,reports,renders,logs} .preview-tools
          URL='https://files2.makehumancommunity.org/asset_packs/poses01/poses01_cc0.zip'
          curl -L --fail --retry 3 -o artifacts/mpfb_samefamily_v61/source/poses01_cc0.zip "$URL"
          sha256sum artifacts/mpfb_samefamily_v61/source/poses01_cc0.zip | tee artifacts/mpfb_samefamily_v61/reports/poses01-pack.sha256
          printf '%s\n' "$URL" > artifacts/mpfb_samefamily_v61/reports/source-url.txt
          python tools/inspect_makehuman_pose_v50.py \
            artifacts/mpfb_samefamily_v61/source/poses01_cc0.zip \
            artifacts/mpfb_samefamily_v61/source/holding-wine-glass \
            artifacts/mpfb_samefamily_v61/reports/source-pose.json \
            2>&1 | tee artifacts/mpfb_samefamily_v61/logs/inspect.log
          grep -Fq 'MAKEHUMAN_POSE_REFERENCE_V50_INSPECT_SUCCESS' artifacts/mpfb_samefamily_v61/logs/inspect.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_samefamily_v61/reports/source-pose.json'))
          assert r['declared_license_from_official_pack_page'] == 'CC0', r
          assert r['production_candidate'] is False, r
          print('V61_SOURCE_PROVENANCE_PASS', r['source_pack_sha256'])
          PY

      - name: Install headless runtime, pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools/extensions
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Build continuous target MPFB rig
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_samefamily_v61/assets/mpfb-human-source.glb \
            artifacts/mpfb_samefamily_v61/reports/mpfb-human-source.json \
            2>&1 | tee artifacts/mpfb_samefamily_v61/logs/build.log
          grep -Fq 'MPFB_LIMB_BUILD_SUCCESS' artifacts/mpfb_samefamily_v61/logs/build.log

      - name: Retarget source anatomy as target-rig swing only
        shell: bash
        run: |
          set -euo pipefail
          BVH="$(find artifacts/mpfb_samefamily_v61/source/holding-wine-glass -type f -iname '*.bvh' -print -quit)"
          test -n "$BVH"
          .preview-tools/blender/blender --background --python tools/retarget_mpfb_samefamily_swing_v61.py -- \
            assets/models/hands/hand_right.glb \
            artifacts/mpfb_samefamily_v61/assets/mpfb-human-source.glb \
            "$BVH" \
            artifacts/mpfb_samefamily_v61/renders \
            artifacts/mpfb_samefamily_v61/assets/right-support-wrap-v61.pose.json \
            artifacts/mpfb_samefamily_v61/reports/right-support-wrap-v61.json \
            2>&1 | tee artifacts/mpfb_samefamily_v61/logs/retarget.log
          grep -Fq 'MPFB_SAMEFAMILY_SWING_V61_SUCCESS' artifacts/mpfb_samefamily_v61/logs/retarget.log
          test -s artifacts/mpfb_samefamily_v61/renders/samefamily_swing_v61_candidate.png
          test -s artifacts/mpfb_samefamily_v61/renders/samefamily_swing_v61_thumbnail.png

      - name: Enforce non-destructive retarget contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_samefamily_v61/reports/right-support-wrap-v61.json'))
          assert r['staging_only'] is True, r
          assert r['production_candidate'] is False, r
          assert r['source_license'] == 'CC0', r
          assert r['source_edit_bone_roll_copied'] is False, r
          assert r['source_pose_matrices_copied'] is False, r
          assert r['source_twist_copied'] is False, r
          assert r['target_edit_rest_modified'] is False, r
          assert r['target_solver_used'] is False, r
          assert r['camera_focus_preserves_pose'] is True, r
          assert r['pose_bone_count'] == 17, r
          assert r['mapped_digit_bone_count'] == 15, r
          assert r['max_reload_matrix_error'] <= 1e-6, r
          print('MPFB_SAMEFAMILY_SWING_V61_CONTRACT_PASS')
          PY

      - name: Upload visual and pose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-samefamily-retarget-v61
          path: artifacts/mpfb_samefamily_v61/
          if-no-files-found: error
          retention-days: 14
