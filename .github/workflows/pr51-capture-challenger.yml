name: PR51 Capture Independent Challenger

on:
  push:
    branches: [verify/pr51-capture-challenger-v1]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR_NUMBER: "51"
      EXPECTED_HEAD_SHA: "e85f79d0dc2c75c1e1aa99dde29ab099d7ed19d0"
    steps:
      - name: Checkout verifier definition
        uses: actions/checkout@v4

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact scope and build focused packet
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --depth=1
          current_head="$(git rev-parse HEAD)"
          test "$current_head" = "$EXPECTED_HEAD_SHA"
          files="$(git diff --name-only origin/main...HEAD)"
          test "$files" = "tests/capture_reference_frames.gd" || {
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$files" >&2
            exit 1
          }
          if git diff --name-only origin/main...HEAD -- scripts scenes assets project.godot | grep -q .; then
            echo "Capture-only claim falsified: production/runtime files changed." >&2
            exit 1
          fi
          {
            echo "=== EXACT DIFF ==="
            git diff origin/main...HEAD -- tests/capture_reference_frames.gd
            echo "=== HAND TICK CONTRACT ==="
            awk '/^func tick\(/,/^func _ensure_anchors\(/' scripts/hands/hand_visual.gd
            echo "=== POSE SELECTION CONTRACT ==="
            awk '/^func _apply_pose\(/,/^func _apply_authored_pose\(/' scripts/hands/hand_visual.gd
            echo "=== ANCHOR REFRESH CONTRACT ==="
            awk '/^func _refresh_pinch_anchors\(/,/^func _estimate_bone_tip\(/' scripts/hands/hand_visual.gd
            echo "=== FULL CAPTURE STAGING ==="
            cat tests/capture_reference_frames.gd
          } > /tmp/focused-packet.txt
          wc -c /tmp/focused-packet.txt
          test "$(wc -c < /tmp/focused-packet.txt)" -lt 24000

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 ./godot
          chmod +x ./godot

      - name: Independent deterministic verification
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit
          ./godot --headless --path . --script res://tests/test_runner.gd
          ./godot --headless --path . --script res://tests/smoke_scene.gd
          xvfb-run -a ./godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/capture_reference_frames.gd 2>&1 | tee /tmp/capture.log
          grep -Fq 'PASS: captured base + peel + crumple/inspect visual-convergence frames' /tmp/capture.log
          ! grep -Fq 'CAPTURE_RED:' /tmp/capture.log

      - name: Install local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 &
          for _ in {1..40}; do
            ollama list >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/ollama-server.log
          exit 1

      - name: Pull independent local model
        shell: bash
        run: ollama pull qwen2.5-coder:3b

      - name: Challenge capture-only claim
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'PROMPT'
          You are an independent adversarial reviewer. Review ONLY the focused exact-head packet and deterministic capture result below.
          The implementation author claims:
          A. The PR changes only reference-frame staging, not live gameplay.
          B. Before the PR, _stage_peel set pinch_target=1.0 but tick(0.0) could not advance the smoothed _pinch_amount, so the capture could remain in Pinch Up instead of the intended active Pinch Tight pose.
          C. The current revision deliberately does NOT call tick with nonzero delta. It snaps only capture-owned smoothed pinch state, applies the existing pose and anchor refresh, then translates the hand root by exactly grip_world-current_pinch.
          D. The capture now deterministically fails if _last_authored_pose is not Pinch Tight or if get_pinch_world_position() differs from grip_world by more than 0.5 mm. The independent capture run passed those gates for all staged peel frames.
          E. Therefore the evidence path no longer needs root-follow simulation to establish position truthfulness; exact alignment is directly asserted after the pose refresh.
          F. This PR does not claim that the pose is visually reference-quality; it only repairs evidence truthfulness.

          Try to falsify those claims. A valid NEEDS_FIX must identify a concrete way the exact-head capture can pass both deterministic gates while still failing the claimed evidence semantics, or a way these test-only private calls leak into production/runtime behavior. Do not repeat the already-tested generic concern that tick normally updates root position: this capture deliberately performs exact root alignment and asserts its result.

          Respond with exactly four lines and no terminal control codes:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: none
          EVIDENCE: <concise adversarial reason>

          If you find a concrete defect, use VERDICT: NEEDS_FIX and give the exact deterministic reproducer in MIN_TEST.
          PROMPT
            cat /tmp/focused-packet.txt
            echo "=== INDEPENDENT CAPTURE RESULT ==="
            cat /tmp/capture.log
          } > /tmp/prompt.txt
          raw="$(ollama run qwen2.5-coder:3b < /tmp/prompt.txt)"
          printf '%s\n' "$raw" | sed -r 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' > /tmp/report.txt
          cat /tmp/report.txt
          grep -Eq '^VERDICT: (VERIFIED|NEEDS_FIX)$' /tmp/report.txt
          grep -Eq '^DEFECT:' /tmp/report.txt
          grep -Eq '^MIN_TEST:' /tmp/report.txt
          grep -Eq '^EVIDENCE:' /tmp/report.txt
          test "$(grep -c '^VERDICT:' /tmp/report.txt)" -eq 1

      - name: Publish focused verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Focused capture Challenger — deterministic current head"
            echo
            echo "Exact product head: \`$EXPECTED_HEAD_SHA\`"
            echo
            echo '```text'
            if [ -s /tmp/report.txt ]; then
              cat /tmp/report.txt
            else
              echo 'VERDICT: INFRA_FAILURE'
              echo 'DEFECT: focused local challenger did not produce a conforming report'
            fi
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Enforce verdict
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERDICT: VERIFIED' /tmp/report.txt
