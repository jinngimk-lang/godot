name: V2 Foley Research

on:
  push:
    branches:
      - feat/tactile-upgrade-v2
    paths:
      - .github/workflows/v2-foley-research.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tactile-upgrade-v2

      - name: Install audio tooling if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Download independently verified CC0 sources
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/tape_handling_8.mp3 \
            https://cdn.freesound.org/previews/795/795714_10643461-hq.mp3
          curl -L --fail --retry 3 -o /tmp/tape_rip_6.mp3 \
            https://cdn.freesound.org/previews/795/795801_10643461-hq.mp3
          curl -L --fail --retry 3 -o /tmp/paper_sound_1.mp3 \
            https://opengameart.org/sites/default/files/paper_sound_-_1.mp3
          curl -L --fail --retry 3 -o /tmp/paper_sound_4.mp3 \
            https://opengameart.org/sites/default/files/paper_sound_-_4.mp3
          sha256sum /tmp/tape_handling_8.mp3 /tmp/tape_rip_6.mp3 /tmp/paper_sound_1.mp3 /tmp/paper_sound_4.mp3 | tee /tmp/source-sha256.txt

      - name: Build small repository-local PCM WAV set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio/peel

          ffmpeg -hide_banner -loglevel error -y -i /tmp/tape_handling_8.mp3 \
            -ac 1 -ar 44100 -c:a pcm_s16le \
            -af 'highpass=f=110,lowpass=f=9500,volume=-4dB,afade=t=in:st=0:d=0.015,afade=t=out:st=1.98:d=0.10' \
            -t 2.08 assets/audio/peel/adhesive_slow.wav

          ffmpeg -hide_banner -loglevel error -y -i /tmp/tape_handling_8.mp3 \
            -ac 1 -ar 44100 -c:a pcm_s16le \
            -af 'atempo=1.32,highpass=f=150,lowpass=f=11000,volume=-5dB,afade=t=in:st=0:d=0.012,afade=t=out:st=1.40:d=0.08' \
            -t 1.48 assets/audio/peel/adhesive_fast.wav

          ffmpeg -hide_banner -loglevel error -y -i /tmp/paper_sound_4.mp3 \
            -ac 1 -ar 44100 -c:a pcm_s16le \
            -af 'highpass=f=140,lowpass=f=9000,volume=-9dB,afade=t=in:st=0:d=0.01,afade=t=out:st=1.35:d=0.08' \
            -t 1.43 assets/audio/peel/paper_flex.wav

          ffmpeg -hide_banner -loglevel error -y -ss 0.58 -i /tmp/tape_handling_8.mp3 \
            -ac 1 -ar 44100 -c:a pcm_s16le \
            -af 'highpass=f=250,lowpass=f=12000,volume=-8dB,afade=t=out:st=0.09:d=0.03' \
            -t 0.12 assets/audio/peel/micro_release.wav

          ffmpeg -hide_banner -loglevel error -y -i /tmp/tape_rip_6.mp3 \
            -ac 1 -ar 44100 -c:a pcm_s16le \
            -af 'highpass=f=120,lowpass=f=12000,volume=-4dB,afade=t=out:st=0.37:d=0.07' \
            -t 0.44 assets/audio/peel/final_release.wav

          for f in assets/audio/peel/*.wav; do
            file "$f"
            sha256sum "$f"
          done

      - name: Write provenance and license ledger
        shell: bash
        run: |
          set -euo pipefail
          TAPE_HANDLING_SHA=$(sha256sum /tmp/tape_handling_8.mp3 | awk '{print $1}')
          TAPE_RIP_SHA=$(sha256sum /tmp/tape_rip_6.mp3 | awk '{print $1}')
          PAPER1_SHA=$(sha256sum /tmp/paper_sound_1.mp3 | awk '{print $1}')
          PAPER4_SHA=$(sha256sum /tmp/paper_sound_4.mp3 | awk '{print $1}')
          cat > assets/audio/ATTRIBUTION.md <<EOF
          # Audio asset provenance

          All V2 peel Foley below is derived only from source material whose original source page states **CC0 / Creative Commons Zero**, allowing copying, modification and redistribution. Attribution is retained here for provenance even where not legally required.

          ## Geoff-Bremner-Audio — Tape Handling 8

          - Original source page: https://freesound.org/people/Geoff-Bremner-Audio/sounds/795714/
          - Source description: handling sticky tape; studio condenser microphone.
          - License shown on source page: Creative Commons 0 (CC0).
          - Material fetched for this repository: Freesound public HQ MP3 preview derivative: https://cdn.freesound.org/previews/795/795714_10643461-hq.mp3
          - Fetched source SHA256: ${TAPE_HANDLING_SHA}
          - Local derivatives: `peel/adhesive_slow.wav`, `peel/adhesive_fast.wav`, `peel/micro_release.wav`.
          - Modifications: converted to mono 44.1 kHz 16-bit PCM WAV; high/low-pass cleanup; gain reduction; fades; fast variant uses 1.32x tempo; micro release is a short 120 ms excerpt.

          ## Geoff-Bremner-Audio — Tape Rip 6

          - Original source page: https://freesound.org/people/Geoff-Bremner-Audio/sounds/795801/
          - Source description: tearing a piece of tape off a roll.
          - License shown on source page: Creative Commons 0 (CC0).
          - Material fetched for this repository: Freesound public HQ MP3 preview derivative: https://cdn.freesound.org/previews/795/795801_10643461-hq.mp3
          - Fetched source SHA256: ${TAPE_RIP_SHA}
          - Local derivative: `peel/final_release.wav`.
          - Modifications: converted to mono 44.1 kHz 16-bit PCM WAV; high/low-pass cleanup; gain reduction and short fade.

          ## Luckius — Various Paper Sound Effects

          - Original source page: https://opengameart.org/content/various-paper-sound-effects
          - Author: Luckius.
          - License shown on source page: CC0.
          - Source files fetched: `paper_sound_-_1.mp3` and `paper_sound_-_4.mp3` from OpenGameArt.
          - `paper_sound_-_1.mp3` SHA256: ${PAPER1_SHA}
          - `paper_sound_-_4.mp3` SHA256: ${PAPER4_SHA}
          - Local derivative currently used: `peel/paper_flex.wav`, derived from `paper_sound_-_4.mp3`.
          - Modifications: converted to mono 44.1 kHz 16-bit PCM WAV; filtered, attenuated, trimmed and faded.
          - `paper_sound_-_1.mp3` is retained only as a verified research/source input during materialization and is not committed as a runtime asset.

          Materialization date: 2026-08-13.
          EOF

      - name: Commit only generated audio assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/peel assets/audio/ATTRIBUTION.md
          if git diff --cached --quiet; then
            echo 'Audio assets already materialized; nothing to commit.'
            exit 0
          fi
          git commit -m 'assets: add verified CC0 peel foley'
          git push origin HEAD:feat/tactile-upgrade-v2
