name: V2 Foley Research

on:
  push:
    branches:
      - feat/tactile-upgrade-v2
    paths:
      - .github/workflows/v2-foley-research.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OpenGameArt paper source route
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/paper1.mp3 \
            https://opengameart.org/sites/default/files/paper_sound_-_1.mp3
          curl -L --fail --retry 3 -o /tmp/paper4.mp3 \
            https://opengameart.org/sites/default/files/paper_sound_-_4.mp3
          file /tmp/paper1.mp3 /tmp/paper4.mp3
          sha256sum /tmp/paper1.mp3 /tmp/paper4.mp3

      - name: Discover Freesound CC0 preview routes
        shell: bash
        run: |
          set -euo pipefail
          for id in 795714 795801; do
            page="/tmp/freesound-${id}.html"
            curl -L --fail --retry 3 -A 'Mozilla/5.0' -o "$page" \
              "https://freesound.org/people/Geoff-Bremner-Audio/sounds/${id}/"
            echo "--- sound ${id} preview candidates ---"
            grep -Eo 'https://[^"[:space:]]+(preview|previews)[^"[:space:]]+\.(mp3|ogg)' "$page" | sed 's/&amp;/\&/g' | sort -u || true
            grep -Eo 'https://cdn\.freesound\.org/[^"[:space:]]+\.(mp3|ogg)' "$page" | sed 's/&amp;/\&/g' | sort -u || true
          done
