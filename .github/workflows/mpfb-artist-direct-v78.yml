name: MPFB Artist Direct v78

on:
  push:
    branches:
      - spike/mpfb-hero-limb-artist-direct-v78
    paths:
      - 'tools/diagnose_mpfb_artist_scene_v78.py'
      - 'tools/apply_mpfb_artist_pose_v78.py'
      - 'art/mpfb/support-wrap-v78-artist-pose.json'
      - '.github/workflows/mpfb-artist-direct-v78.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  artist-direct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-artist-direct-v78
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v78/{reports,logs,scene,frames} docs/superpowers/evidence/mpfb-v78
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Rebuild v77 native-rig authoring scene
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_artist_authoring_scene_v77.py -- \
            bl_ext.mpfb_ci.mpfb artifacts/mpfb_v78/scene artifacts/mpfb_v78/reports/artist-authoring-seed-v77.json \
            2>&1 | tee artifacts/mpfb_v78/logs/build-v77.log
          grep -Fq 'MPFB_ARTIST_AUTHORING_SCENE_V77_SUCCESS' artifacts/mpfb_v78/logs/build-v77.log
      - name: Measure fixed-camera editable-bone geometry
        shell: bash
        run: |
          set -euo pipefail
          scene="$(find artifacts/mpfb_v78/scene -maxdepth 1 -name '*.blend' -print -quit)"
          .preview-tools/blender/blender "$scene" --background --python tools/diagnose_mpfb_artist_scene_v78.py -- \
            artifacts/mpfb_v78/reports/artist-scene-diagnostic-v78.json \
            2>&1 | tee artifacts/mpfb_v78/logs/diagnostic.log
          grep -Fq 'MPFB_ARTIST_SCENE_DIAGNOSTIC_V78_SUCCESS' artifacts/mpfb_v78/logs/diagnostic.log
      - name: Apply one direct artist pose when asset exists
        if: hashFiles('art/mpfb/support-wrap-v78-artist-pose.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          scene="$(find artifacts/mpfb_v78/scene -maxdepth 1 -name '*.blend' -print -quit)"
          .preview-tools/blender/blender "$scene" --background --python tools/apply_mpfb_artist_pose_v78.py -- \
            art/mpfb/support-wrap-v78-artist-pose.json artifacts/mpfb_v78/frames artifacts/mpfb_v78/reports/artist-pose-v78.json \
            2>&1 | tee artifacts/mpfb_v78/logs/apply-pose.log
          grep -Fq 'MPFB_ARTIST_POSE_V78_SUCCESS' artifacts/mpfb_v78/logs/apply-pose.log
      - name: Persist diagnostic and frame evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v78/reports/*.json docs/superpowers/evidence/mpfb-v78/
          if compgen -G 'artifacts/mpfb_v78/frames/*.png' > /dev/null; then cp artifacts/mpfb_v78/frames/*.png docs/superpowers/evidence/mpfb-v78/; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v78
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist v78 direct-artist diagnostics'
            git pull --rebase origin spike/mpfb-hero-limb-artist-direct-v78
            git push origin HEAD:spike/mpfb-hero-limb-artist-direct-v78
          fi
      - name: Upload v78 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-artist-direct-v78
          path: artifacts/mpfb_v78/
          if-no-files-found: error
          retention-days: 14
