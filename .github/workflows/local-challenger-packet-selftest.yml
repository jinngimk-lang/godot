name: Local Challenger Packet Self-Test

on:
  push:
    paths:
      - tools/build_local_challenger_packet.sh
      - tools/validate_local_challenger_verdict.sh
      - .github/workflows/agent-challenger-local.yml
      - .github/workflows/local-challenger-packet-selftest.yml

permissions:
  contents: read

jobs:
  verify-packet-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Static shell guard
        shell: bash
        run: |
          bash -n tools/build_local_challenger_packet.sh
          bash -n tools/validate_local_challenger_verdict.sh

      - name: Reproduce HUD packet under safety budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git fetch origin fix/hud-macro-density-v56:refs/remotes/origin/fix/hud-macro-density-v56
          TASK_ID_VALUE=56 \
          PR_NUMBER_VALUE=60 \
          EXPECTED_HEAD_VALUE=c4f9da27b05c8929eade0fab8d61993ed7e4cdcf \
          ROUND_VALUE=1 \
            bash tools/build_local_challenger_packet.sh \
              origin/main \
              refs/remotes/origin/fix/hud-macro-density-v56 \
              /tmp/hud-review-packet.txt
          grep -Fq '=== HUD PRESENTATION CONTRACT ===' /tmp/hud-review-packet.txt
          grep -Fq '=== HUD DETERMINISTIC CONTRACT ===' /tmp/hud-review-packet.txt
          grep -Fq '=== GAMEPLAY HUD SOURCE ===' /tmp/hud-review-packet.txt
          if grep -Fq '=== DIRECT PRESENTATION/INTERACTION CONTRACTS ===' /tmp/hud-review-packet.txt; then
            echo 'HUD packet unexpectedly included hand-only contract bundle' >&2
            exit 1
          fi
          bytes="$(wc -c < /tmp/hud-review-packet.txt)"
          echo "hud packet bytes=$bytes"
          test "$bytes" -lt 42000

      - name: Reject hallucinated NEEDS_FIX symbols
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/grounding-packet.txt <<'PACKET'
          --- scripts/presentation/hud_chrome_presentation.gd ---
          func _compact_hud_text(source: String) -> String:
              return source
          PACKET
          cat > /tmp/hallucinated-verdict.json <<'JSON'
          {
            "verdict":"NEEDS_FIX",
            "defect":"A missing helper breaks the HUD path",
            "min_test":"Implement _hand_presentation(node)",
            "evidence":"_hand_presentation(node) is commented out"
          }
          JSON
          set +e
          bash tools/validate_local_challenger_verdict.sh /tmp/hallucinated-verdict.json /tmp/grounding-packet.txt
          rc=$?
          set -e
          echo "hallucinated verdict validator rc=$rc"
          test "$rc" -eq 42

      - name: Accept grounded NEEDS_FIX symbols
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/grounding-packet.txt <<'PACKET'
          --- scripts/presentation/hud_chrome_presentation.gd ---
          func _compact_hud_text(source: String) -> String:
              return source
          PACKET
          cat > /tmp/grounded-verdict.json <<'JSON'
          {
            "verdict":"NEEDS_FIX",
            "defect":"Compact HUD helper needs a regression check",
            "min_test":"Exercise _compact_hud_text(source)",
            "evidence":"func _compact_hud_text(source: String) -> String:"
          }
          JSON
          bash tools/validate_local_challenger_verdict.sh /tmp/grounded-verdict.json /tmp/grounding-packet.txt

      - name: Accept VERIFIED without defect-symbol grounding
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verified.json <<'JSON'
          {
            "verdict":"VERIFIED",
            "defect":"none",
            "min_test":"none",
            "evidence":"exact diff survived falsification"
          }
          JSON
          bash tools/validate_local_challenger_verdict.sh /tmp/verified.json /tmp/grounding-packet.txt
