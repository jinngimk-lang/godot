name: Local Challenger Packet Self-Test

on:
  push:
    paths:
      - tools/build_local_challenger_packet.sh
      - tools/validate_local_challenger_verdict.sh
      - tools/extract_local_challenger_json.py
      - tools/normalize_local_challenger_verdict.sh
      - tools/should_retry_local_challenger.sh
      - tools/test_normalize_local_challenger_retry.sh
      - .github/workflows/agent-challenger-local.yml
      - .github/workflows/local-challenger-packet-selftest.yml

permissions:
  contents: read

jobs:
  verify-packet-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Static shell guard
        shell: bash
        run: |
          bash -n tools/build_local_challenger_packet.sh
          bash -n tools/validate_local_challenger_verdict.sh
          bash -n tools/normalize_local_challenger_verdict.sh
          bash -n tools/should_retry_local_challenger.sh
          bash -n tools/test_normalize_local_challenger_retry.sh
          python3 -m py_compile tools/extract_local_challenger_json.py

      - name: Normalize one model JSON envelope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/raw-model.json <<'JSON'
          {"verdict":"VERIFIED","defect":"none","min_test":"none","evidence":"ok","evidence_anchor":"NO_CONCRETE_DEFECT"}
          JSON
          python3 tools/extract_local_challenger_json.py /tmp/raw-model.json /tmp/raw-normalized.json
          jq -e '.verdict == "VERIFIED"' /tmp/raw-normalized.json

          cat > /tmp/fenced-model.txt <<'MODEL'
          ```json
          {"verdict":"VERIFIED","defect":"none","min_test":"none","evidence":"ok","evidence_anchor":"NO_CONCRETE_DEFECT"}
          ```
          MODEL
          python3 tools/extract_local_challenger_json.py /tmp/fenced-model.txt /tmp/fenced-normalized.json
          jq -e '.evidence_anchor == "NO_CONCRETE_DEFECT"' /tmp/fenced-normalized.json

          cat > /tmp/prose-wrapped-model.txt <<'MODEL'
          Here is the grounded result after re-evaluation:
          {"verdict":"VERIFIED","defect":"none","min_test":"none","evidence":"ok","evidence_anchor":"NO_CONCRETE_DEFECT"}
          This is the only structured verdict object.
          MODEL
          python3 tools/extract_local_challenger_json.py /tmp/prose-wrapped-model.txt /tmp/prose-normalized.json
          jq -e '.verdict == "VERIFIED"' /tmp/prose-normalized.json

          cat > /tmp/multiple-model.txt <<'MODEL'
          {"verdict":"VERIFIED"}
          another candidate {"verdict":"NEEDS_FIX"}
          MODEL
          set +e
          python3 tools/extract_local_challenger_json.py /tmp/multiple-model.txt /tmp/should-not-exist.json
          rc=$?
          set -e
          echo "multiple envelope extractor rc=$rc"
          test "$rc" -eq 4

      - name: Retry malformed normalization once
        shell: bash
        run: |
          set -euo pipefail
          bash tools/test_normalize_local_challenger_retry.sh

      - name: Retry only strict grounding failures
        shell: bash
        run: |
          set -euo pipefail
          for code in 42 43 44 45 46; do
            bash tools/should_retry_local_challenger.sh "$code"
          done
          for code in 0 1 2 4 41 47 99; do
            set +e
            bash tools/should_retry_local_challenger.sh "$code"
            rc=$?
            set -e
            echo "non-retryable validator code=$code classifier rc=$rc"
            test "$rc" -eq 1
          done

      - name: Reproduce HUD packet under safety budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git fetch origin fix/hud-macro-density-v56:refs/remotes/origin/fix/hud-macro-density-v56
          TASK_ID_VALUE=56 \
          PR_NUMBER_VALUE=60 \
          EXPECTED_HEAD_VALUE=c4f9da27b05c8929eade0fab8d61993ed7e4cdcf \
          ROUND_VALUE=1 \
            bash tools/build_local_challenger_packet.sh \
              origin/main \
              refs/remotes/origin/fix/hud-macro-density-v56 \
              /tmp/hud-review-packet.txt
          grep -Fq '=== HUD PRESENTATION CONTRACT ===' /tmp/hud-review-packet.txt
          grep -Fq '=== HUD DETERMINISTIC CONTRACT ===' /tmp/hud-review-packet.txt
          grep -Fq '=== GAMEPLAY HUD SOURCE ===' /tmp/hud-review-packet.txt
          if grep -Fq '=== DIRECT PRESENTATION/INTERACTION CONTRACTS ===' /tmp/hud-review-packet.txt; then
            echo 'HUD packet unexpectedly included hand-only contract bundle' >&2
            exit 1
          fi
          if grep -Fq '_hand_presentation' /tmp/hud-review-packet.txt; then
            echo 'HUD packet unexpectedly included unrelated hand helper' >&2
            exit 1
          fi
          bytes="$(wc -c < /tmp/hud-review-packet.txt)"
          echo "hud packet bytes=$bytes"
          test "$bytes" -lt 42000

      - name: Reject invented evidence anchor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/grounding-packet.txt <<'PACKET'
          --- scripts/presentation/hud_chrome_presentation.gd ---
          func _compact_hud_text(source: String) -> String:
              return source
          PACKET
          cat > /tmp/hallucinated-verdict.json <<'JSON'
          {
            "verdict":"NEEDS_FIX",
            "defect":"A missing helper breaks the HUD path",
            "min_test":"Implement _hand_presentation(node)",
            "evidence":"_hand_presentation(node) is commented out",
            "evidence_anchor":"_hand_presentation(node) is commented out"
          }
          JSON
          set +e
          bash tools/validate_local_challenger_verdict.sh /tmp/hallucinated-verdict.json /tmp/grounding-packet.txt
          rc=$?
          set -e
          echo "invented anchor validator rc=$rc"
          test "$rc" -eq 45
          bash tools/should_retry_local_challenger.sh "$rc"

      - name: Reject generic packet-heading anchor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/generic-anchor.json <<'JSON'
          {
            "verdict":"NEEDS_FIX",
            "defect":"Generic section heading is not defect evidence",
            "min_test":"none",
            "evidence":"heading only",
            "evidence_anchor":"=== HUD PRESENTATION CONTRACT ==="
          }
          JSON
          set +e
          bash tools/validate_local_challenger_verdict.sh /tmp/generic-anchor.json /tmp/grounding-packet.txt
          rc=$?
          set -e
          echo "generic anchor validator rc=$rc"
          test "$rc" -eq 44
          bash tools/should_retry_local_challenger.sh "$rc"

      - name: Accept grounded NEEDS_FIX anchor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/grounding-packet.txt <<'PACKET'
          --- scripts/presentation/hud_chrome_presentation.gd ---
          func _compact_hud_text(source: String) -> String:
              return source
          PACKET
          cat > /tmp/grounded-verdict.json <<'JSON'
          {
            "verdict":"NEEDS_FIX",
            "defect":"Compact HUD helper needs a regression check",
            "min_test":"Exercise _compact_hud_text(source)",
            "evidence":"The helper is part of the exact packet",
            "evidence_anchor":"func _compact_hud_text(source: String) -> String:"
          }
          JSON
          bash tools/validate_local_challenger_verdict.sh /tmp/grounded-verdict.json /tmp/grounding-packet.txt

      - name: Accept VERIFIED without defect grounding
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verified.json <<'JSON'
          {
            "verdict":"VERIFIED",
            "defect":"none",
            "min_test":"none",
            "evidence":"exact diff survived falsification",
            "evidence_anchor":"NO_CONCRETE_DEFECT"
          }
          JSON
          bash tools/validate_local_challenger_verdict.sh /tmp/verified.json /tmp/grounding-packet.txt
