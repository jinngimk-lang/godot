name: MPFB V88 Product Camera

on:
  push:
    branches:
      - spike/mpfb-grip-web-viewport-v88
      - spike/mpfb-grip-web-crop-v89
    paths:
      - '.github/workflows/mpfb-v88-product-camera.yml'
      - 'tools/export_mpfb_support_candidate_v88.py'
      - 'tools/build_mpfb_grip-helper-authoring-panel-v87.py'
      - 'tools/build_mpfb_grip_helper_authoring_overlay_v86.py'
      - 'tools/build_mpfb_grip_helper_ghost_v85.py'
      - 'tools/build_mpfb_grip_helper_authoring_v84.py'
      - 'tests/capture_v88_product_camera.gd'
      - 'art/reference_sources/contactpose-v79-full6-use-hand1.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  product-camera-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 before staging generation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" artifacts/mpfb_v88_product/logs
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Initialize checked-out Godot project caches
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee artifacts/mpfb_v88_product/logs/project-init.log
          if grep -E 'SCRIPT ERROR: Parse Error|ERROR: Failed to load script' artifacts/mpfb_v88_product/logs/project-init.log; then
            exit 1
          fi

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 xvfb
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v88_product/{scene,reports,logs} assets/models/hands/staging artifacts/v88_product_camera
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Rebuild exact v87 authoring scene
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_grip_helper_authoring_panel_v87.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_v88_product/scene/peel-calm-grip-helper-authoring-panel-v87.blend \
            artifacts/mpfb_v88_product/reports/authoring-panel-v87.json \
            artifacts/mpfb_v88_product/scene/v87-seed-with-vessel.png \
            artifacts/mpfb_v88_product/scene/v87-seed-thumbnail.png 2>&1 | tee artifacts/mpfb_v88_product/logs/build-v87.log

      - name: Export single visually-authored support candidate
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender artifacts/mpfb_v88_product/scene/peel-calm-grip-helper-authoring-panel-v87.blend --background --python tools/export_mpfb_support_candidate_v88.py -- \
            assets/models/hands/staging/mpfb_support_v88.glb \
            artifacts/mpfb_v88_product/reports/support-v88-export.json 2>&1 | tee artifacts/mpfb_v88_product/logs/export-v88.log
          grep -Fq 'MPFB_SUPPORT_CANDIDATE_V88_EXPORT_SUCCESS' artifacts/mpfb_v88_product/logs/export-v88.log

      - name: Verify staging contract before Godot capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/mpfb_v88_product/reports/support-v88-export.json').read_text())
          assert report['staging_only'] is True
          assert report['production_candidate'] is False
          assert report['reference_set'] == ['bar_v1', 'market_v1']
          assert report['single_artist_edit'] is True
          assert report['parameter_sweep_used'] is False
          assert report['optimizer_used'] is False
          assert report['automatic_retarget_used'] is False
          assert report['root_is_proxy_vessel_center'] is True
          assert report['whole_limb_artist_roll_degrees'] == -40.0
          assert report['crop_envelope']['palm_radius'] == 0.058
          assert report['crop_envelope']['wrist_forearm_radius'] == 0.046
          assert report['crop_envelope']['finger_radius'] == 0.018
          assert report['cropped_vertices'] >= 1200
          PY

      - name: Import staging GLB in Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee artifacts/mpfb_v88_product/logs/import-staging.log
          ./godot --headless --path . --script res://tests/inspect_mpfb_staging_candidate.gd 2>&1 | tee artifacts/mpfb_v88_product/logs/inspect-staging.log

      - name: Capture same-camera XR versus MPFB product frames
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a ./godot --path . --script res://tests/capture_v88_product_camera.gd 2>&1 | tee artifacts/mpfb_v88_product/logs/capture-product-camera.log
          for frame in bar_xr bar_v88 market_xr market_v88 market_v88_inspect45; do
            test -s "artifacts/v88_product_camera/${frame}.png"
          done

      - name: Upload product-camera A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-v88-product-camera
          path: |
            artifacts/v88_product_camera/*.png
            artifacts/mpfb_v88_product/reports/*.json
            artifacts/mpfb_v88_product/logs/*.log
          if-no-files-found: error
          retention-days: 7
