name: Rebuild CC0 support hand v94

on:
  push:
    branches:
      - spike/cc0-makehuman-support-hand-v94

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[support-hand-rescaled]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/cc0-makehuman-support-hand-v94
          fetch-depth: 1
      - name: Install Blender authoring runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full blender python3-numpy xvfb libegl1 libgl1
      - name: Download pinned CC0 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/oga-arms.7z 'https://opengameart.org/sites/default/files/fps%20arms.7z'
          echo '31f6c7bd5caea8856c4aafca8461f38a3c8bfdd3d8f05c898e403b9475e54562  /tmp/oga-arms.7z' | sha256sum -c -
          rm -rf /tmp/oga-arms /tmp/support-hand-build
          mkdir -p /tmp/oga-arms /tmp/support-hand-build
          7z x -y -o/tmp/oga-arms /tmp/oga-arms.7z >/tmp/support-hand-build/extract.log
          test -s '/tmp/oga-arms/FPS ARMS RIG 1 test anim.blend'
          test -s '/tmp/oga-arms/new_diff.png'
      - name: Build reference-scaled support candidate
        run: |
          set -euo pipefail
          xvfb-run -a blender -b --python-exit-code 1 --python tools/build_cc0_support_hand.py 2>&1 | tee /tmp/support-hand-build/blender.log
          test -s assets/models/hands/hand_left.glb
          test -s /tmp/support-hand-build/build-report.json
          grep -Fq '"predicted_runtime_extent": 1.2' /tmp/support-hand-build/build-report.json
      - name: Commit rescaled binary and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm .github/workflows/rebuild-cc0-support-hand-v94.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/hands/hand_left.glb .github/workflows/rebuild-cc0-support-hand-v94.yml
          git commit -m 'spike: rescale CC0 support hand to reference envelope [support-hand-rescaled]'
          git push origin HEAD:spike/cc0-makehuman-support-hand-v94
