name: Author Verified Renderable Hands

on:
  push:
    branches:
      - assist/fix-authored-hand-render-v2

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Blender and Godot prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Download pinned CC0 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hand-src
          base="https://raw.githubusercontent.com/GodotVR/godot-xr-tools/2d8db860d1adbee97c0968c4b07afe9348263926/addons/godot-xr-tools/hands/blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/hand_l.blend "$base/hand_l.blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/hand_r.blend "$base/hand_r.blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/animations_hand_l.blend "$base/animations/animations_hand_l.blend"
          curl -L --fail --retry 3 -o /tmp/hand-src/animations_hand_r.blend "$base/animations/animations_hand_r.blend"

      - name: Build fresh mesh plus animation GLBs
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/models/hands/hand_left.glb assets/models/hands/hand_right.glb
          cat > /tmp/build_hand.py <<'PY'
          import bpy, os, sys
          args = sys.argv[sys.argv.index("--") + 1:]
          static_path, animation_path, output_path, suffix = args
          bpy.ops.wm.open_mainfile(filepath=static_path)
          armature = bpy.data.objects.get("Armature")
          if armature is None or armature.type != "ARMATURE" or len(armature.data.bones) != 26:
              raise RuntimeError("unexpected source armature")
          hand = bpy.data.objects.get(f"mesh_Hand_{suffix}")
          nails = bpy.data.objects.get(f"mesh_Hand_Nails_{suffix}")
          for obj, label in [(hand, "hand"), (nails, "nails")]:
              if obj is None or obj.type != "MESH" or len(obj.data.vertices) <= 0:
                  raise RuntimeError(f"required {label} mesh missing")
              obj.hide_viewport = False
              obj.hide_render = False
              obj.hide_select = False
              obj.hide_set(False)

          def material(name, rgba, roughness):
              mat = bpy.data.materials.get(name) or bpy.data.materials.new(name=name)
              mat.name = name
              mat.use_nodes = True
              mat.diffuse_color = rgba
              bsdf = mat.node_tree.nodes.get("Principled BSDF")
              if bsdf is None:
                  raise RuntimeError(f"missing Principled BSDF for {name}")
              bsdf.inputs["Base Color"].default_value = rgba
              bsdf.inputs["Roughness"].default_value = roughness
              bsdf.inputs["Metallic"].default_value = 0.0
              return mat

          # Warm, clean semi-realistic presentation without pore-level texture detail.
          skin = material("HandSkin", (0.50, 0.245, 0.17, 1.0), 0.64)
          nail = material("HandNail", (0.72, 0.40, 0.35, 1.0), 0.48)
          hand.data.materials.clear(); hand.data.materials.append(skin)
          nails.data.materials.clear(); nails.data.materials.append(nail)

          bpy.ops.object.select_all(action="DESELECT")
          hand.select_set(True); nails.select_set(True)
          bpy.context.view_layer.objects.active = hand
          selected = {o.name for o in bpy.context.selected_objects}
          if hand.name not in selected or nails.name not in selected:
              raise RuntimeError(f"hand+nails selection failed: {selected}")
          bpy.ops.object.join()
          joined = bpy.context.view_layer.objects.active
          joined.name = f"PeelCalmHand_{suffix}"
          if len(joined.data.vertices) < 3000:
              raise RuntimeError(f"joined geometry too small: {len(joined.data.vertices)}")
          mats = [slot.material.name if slot.material else "" for slot in joined.material_slots]
          if "HandSkin" not in mats or "HandNail" not in mats:
              raise RuntimeError(f"semantic materials missing after join: {mats}")

          with bpy.data.libraries.load(animation_path, link=False) as (data_from, data_to):
              data_to.actions = list(data_from.actions)
          names = [a.name for a in data_to.actions if a is not None]
          for required in ["Default pose", "Cup", "Hold", "Pinch Tight", "Pinch Up"]:
              if required not in names:
                  raise RuntimeError(f"required action missing: {required}")
          armature.animation_data_create()
          armature.animation_data.action = bpy.data.actions.get("Default pose")

          bpy.ops.object.select_all(action="DESELECT")
          armature.hide_set(False); armature.hide_select = False
          armature.select_set(True); joined.select_set(True)
          bpy.context.view_layer.objects.active = armature
          op = bpy.ops.export_scene.gltf
          props = set(op.get_rna_type().properties.keys())
          kwargs = dict(filepath=output_path, export_format="GLB", use_selection=True, export_animations=True, export_skins=True)
          if "export_animation_mode" in props:
              enum_items = [item.identifier for item in op.get_rna_type().properties["export_animation_mode"].enum_items]
              if "ACTIONS" in enum_items:
                  kwargs["export_animation_mode"] = "ACTIONS"
              elif "ACTIVE_ACTIONS" in enum_items:
                  kwargs["export_animation_mode"] = "ACTIVE_ACTIONS"
          if "export_nla_strips" in props and "export_animation_mode" not in kwargs:
              kwargs["export_nla_strips"] = False
          if "export_force_sampling" in props:
              kwargs["export_force_sampling"] = True
          result = op(**kwargs)
          if "FINISHED" not in result or not os.path.exists(output_path) or os.path.getsize(output_path) <= 4096:
              raise RuntimeError(f"GLB export failed: {result}")
          print("AUTHORED_GLB", output_path, os.path.getsize(output_path), len(joined.data.vertices), mats, len(names))
          PY

          blender -b --python /tmp/build_hand.py -- /tmp/hand-src/hand_l.blend /tmp/hand-src/animations_hand_l.blend "$GITHUB_WORKSPACE/assets/models/hands/hand_left.glb" L 2>&1 | tee /tmp/left.log
          grep -q '^AUTHORED_GLB ' /tmp/left.log
          blender -b --python /tmp/build_hand.py -- /tmp/hand-src/hand_r.blend /tmp/hand-src/animations_hand_r.blend "$GITHUB_WORKSPACE/assets/models/hands/hand_right.glb" R 2>&1 | tee /tmp/right.log
          grep -q '^AUTHORED_GLB ' /tmp/right.log
          test -s assets/models/hands/hand_left.glb
          test -s assets/models/hands/hand_right.glb
          sha256sum assets/models/hands/hand_left.glb assets/models/hands/hand_right.glb | tee /tmp/hand-sha.txt

      - name: Write corrected provenance ledger
        shell: bash
        run: |
          set -euo pipefail
          left_sha="$(sha256sum assets/models/hands/hand_left.glb | awk '{print $1}')"
          right_sha="$(sha256sum assets/models/hands/hand_right.glb | awk '{print $1}')"
          cat > assets/models/hands/ATTRIBUTION.md <<EOF
          # Hand asset provenance

          Peel Calm vendors two repository-local rigged hand GLBs derived from the CC0 hand assets in **Godot XR Tools**.

          - Upstream repository: GodotVR/godot-xr-tools
          - Pinned upstream commit: \`2d8db860d1adbee97c0968c4b07afe9348263926\`
          - License: CC0 1.0 Universal; the upstream hand-model license copy is preserved in \`GODOT_XR_TOOLS_HANDS_CC0.md\`.

          ## Source reconstruction

          The upstream hand authoring data is deliberately split:

          - renderable hand/nail geometry + 26-bone armature: \`hands/blend/hand_l.blend\`, \`hand_r.blend\`;
          - authored action library on the matching armature: \`hands/blend/animations/animations_hand_l.blend\`, \`animations_hand_r.blend\`.

          An earlier project export incorrectly used the animation-only blends and therefore produced GLBs with skeletons/actions but **zero renderable meshes**. The current assets reconstruct the intended authored hand by opening the mesh-bearing source, joining the hand and nail geometry into one skinned mesh with two semantic material surfaces, appending the matching action library, and exporting a self-contained GLB.

          ## Project-local presentation transformation

          The geometry topology and authored skeletal actions come from the pinned CC0 source. Peel Calm assigns simple repository-local PBR materials so normal play has no texture download dependency:

          - \`HandSkin\`: warm semi-realistic skin, roughness 0.64;
          - \`HandNail\`: slightly lighter nail material, roughness 0.48.

          No Godot XR Tools addon code, Blender runtime, external service, login, secret, or network access is required to play the game.

          ## Generated asset checksums

          - \`hand_left.glb\`: \`${left_sha}\`
          - \`hand_right.glb\`: \`${right_sha}\`

          The repository test contract requires both assets to import as \`PackedScene\`, contain \`Skeleton3D\`, an \`AnimationPlayer\` with \`Cup\` and \`Pinch Tight\`, non-empty renderable mesh vertices, and the semantic \`HandSkin\` / \`HandNail\` material surfaces.
          EOF

      - name: Install Godot 4.7.1 and verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 ./godot
          chmod +x ./godot
          ./godot --headless --editor --path . --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR: Parse Error|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
          ./godot --headless --path . --script res://tests/test_runner.gd
          ./godot --headless --path . --script res://tests/smoke_scene.gd
          rm -f ./godot

      - name: Commit verified binary assets and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "peel-asset-author[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/hands/hand_left.glb assets/models/hands/hand_right.glb assets/models/hands/ATTRIBUTION.md
          git commit -m "fix: rebuild authored hands with renderable meshes"
          git push origin HEAD:assist/fix-authored-hand-render-v2

      - name: Remove temporary authoring workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin assist/fix-authored-hand-render-v2
          git rm -f .github/workflows/author-renderable-hands.yml .github/workflows/candidate-hand-assets.yml .github/workflows/inspect-hand-source.yml
          git commit -m "ci: remove temporary hand authoring workflows"
          git push origin HEAD:assist/fix-authored-hand-render-v2
