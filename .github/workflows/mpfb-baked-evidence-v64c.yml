name: MPFB Baked Evidence v64c

on:
  push:
    branches:
      - spike/mpfb-hero-limb-baked-evidence-v64c
    paths-ignore:
      - 'docs/superpowers/evidence/mpfb-v64c/**'
      - 'docs/superpowers/checkpoints/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  baked-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-baked-evidence-v64c
      - name: Acquire official CC0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mpfb_v64c/{source,assets,reports,logs,previews} docs/superpowers/evidence/mpfb-v64c .preview-tools
          URL='https://files2.makehumancommunity.org/asset_packs/poses01/poses01_cc0.zip'
          curl -L --fail --retry 3 -o artifacts/mpfb_v64c/source/poses01_cc0.zip "$URL"
          python tools/inspect_makehuman_pose_v50.py \
            artifacts/mpfb_v64c/source/poses01_cc0.zip \
            artifacts/mpfb_v64c/source/holding-wine-glass \
            artifacts/mpfb_v64c/reports/source-pose.json \
            2>&1 | tee artifacts/mpfb_v64c/logs/source.log
          grep -Fq 'MAKEHUMAN_POSE_REFERENCE_V50_INSPECT_SUCCESS' artifacts/mpfb_v64c/logs/source.log
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Render same baked pose with unobstructed anatomy views
        shell: bash
        run: |
          set -euo pipefail
          BVH="$(find artifacts/mpfb_v64c/source/holding-wine-glass -type f -iname '*.bvh' -print -quit)"
          test -n "$BVH"
          .preview-tools/blender/blender --background --python tools/bake_mpfb_default_pose_v64c.py -- \
            bl_ext.mpfb_ci.mpfb \
            "$BVH" \
            artifacts/mpfb_v64c/previews \
            artifacts/mpfb_v64c/assets/right-support-wrap-v64c-static.glb \
            artifacts/mpfb_v64c/reports/right-support-wrap-v64c.json \
            2>&1 | tee artifacts/mpfb_v64c/logs/bake.log
          grep -Fq 'MPFB_BAKED_EVIDENCE_V64C_SUCCESS' artifacts/mpfb_v64c/logs/bake.log
          for f in \
            baked_source_v64_candidate.png \
            baked_source_v64_thumbnail.png \
            baked_source_v64c_anatomy_front.png \
            baked_source_v64c_anatomy_oblique.png \
            baked_source_v64c_anatomy_thumbnail.png; do
            test -s "artifacts/mpfb_v64c/previews/$f"
          done
      - name: Enforce evidence-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v64c/reports/right-support-wrap-v64c.json'))
          assert r['adaptive_crop_v64b'] is True, r
          assert r['evidence_multiview_v64c'] is True, r
          assert r['pose_changed_from_v64'] is False, r
          assert r['pose_changed_from_v64b'] is False, r
          assert r['crop_changed_from_v64b'] is False, r
          assert r['vessel_transform_changed_from_v64b'] is False, r
          assert r['production_gameengine_rig_touched'] is False, r
          assert r['sacrificial_rig_deleted_before_render_export'] is True, r
          assert r['palm_vertex_coverage'] >= 220, r
          assert r['min_segment_vertex_coverage'] >= 12, r
          print('MPFB_BAKED_EVIDENCE_V64C_BOUNDARY_PASS')
          PY
      - name: Persist multiview visual evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v64c/previews/baked_source_v64_candidate.png docs/superpowers/evidence/mpfb-v64c/support-wrap-with-vessel.png
          cp artifacts/mpfb_v64c/previews/baked_source_v64_thumbnail.png docs/superpowers/evidence/mpfb-v64c/support-wrap-with-vessel-thumbnail.png
          cp artifacts/mpfb_v64c/previews/baked_source_v64c_anatomy_front.png docs/superpowers/evidence/mpfb-v64c/anatomy-front.png
          cp artifacts/mpfb_v64c/previews/baked_source_v64c_anatomy_oblique.png docs/superpowers/evidence/mpfb-v64c/anatomy-oblique.png
          cp artifacts/mpfb_v64c/previews/baked_source_v64c_anatomy_thumbnail.png docs/superpowers/evidence/mpfb-v64c/anatomy-thumbnail.png
          cp artifacts/mpfb_v64c/reports/right-support-wrap-v64c.json docs/superpowers/evidence/mpfb-v64c/support-wrap-report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v64c
          git commit -m 'evidence: persist baked support multiview v64c'
          git push origin HEAD:spike/mpfb-hero-limb-baked-evidence-v64c
      - name: Upload redundant artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-baked-evidence-v64c
          path: artifacts/mpfb_v64c/
          if-no-files-found: error
          retention-days: 14
