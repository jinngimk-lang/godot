name: Godot Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-check-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dual-agent runtime static guard
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/agent-builder.yml
          test -f .github/workflows/agent-challenger.yml
          test -f .github/workflows/agent-challenger-local.yml
          test -f .agents/PROJECT_KNOWLEDGE.md
          grep -Fq 'openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56' .github/workflows/agent-builder.yml
          grep -Fq 'openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56' .github/workflows/agent-challenger.yml
          if grep -ERn 'OPENAI_API_KEY[[:space:]]*[:=][[:space:]]*(sk-|[A-Za-z0-9_-]{30,})' .github .agents; then
            echo "Possible committed API key material detected."
            exit 1
          fi

      - name: Local Challenger verdict validator self-test
        shell: bash
        run: |
          set -euo pipefail
          bash tools/test_validate_local_challenger_verdict.sh

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Headless import and parse guard
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR: Parse Error|ERROR: Failed to load script" godot-import.log; then
            echo "Godot reported a script parse/load failure during import."
            exit 1
          fi

      - name: Configured default project launch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'run/main_scene="res://scenes/peel_lab/peel_lab.tscn"' project.godot
          timeout 30s ./godot --headless --path . --quit-after 20 --verbose 2>&1 | tee godot-default-launch.log
          if grep -E "(^|[[:space:]])(SCRIPT )?ERROR:" godot-default-launch.log; then
            echo "Godot emitted an error while launching the configured default project entrypoint."
            exit 1
          fi
          grep -Fq 'Loading resource: res://scenes/peel_lab/peel_lab.tscn' godot-default-launch.log || {
            echo "Default project launch did not prove that configured peel_lab main scene loaded."
            exit 1
          }

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/test_runner.gd
          timeout 30s ./godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee godot-unit.log
          if grep -E "(^|[[:space:]])(SCRIPT )?ERROR:" godot-unit.log; then
            echo "Godot emitted engine/script errors during an otherwise-successful unit run."
            exit 1
          fi

      - name: Scene smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_scene.gd

      - name: Complete peel and residue-rub flow smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_object_only_complete_flow.gd

      - name: Reference scene smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_reference_scene.gd

      - name: Label cup-surface smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_label_cup_surface.gd

      - name: Cafe presentation smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_cafe_presentation.gd

      - name: Repeated-session reset smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_reset_loop.gd

      - name: Pause input isolation smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_pause_input_isolation.gd

      - name: Reset input isolation smoke
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tests/smoke_reset_input_isolation.gd

      - name: Capture five object-only seven-state lifecycle sets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          mkdir -p artifacts/reference_frames
          xvfb-run -a ./godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/capture_reference_frames.gd 2>&1 | tee godot-capture.log
          for name in \
            coffee coffee_peel38 coffee_release_hold coffee_settling coffee_done coffee_scrub55 coffee_clean \
            jar jar_peel49 jar_release_hold jar_settling jar_done jar_scrub55 jar_clean \
            tin tin_peel41 tin_release_hold tin_settling tin_done tin_scrub55 tin_clean \
            market market_peel45 market_release_hold market_settling market_done market_scrub55 market_clean \
            can can_peel33 can_release_hold can_settling can_done can_scrub55 can_clean; do
            test -s "artifacts/reference_frames/${name}.png"
          done
          if grep -E "(^|[[:space:]])(SCRIPT )?ERROR:" godot-capture.log; then
            echo "Godot emitted errors while capturing object-only reference frames."
            exit 1
          fi

      - name: Upload reference frames
        uses: actions/upload-artifact@v4
        with:
          name: peel-calm-object-only-reference-frames
          path: artifacts/reference_frames/*.png
          if-no-files-found: error
