name: Rebuild CC0 support hand v94b

on:
  push:
    branches:
      - spike/cc0-makehuman-support-hand-v94

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[support-hand-v94b]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/cc0-makehuman-support-hand-v94
          fetch-depth: 1
      - name: Install Blender authoring runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full blender python3-numpy xvfb libegl1 libgl1
      - name: Download pinned CC0 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/oga-arms.7z 'https://opengameart.org/sites/default/files/fps%20arms.7z'
          echo '31f6c7bd5caea8856c4aafca8461f38a3c8bfdd3d8f05c898e403b9475e54562  /tmp/oga-arms.7z' | sha256sum -c -
          rm -rf /tmp/oga-arms /tmp/support-hand-aligned
          mkdir -p /tmp/oga-arms /tmp/support-hand-aligned
          7z x -y -o/tmp/oga-arms /tmp/oga-arms.7z >/tmp/support-hand-aligned/extract.log
          test -s '/tmp/oga-arms/FPS ARMS RIG 1 test anim.blend'
          test -s tools/support_hand_cafe_target_v94.json
      - name: Build same fixed Cup pose against corrected target
        run: |
          set -euo pipefail
          xvfb-run -a blender -b --python-exit-code 1 --python tools/build_cc0_support_hand_aligned.py 2>&1 | tee /tmp/support-hand-aligned/blender.log
          test -s assets/models/hands/hand_left.glb
          test -s /tmp/support-hand-aligned/build-report.json
          python3 - <<'PY'
          import json
          with open('/tmp/support-hand-aligned/build-report.json') as f:
              r=json.load(f)
          assert r['vertices_removed_as_forearm_only'] > 100, r
          assert r['mesh_polygons_after_crop'] >= 700, r
          assert r['alignment_center_error'] <= 1e-6, r
          assert r['alignment_radial_dot'] >= 0.99999, r
          assert r['alignment_axis_dot'] >= 0.99999, r
          assert r['target_measurement_run'] == 32021945305, r
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cc0-support-hand-v94b-build
          path: /tmp/support-hand-aligned
          if-no-files-found: error
      - name: Commit corrected-target binary and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm .github/workflows/rebuild-cc0-support-hand-v94b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/hands/hand_left.glb .github/workflows/rebuild-cc0-support-hand-v94b.yml
          git commit -m 'spike: rebuild support hand from corrected café target [support-hand-v94b]'
          git push origin HEAD:spike/cc0-makehuman-support-hand-v94
