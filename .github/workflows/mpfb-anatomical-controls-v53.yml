name: MPFB Anatomical Controls v53

on:
  push:
    branches:
      - spike/mpfb-hero-limb-anatomical-controls-v53
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_anatomical_controls_v53/{assets,reports,logs,previews}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz" | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo "92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz" | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name "MPFB CI" --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Build stable GameEngine source human
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- bl_ext.mpfb_ci.mpfb artifacts/mpfb_anatomical_controls_v53/assets/mpfb-human-source.glb artifacts/mpfb_anatomical_controls_v53/reports/mpfb-human-source.json 2>&1 | tee artifacts/mpfb_anatomical_controls_v53/logs/build.log
          grep -Fq "MPFB_LIMB_BUILD_SUCCESS" artifacts/mpfb_anatomical_controls_v53/logs/build.log
      - name: Author semantic anatomical support candidate
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/author_mpfb_anatomical_controls_v53.py -- \
            assets/models/hands/hand_right.glb \
            artifacts/mpfb_anatomical_controls_v53/assets/mpfb-human-source.glb \
            artifacts/mpfb_anatomical_controls_v53/previews \
            artifacts/mpfb_anatomical_controls_v53/assets/right-support-wrap-v53.pose.json \
            artifacts/mpfb_anatomical_controls_v53/reports/right-support-wrap-v53.json \
            2>&1 | tee artifacts/mpfb_anatomical_controls_v53/logs/author.log
          grep -Fq "MPFB_ANATOMICAL_CONTROLS_V53_SUCCESS" artifacts/mpfb_anatomical_controls_v53/logs/author.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_anatomical_controls_v53/reports/right-support-wrap-v53.json'))
          assert r['staging_only'] is True, r
          assert r['production_candidate'] is False, r
          assert r['automatic_retarget'] is False, r
          assert r['retarget_source_transforms_used'] is False, r
          assert r['target_solver_used'] is False, r
          assert r['bend_toward_center_used'] is False, r
          assert r['blind_local_euler_table_used'] is False, r
          assert r['pose_bone_count'] == 17, r
          assert r['max_reload_matrix_error'] <= 1e-6, r
          assert set(r['finger_controls']) == {'index','middle','ring','pinky'}, r
          print('ANATOMICAL_CONTROLS_V53_CONTRACT_PASS')
          PY
          test -s artifacts/mpfb_anatomical_controls_v53/previews/anatomical_controls_v53_candidate.png
          test -s artifacts/mpfb_anatomical_controls_v53/previews/anatomical_controls_v53_thumbnail.png
      - name: Upload anatomical-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-anatomical-controls-v53
          path: artifacts/mpfb_anatomical_controls_v53/
          if-no-files-found: error
          retention-days: 14
