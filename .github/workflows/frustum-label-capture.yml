name: Frustum Label Capture

on:
  push:
    branches:
      - verify/frustum-label-final-frame-v4

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit

      - name: Render frustum label frame
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 45s \
            ./godot --path . --display-driver x11 --rendering-method gl_compatibility \
            --script res://tests/capture_label_surface.gd 2>&1 | tee frustum-label-capture.log
          test -s artifacts/frustum_label.png
          file artifacts/frustum_label.png

      - name: Upload frustum frame
        uses: actions/upload-artifact@v4
        with:
          name: frustum-label-frame
          path: |
            artifacts/frustum_label.png
            frustum-label-capture.log
          if-no-files-found: error
          retention-days: 7
