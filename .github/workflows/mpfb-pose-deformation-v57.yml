name: MPFB Pose Deformation Contract v57

on:
  push:
    branches:
      - spike/mpfb-hero-limb-deformation-contract-v57
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_pose_deformation_v57/{assets,reports,logs,previews}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz" | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo "92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz" | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name "MPFB CI" --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Build stable GameEngine source human
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- bl_ext.mpfb_ci.mpfb artifacts/mpfb_pose_deformation_v57/assets/mpfb-human-source.glb artifacts/mpfb_pose_deformation_v57/reports/mpfb-human-source.json 2>&1 | tee artifacts/mpfb_pose_deformation_v57/logs/build.log
          grep -Fq "MPFB_LIMB_BUILD_SUCCESS" artifacts/mpfb_pose_deformation_v57/logs/build.log
      - name: Compare direct basis durable reload and pose-space deformation paths
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/diagnose_mpfb_pose_deformation_v57.py -- \
            assets/models/hands/hand_right.glb \
            artifacts/mpfb_pose_deformation_v57/assets/mpfb-human-source.glb \
            artifacts/mpfb_pose_deformation_v57/previews \
            artifacts/mpfb_pose_deformation_v57/reports/deformation-contract.json \
            2>&1 | tee artifacts/mpfb_pose_deformation_v57/logs/diagnose.log
          grep -Fq "MPFB_POSE_DEFORMATION_V57_SUCCESS" artifacts/mpfb_pose_deformation_v57/logs/diagnose.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_pose_deformation_v57/reports/deformation-contract.json'))
          assert r['staging_only'] is True, r
          assert r['production_candidate'] is False, r
          assert r['matrix_deltas']['basis_write_matrix_basis_max_abs'] > 0.05, r
          assert r['matrix_deltas']['pose_write_pose_matrix_max_abs'] > 0.05, r
          # This turns deformation itself into the regression gate. A serialized matrix
          # round-trip is insufficient unless evaluated skin changes and the reload retains
          # the same deformation.
          assert r['diagnostic_contract']['matrix_basis_write_visibly_deforms'] is True, r
          assert r['diagnostic_contract']['matrix_basis_reload_preserves_deformation'] is True, r
          assert r['diagnostic_contract']['pose_space_write_visibly_deforms'] is True, r
          print('POSE_DEFORMATION_V57_CONTRACT_PASS', r['diagnostic_contract'])
          PY
          for f in baseline matrix_basis_delta matrix_basis_reloaded pose_space_delta; do
            test -s "artifacts/mpfb_pose_deformation_v57/previews/${f}.png"
          done
      - name: Upload deformation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-pose-deformation-v57
          path: artifacts/mpfb_pose_deformation_v57/
          if-no-files-found: error
          retention-days: 14
