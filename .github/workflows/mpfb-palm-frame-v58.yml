name: MPFB Palm Frame v58

on:
  push:
    branches:
      - spike/mpfb-hero-limb-palm-frame-v58
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_palm_frame_v58/{assets,reports,logs,previews}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz" | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo "92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz" | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name "MPFB CI" --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Build stable GameEngine source human
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- bl_ext.mpfb_ci.mpfb artifacts/mpfb_palm_frame_v58/assets/mpfb-human-source.glb artifacts/mpfb_palm_frame_v58/reports/mpfb-human-source.json 2>&1 | tee artifacts/mpfb_palm_frame_v58/logs/build.log
          grep -Fq "MPFB_LIMB_BUILD_SUCCESS" artifacts/mpfb_palm_frame_v58/logs/build.log
      - name: Author palm-root frame only
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/author_mpfb_palm_frame_v58.py -- \
            artifacts/mpfb_palm_frame_v58/assets/mpfb-human-source.glb \
            artifacts/mpfb_palm_frame_v58/previews \
            artifacts/mpfb_palm_frame_v58/assets/right-support-palm-v58.pose.json \
            artifacts/mpfb_palm_frame_v58/reports/right-support-palm-v58.json \
            2>&1 | tee artifacts/mpfb_palm_frame_v58/logs/author.log
          grep -Fq "MPFB_PALM_FRAME_V58_SUCCESS" artifacts/mpfb_palm_frame_v58/logs/author.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_palm_frame_v58/reports/right-support-palm-v58.json'))
          assert r['staging_only'] is True and r['production_candidate'] is False, r
          assert r['kind']=='artist-authored-target-rig-palm-frame', r
          assert r['authored_bones']==['lowerarm_r','hand_r'], r
          assert r['digit_bones_authored'] is False, r
          assert not r['automatic_retarget'] and not r['source_transforms_used'] and not r['source_directions_used'] and not r['target_solver_used'], r
          assert r['pose_bone_count']==17, r
          assert r['max_reload_matrix_error']<=1e-6, r
          print('PALM_FRAME_V58_CONTRACT_PASS')
          PY
          test -s artifacts/mpfb_palm_frame_v58/previews/palm_frame_v58.png
          test -s artifacts/mpfb_palm_frame_v58/previews/palm_frame_v58_thumbnail.png
      - name: Upload palm-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-palm-frame-v58
          path: artifacts/mpfb_palm_frame_v58/
          if-no-files-found: error
          retention-days: 14
