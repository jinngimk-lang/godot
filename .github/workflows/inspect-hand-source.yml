name: Inspect Upstream Hand Sources

on:
  push:
    branches:
      - assist/fix-authored-hand-render-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Download pinned CC0 source blends
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/GodotVR/godot-xr-tools/2d8db860d1adbee97c0968c4b07afe9348263926/addons/godot-xr-tools/hands/blend"
          curl -L --fail --retry 3 -o hand_l.blend "$base/hand_l.blend"
          curl -L --fail --retry 3 -o hand_r.blend "$base/hand_r.blend"
          curl -L --fail --retry 3 -o animations_hand_l.blend "$base/animations/animations_hand_l.blend"
          curl -L --fail --retry 3 -o animations_hand_r.blend "$base/animations/animations_hand_r.blend"

      - name: Inspect Blender data blocks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/inspect.py <<'PY'
          import bpy, os
          print("SOURCE", os.path.basename(bpy.data.filepath))
          print("OBJECTS", [(o.name, o.type, len(o.data.vertices) if o.type == 'MESH' else None) for o in bpy.data.objects])
          print("MESHES", [(m.name, len(m.vertices), len(m.polygons)) for m in bpy.data.meshes])
          print("ARMATURES", [(a.name, len(a.bones)) for a in bpy.data.armatures])
          print("ACTIONS", [a.name for a in bpy.data.actions])
          print("LIBRARIES", [(lib.name, lib.filepath) for lib in bpy.data.libraries])
          for o in bpy.data.objects:
              if o.type == 'MESH':
                  print("MESH_OBJECT", o.name, "parent=", getattr(o.parent, 'name', None), "mods=", [(m.name, m.type, getattr(getattr(m, 'object', None), 'name', None)) for m in o.modifiers])
          PY
          for src in hand_l.blend hand_r.blend animations_hand_l.blend animations_hand_r.blend; do
            echo "===== $src ====="
            blender -b "$src" --python /tmp/inspect.py
          done
