name: Local Model Independent Review

on:
  push:
    branches: [feat/free-dual-agent-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    name: qwen7b-completion-challenger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact complete-playable candidate
        uses: actions/checkout@v6
        with:
          ref: becc790516e2d7dc5cb67615976b5a884328af61
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare narrow exact-head review packet
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== peel_lab.gd: completion/session production state machine ==='
            awk '/^func _process\(/,/^func _build_world\(/' scripts/peel_lab.gd
            awk '/^func _update_hud\(/,/^func _apply_current_variant\(/' scripts/peel_lab.gd
            awk '/^func _apply_current_variant\(/,/^func _screen_to_plane\(/' scripts/peel_lab.gd
            echo '=== session_model.gd: progression production state ==='
            cat scripts/session/session_model.gd
          } > /tmp/review-packet.txt
          wc -c /tmp/review-packet.txt
          test "$(wc -c < /tmp/review-packet.txt)" -lt 18000

      - name: Install local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 &
          for _ in {1..30}; do
            if ollama list >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-server.log
          exit 1

      - name: Pull stronger zero-balance code model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5-coder:7b

      - name: Run narrow adversarial review
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'PROMPT'
          You are CHALLENGER, independent from the implementation author.
          Analyze ONLY the production GDScript below. Do not summarize it. Try to find a real state-machine bug.

          Claims to falsify:
          A. `_handle_detached_label` can award a physical label at most once even if called twice.
          B. During the 2.15 second post-peel delay, Escape freezes the delay because `_process` returns before decrementing it.
          C. During that delay, plain R advances exactly once to the next unlocked item, preserves earned score/stamps, and consumes the pending transition.
          D. Plain R on an active label resets only that label and does not erase progression or change the selected tactile profile.
          E. Shift+R during the delay clears the run and prevents the old pending auto-next from firing later.
          F. Automatic timeout and R-next both rebuild the controller using the newly selected variant before resetting the fresh label.

          Required counterexample simulations:
          1. detach callback called twice before any reset;
          2. second clean peel unlocks profile 2 -> pause for 0.75s -> resume -> press R;
          3. completed label -> Shift+R -> then simulate 3 seconds of `_process`.

          For each sequence, trace these variables explicitly:
          `_detach_reward_recorded`, `_reset_timer`, `_advance_after_reset`, `_paused`, session clean peels/score/unlocked count/current variant.

          Respond EXACTLY with six single-line fields and no headings/markdown:
          VERDICT: VERIFIED
          TRACE_1: ...
          TRACE_2: ...
          TRACE_3: ...
          DEFECT: none
          MIN_TEST: none

          If any claim fails, use `VERDICT: NEEDS_FIX`, identify the exact function and bad transition in DEFECT, and give a concrete minimal test in MIN_TEST.

          Production code follows:
          PROMPT
            cat /tmp/review-packet.txt
          } > /tmp/review-prompt.txt

          ollama run qwen2.5-coder:7b < /tmp/review-prompt.txt | tee /tmp/review-report.txt
          test -s /tmp/review-report.txt
          grep -Eq '^VERDICT: (VERIFIED|NEEDS_FIX)$' /tmp/review-report.txt
          for field in TRACE_1 TRACE_2 TRACE_3 DEFECT MIN_TEST; do
            grep -Eq "^${field}:" /tmp/review-report.txt
          done

      - name: Show independent report
        if: always()
        shell: bash
        run: |
          echo '===== QWEN 7B COMPLETION CHALLENGER ====='
          if [ -f /tmp/review-report.txt ]; then cat /tmp/review-report.txt; else echo 'No conforming report produced.'; fi
