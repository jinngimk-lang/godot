name: Hand Base Asset Spike

on:
  push:
    branches:
      - diag/hand-surface-quality-v88
    paths:
      - .github/workflows/hand-base-asset-spike.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-blender-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Blender Human Base Meshes bundle
        shell: bash
        run: |
          set -euo pipefail
          url='https://download.blender.org/demo/bundles/bundles-3.6/human-base-meshes-bundle-v1.0.0.zip'
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o human-base-meshes-bundle-v1.0.0.zip
          sha256sum human-base-meshes-bundle-v1.0.0.zip | tee bundle.sha256
          unzip -l human-base-meshes-bundle-v1.0.0.zip | tee bundle-manifest.txt
          unzip -q human-base-meshes-bundle-v1.0.0.zip human_base_meshes_bundle.blend
          test -s human_base_meshes_bundle.blend

      - name: Install Blender for deterministic bundle inspection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender >/dev/null
          blender --version | head -n 2 | tee blender-version.txt

      - name: Inspect Realistic Hand asset topology and multires detail
        shell: bash
        run: |
          set -euo pipefail
          cat > inspect_hand.py <<'PY'
          import bpy

          lines = []
          lines.append(f'BLENDER_VERSION={bpy.app.version_string}')
          hand_candidates = [obj for obj in bpy.data.objects if 'hand' in obj.name.lower()]
          lines.append('HAND_OBJECT_NAMES=' + repr([(o.name, o.type) for o in hand_candidates]))

          depsgraph = bpy.context.evaluated_depsgraph_get()
          for obj in hand_candidates:
              lines.append(f'OBJECT name={obj.name} type={obj.type} parent={obj.parent.name if obj.parent else "none"}')
              modifier_rows = []
              for modifier in obj.modifiers:
                  row = [modifier.name, modifier.type]
                  if modifier.type == 'MULTIRES':
                      row.extend([
                          f'levels={modifier.levels}',
                          f'sculpt_levels={modifier.sculpt_levels}',
                          f'render_levels={modifier.render_levels}',
                          f'total_levels={modifier.total_levels}',
                      ])
                  modifier_rows.append(tuple(row))
              lines.append('  modifiers=' + repr(modifier_rows))
              if obj.type != 'MESH':
                  continue
              mesh = obj.data
              lines.append(f'  BASE vertices={len(mesh.vertices)} edges={len(mesh.edges)} polygons={len(mesh.polygons)} loops={len(mesh.loops)}')
              lines.append(f'  uv_layers={len(mesh.uv_layers)} materials={len(mesh.materials)} vertex_groups={len(obj.vertex_groups)}')
              lines.append(f'  smooth_polygons={sum(1 for p in mesh.polygons if p.use_smooth)}/{len(mesh.polygons)}')

              original_levels = {}
              multires = [m for m in obj.modifiers if m.type == 'MULTIRES']
              for m in multires:
                  original_levels[m.name] = (m.levels, m.render_levels)

              max_level = max([m.total_levels for m in multires] or [0])
              sample_levels = sorted(set([0, min(1,max_level), min(2,max_level), max_level]))
              for sample_level in sample_levels:
                  for m in multires:
                      m.levels = sample_level
                      m.render_levels = sample_level
                  bpy.context.view_layer.update()
                  evaluated = obj.evaluated_get(depsgraph)
                  evaluated_mesh = evaluated.to_mesh()
                  try:
                      lines.append(
                          f'  EVAL level={sample_level} vertices={len(evaluated_mesh.vertices)} '
                          f'polygons={len(evaluated_mesh.polygons)} loops={len(evaluated_mesh.loops)}'
                      )
                  finally:
                      evaluated.to_mesh_clear()

              for m in multires:
                  levels, render_levels = original_levels[m.name]
                  m.levels = levels
                  m.render_levels = render_levels

          armatures = [o for o in bpy.data.objects if o.type == 'ARMATURE']
          lines.append('ARMATURES=' + repr([(o.name, len(o.data.bones)) for o in armatures]))

          with open('realistic-hand-inspection.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
          blender -b human_base_meshes_bundle.blend --python inspect_hand.py 2>&1 | tee blender-inspect.log
          test -s realistic-hand-inspection.txt
          cat realistic-hand-inspection.txt

      - name: Upload inspected upstream bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: blender-human-base-meshes-inspection
          path: |
            bundle.sha256
            bundle-manifest.txt
            blender-version.txt
            realistic-hand-inspection.txt
            blender-inspect.log
          if-no-files-found: error
          retention-days: 7
