name: Hand Base Asset Spike

on:
  push:
    branches:
      - diag/hand-surface-quality-v88
    paths:
      - .github/workflows/hand-base-asset-spike.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-blender-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Blender Human Base Meshes bundle
        shell: bash
        run: |
          set -euo pipefail
          url='https://download.blender.org/demo/bundles/bundles-3.6/human-base-meshes-bundle-v1.0.0.zip'
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o human-base-meshes-bundle-v1.0.0.zip
          sha256sum human-base-meshes-bundle-v1.0.0.zip | tee bundle.sha256
          unzip -l human-base-meshes-bundle-v1.0.0.zip | tee bundle-manifest.txt
          unzip -q human-base-meshes-bundle-v1.0.0.zip human_base_meshes_bundle.blend
          test -s human_base_meshes_bundle.blend

      - name: Install Blender for deterministic bundle inspection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender >/dev/null
          blender --version | head -n 2 | tee blender-version.txt

      - name: Inspect Realistic Hand asset topology and rig readiness
        shell: bash
        run: |
          set -euo pipefail
          cat > inspect_hand.py <<'PY'
          import bpy

          def material_summary(mat):
              if mat is None:
                  return 'none'
              return f'{mat.name}|nodes={bool(mat.use_nodes)}'

          lines = []
          lines.append(f'BLENDER_VERSION={bpy.app.version_string}')
          lines.append(f'OBJECT_COUNT={len(bpy.data.objects)}')
          lines.append(f'MESH_COUNT={len(bpy.data.meshes)}')

          assets = []
          for obj in bpy.data.objects:
              if getattr(obj, 'asset_data', None) is not None:
                  assets.append((obj.name, obj.type))
          lines.append('OBJECT_ASSETS=' + repr(sorted(assets)))

          hand_candidates = [obj for obj in bpy.data.objects if 'hand' in obj.name.lower()]
          lines.append('HAND_OBJECT_NAMES=' + repr([(o.name, o.type) for o in hand_candidates]))

          for obj in hand_candidates:
              lines.append(f'OBJECT name={obj.name} type={obj.type} parent={obj.parent.name if obj.parent else "none"}')
              lines.append('  modifiers=' + repr([(m.name, m.type, getattr(getattr(m, 'object', None), 'name', None)) for m in obj.modifiers]))
              if obj.type == 'MESH':
                  mesh = obj.data
                  lines.append(f'  mesh={mesh.name} vertices={len(mesh.vertices)} edges={len(mesh.edges)} polygons={len(mesh.polygons)} loops={len(mesh.loops)}')
                  lines.append(f'  uv_layers={len(mesh.uv_layers)} color_attrs={len(mesh.color_attributes)} materials={len(mesh.materials)}')
                  lines.append('  material_names=' + repr([material_summary(m) for m in mesh.materials]))
                  smooth = sum(1 for p in mesh.polygons if p.use_smooth)
                  lines.append(f'  smooth_polygons={smooth}/{len(mesh.polygons)}')
                  lines.append('  vertex_groups=' + repr([(g.name, len([v for v in mesh.vertices if any(gr.group == g.index for gr in v.groups)])) for g in obj.vertex_groups[:40]]))

          armatures = [o for o in bpy.data.objects if o.type == 'ARMATURE']
          for arm in armatures:
              lines.append(f'ARMATURE name={arm.name} bones={len(arm.data.bones)}')
              lines.append('  bone_names=' + repr([b.name for b in arm.data.bones[:80]]))

          # Also inspect mesh datablocks named as realistic hand even if the asset
          # is not currently instantiated as an object in the saved scene.
          for mesh in bpy.data.meshes:
              if 'hand' not in mesh.name.lower():
                  continue
              lines.append(f'MESH_DATABLOCK name={mesh.name} vertices={len(mesh.vertices)} polygons={len(mesh.polygons)} uv_layers={len(mesh.uv_layers)} materials={len(mesh.materials)}')

          with open('realistic-hand-inspection.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
          blender -b human_base_meshes_bundle.blend --python inspect_hand.py 2>&1 | tee blender-inspect.log
          test -s realistic-hand-inspection.txt
          grep -i 'hand' realistic-hand-inspection.txt

      - name: Upload inspected upstream bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: blender-human-base-meshes-inspection
          path: |
            bundle.sha256
            bundle-manifest.txt
            blender-version.txt
            realistic-hand-inspection.txt
            blender-inspect.log
          if-no-files-found: error
          retention-days: 7
