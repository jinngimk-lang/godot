name: Hand Base Asset Spike

on:
  push:
    branches:
      - diag/hand-surface-quality-v88
    paths:
      - .github/workflows/hand-base-asset-spike.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-blender-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download official Blender Human Base Meshes bundle
        shell: bash
        run: |
          set -euo pipefail
          url='https://download.blender.org/demo/bundles/bundles-3.6/human-base-meshes-bundle-v1.0.0.zip'
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o human-base-meshes-bundle-v1.0.0.zip
          sha256sum human-base-meshes-bundle-v1.0.0.zip | tee bundle.sha256
          unzip -l human-base-meshes-bundle-v1.0.0.zip | tee bundle-manifest.txt
          unzip -q human-base-meshes-bundle-v1.0.0.zip human_base_meshes_bundle.blend
          test -s human_base_meshes_bundle.blend

      - name: Install Blender for deterministic bundle inspection
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender >/dev/null
          blender --version | head -n 2 | tee blender-version.txt

      - name: Compare official hand topology with current authored rig
        shell: bash
        run: |
          set -euo pipefail
          cat > inspect_hand.py <<'PY'
          import bpy, mathutils
          from pathlib import Path

          lines = []
          lines.append(f'BLENDER_VERSION={bpy.app.version_string}')
          source = bpy.data.objects.get('Hand  - Realistic')
          if source is None:
              raise RuntimeError('official Realistic Hand object not found')

          def world_bounds(obj):
              pts = [obj.matrix_world @ mathutils.Vector(corner) for corner in obj.bound_box]
              mins = [min(p[i] for p in pts) for i in range(3)]
              maxs = [max(p[i] for p in pts) for i in range(3)]
              return mins, maxs, [maxs[i]-mins[i] for i in range(3)]

          lines.append('OFFICIAL name=%s base_vertices=%d base_polygons=%d bounds=%r' % (
              source.name, len(source.data.vertices), len(source.data.polygons), world_bounds(source)))
          for modifier in source.modifiers:
              if modifier.type == 'MULTIRES':
                  lines.append('OFFICIAL_MULTIRES levels=%d sculpt=%d render=%d total=%d' % (
                      modifier.levels, modifier.sculpt_levels, modifier.render_levels, modifier.total_levels))
                  modifier.levels = modifier.total_levels
                  modifier.render_levels = modifier.total_levels
          bpy.context.view_layer.update()
          depsgraph = bpy.context.evaluated_depsgraph_get()
          evaluated = source.evaluated_get(depsgraph)
          evaluated_mesh = evaluated.to_mesh()
          try:
              lines.append('OFFICIAL_EVAL vertices=%d polygons=%d' % (len(evaluated_mesh.vertices), len(evaluated_mesh.polygons)))
          finally:
              evaluated.to_mesh_clear()

          # Import the exact authored runtime asset used today. Keep both scenes
          # in one Blender process so coordinate/bounds comparisons are factual.
          before = set(bpy.data.objects)
          bpy.ops.import_scene.gltf(filepath=str(Path('assets/models/hands/hand_left.glb').resolve()))
          imported = [o for o in bpy.data.objects if o not in before]
          lines.append('CURRENT_IMPORTED=' + repr([(o.name,o.type) for o in imported]))
          for obj in imported:
              if obj.type == 'MESH':
                  lines.append('CURRENT_MESH name=%s vertices=%d polygons=%d groups=%d bounds=%r' % (
                      obj.name, len(obj.data.vertices), len(obj.data.polygons), len(obj.vertex_groups), world_bounds(obj)))
                  lines.append('CURRENT_GROUPS=' + repr([g.name for g in obj.vertex_groups]))
              elif obj.type == 'ARMATURE':
                  lines.append('CURRENT_ARMATURE name=%s bones=%d bounds=%r' % (obj.name,len(obj.data.bones),world_bounds(obj)))
                  lines.append('CURRENT_BONES=' + repr([(b.name, tuple(round(v,5) for v in b.head_local), tuple(round(v,5) for v in b.tail_local)) for b in obj.data.bones]))

          with open('hand-rig-transfer-inspection.txt','w',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
          blender -b human_base_meshes_bundle.blend --python inspect_hand.py 2>&1 | tee blender-inspect.log
          test -s hand-rig-transfer-inspection.txt
          cat hand-rig-transfer-inspection.txt

      - name: Upload hand transfer evidence
        uses: actions/upload-artifact@v4
        with:
          name: blender-hand-rig-transfer-inspection
          path: |
            bundle.sha256
            bundle-manifest.txt
            blender-version.txt
            hand-rig-transfer-inspection.txt
            blender-inspect.log
          if-no-files-found: error
          retention-days: 7
