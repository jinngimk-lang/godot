name: Hand Base Asset Spike

on:
  push:
    branches:
      - diag/hand-surface-quality-v88
    paths:
      - .github/workflows/hand-base-asset-spike.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-subdivided-authored-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and glTF dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy >/dev/null
          blender --version | head -n 2 | tee blender-version.txt
          blender -b --python-expr 'import numpy; print("BLENDER_NUMPY=" + numpy.__version__)' 2>&1 | tee blender-numpy.txt

      - name: Subdivide authored hands while preserving armature and animation
        shell: bash
        run: |
          set -euo pipefail
          cat > build_subdiv_hands.py <<'PY'
          import bpy
          from pathlib import Path

          root = Path.cwd()
          report = []

          def build(side):
              bpy.ops.wm.read_factory_settings(use_empty=True)
              source = root / f'assets/models/hands/hand_{side}.glb'
              output = root / f'hand_{side}_subdiv.glb'
              bpy.ops.import_scene.gltf(filepath=str(source))
              meshes = [o for o in bpy.context.scene.objects if o.type == 'MESH' and o.name.startswith('PeelCalmHand_')]
              arms = [o for o in bpy.context.scene.objects if o.type == 'ARMATURE']
              if len(meshes) != 1 or len(arms) != 1:
                  raise RuntimeError(f'{side}: expected one hero mesh and one armature, got meshes={len(meshes)} arms={len(arms)}')
              obj = meshes[0]
              arm = arms[0]
              before_v = len(obj.data.vertices)
              before_f = len(obj.data.polygons)
              before_groups = len(obj.vertex_groups)
              before_actions = sorted(a.name for a in bpy.data.actions)

              bpy.context.view_layer.objects.active = obj
              obj.select_set(True)
              sub = obj.modifiers.new(name='HeroSubdiv', type='SUBSURF')
              sub.subdivision_type = 'CATMULL_CLARK'
              sub.levels = 1
              sub.render_levels = 1
              sub.show_only_control_edges = False

              # Keep topology smoothing before skin deformation. Imported glTF
              # normally has an ARMATURE modifier; move subdivision ahead of it.
              while obj.modifiers.find(sub.name) > 0:
                  bpy.context.view_layer.objects.active = obj
                  bpy.ops.object.modifier_move_up(modifier=sub.name)
              bpy.ops.object.modifier_apply(modifier=sub.name)
              for poly in obj.data.polygons:
                  poly.use_smooth = True

              after_v = len(obj.data.vertices)
              after_f = len(obj.data.polygons)
              after_groups = len(obj.vertex_groups)
              arm_mods = [(m.name, m.type, getattr(getattr(m, 'object', None), 'name', None)) for m in obj.modifiers]
              actions = sorted(a.name for a in bpy.data.actions)
              if after_v <= before_v * 2:
                  raise RuntimeError(f'{side}: subdivision did not materially increase topology: {before_v}->{after_v}')
              if after_groups != before_groups or after_groups < 20:
                  raise RuntimeError(f'{side}: skin groups changed unexpectedly: {before_groups}->{after_groups}')
              if actions != before_actions or len(actions) < 2:
                  raise RuntimeError(f'{side}: animation actions changed unexpectedly: {before_actions}->{actions}')
              if not any(m[1] == 'ARMATURE' for m in arm_mods):
                  raise RuntimeError(f'{side}: armature modifier missing after subdivision: {arm_mods}')

              bpy.ops.export_scene.gltf(
                  filepath=str(output),
                  export_format='GLB',
                  export_animations=True,
                  export_skins=True,
                  export_materials='EXPORT',
                  export_yup=True,
              )
              if not output.exists() or output.stat().st_size < 100000:
                  raise RuntimeError(f'{side}: candidate GLB was not exported correctly')
              report.append(
                  f'{side}: mesh {before_v}v/{before_f}f -> {after_v}v/{after_f}f; '
                  f'groups={after_groups}; armature={arm.name}/{len(arm.data.bones)} bones; '
                  f'actions={actions}; modifiers={arm_mods}; bytes={output.stat().st_size}'
              )

          build('left')
          build('right')
          Path('subdiv-hand-report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
          blender -b --python build_subdiv_hands.py 2>&1 | tee blender-build.log
          test -s hand_left_subdiv.glb
          test -s hand_right_subdiv.glb
          cat subdiv-hand-report.txt
          sha256sum hand_left_subdiv.glb hand_right_subdiv.glb | tee subdiv-hand-sha256.txt

      - name: Upload subdivided hand candidates
        uses: actions/upload-artifact@v4
        with:
          name: authored-hand-subdiv-candidates
          path: |
            hand_left_subdiv.glb
            hand_right_subdiv.glb
            subdiv-hand-report.txt
            subdiv-hand-sha256.txt
            blender-version.txt
            blender-numpy.txt
            blender-build.log
          if-no-files-found: error
          retention-days: 7
