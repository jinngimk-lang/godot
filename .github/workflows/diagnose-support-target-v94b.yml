name: Remeasure café support target v94b

on:
  push:
    branches:
      - spike/cc0-makehuman-support-hand-v94

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee /tmp/support-target-import.log
          ! grep -E 'SCRIPT ERROR: Parse Error|ERROR: Failed to load script' /tmp/support-target-import.log
      - name: Measure corrected authored-local café target
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://tools/diagnose_support_target.gd 2>&1 | tee /tmp/support-target.log
          grep -F 'SUPPORT_TARGET_JSON=' /tmp/support-target.log
      - uses: actions/upload-artifact@v4
        with:
          name: support-target-v94b
          path: /tmp/support-target.log
          if-no-files-found: error
