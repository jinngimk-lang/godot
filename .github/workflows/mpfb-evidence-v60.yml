name: MPFB Evidence v60

on:
  push:
    branches:
      - spike/mpfb-hero-limb-evidence-v60
    paths-ignore:
      - 'docs/superpowers/evidence/mpfb-v60/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  persist-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-evidence-v60
      - name: Enforce pose-focus regression
        run: python tools/test_mpfb_artist_pose_survives_focus_v58.py
      - name: Install headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v60/{assets,reports,logs,previews} docs/superpowers/evidence/mpfb-v60
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo "4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz" | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo "92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz" | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name "MPFB CI" --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Build and rerender corrected artist candidate
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_limb_candidate.py -- bl_ext.mpfb_ci.mpfb artifacts/mpfb_v60/assets/mpfb-human-source.glb artifacts/mpfb_v60/reports/mpfb-human-source.json 2>&1 | tee artifacts/mpfb_v60/logs/build.log
          grep -Fq "MPFB_LIMB_BUILD_SUCCESS" artifacts/mpfb_v60/logs/build.log
          .preview-tools/blender/blender --background --python tools/author_mpfb_artist_fk_v55.py -- \
            assets/models/hands/hand_right.glb \
            artifacts/mpfb_v60/assets/mpfb-human-source.glb \
            artifacts/mpfb_v60/previews \
            artifacts/mpfb_v60/assets/right-support-wrap-v60.pose.json \
            artifacts/mpfb_v60/reports/right-support-wrap-v60.json \
            2>&1 | tee artifacts/mpfb_v60/logs/author.log
          grep -Fq "MPFB_ARTIST_FK_V55_SUCCESS" artifacts/mpfb_v60/logs/author.log
          cp artifacts/mpfb_v60/previews/anatomical_controls_v53_candidate.png docs/superpowers/evidence/mpfb-v60/support-wrap-full.png
          cp artifacts/mpfb_v60/previews/anatomical_controls_v53_thumbnail.png docs/superpowers/evidence/mpfb-v60/support-wrap-thumbnail.png
          cp artifacts/mpfb_v60/reports/right-support-wrap-v60.json docs/superpowers/evidence/mpfb-v60/support-wrap-report.json
          python tools/export_render_rgbhex.py docs/superpowers/evidence/mpfb-v60/support-wrap-thumbnail.png docs/superpowers/evidence/mpfb-v60/support-wrap-thumbnail.rgbhex
      - name: Persist exact visual evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v60
          git commit -m "evidence: persist corrected artist support pose v60"
          git push origin HEAD:spike/mpfb-hero-limb-evidence-v60
      - name: Upload redundant artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-evidence-v60
          path: artifacts/mpfb_v60/
          if-no-files-found: error
          retention-days: 14
