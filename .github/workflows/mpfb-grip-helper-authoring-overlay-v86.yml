name: MPFB Grip Helper Authoring Overlay v86

on:
  push:
    branches:
      - spike/mpfb-grip-helper-authoring-overlay-v86
    paths:
      - 'tools/build_mpfb_grip_helper_authoring_overlay_v86.py'
      - 'tools/build_mpfb_grip_helper_ghost_v85.py'
      - 'tools/build_mpfb_grip_helper_authoring_v84.py'
      - 'art/reference_sources/contactpose-v79-full6-use-hand1.json'
      - '.github/workflows/mpfb-grip-helper-authoring-overlay-v86.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  authoring-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-grip-helper-authoring-overlay-v86

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v86/{scene,reports,logs}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Build non-mutating direct-visual authoring overlay
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/build_mpfb_grip_helper_authoring_overlay_v86.py -- \
            bl_ext.mpfb_ci.mpfb \
            art/reference_sources/contactpose-v79-full6-use-hand1.json \
            artifacts/mpfb_v86/scene \
            artifacts/mpfb_v86/reports/build.json \
            2>&1 | tee artifacts/mpfb_v86/logs/build.log
          grep -Fq 'MPFB_GRIP_HELPER_AUTHORING_OVERLAY_V86_SUCCESS' artifacts/mpfb_v86/logs/build.log
          test -s artifacts/mpfb_v86/scene/peel-calm-grip-helper-authoring-overlay-v86.blend
          test -s artifacts/mpfb_v86/scene/v86-authoring-overlay-wire.png
          test -s artifacts/mpfb_v86/scene/v86-authoring-overlay-thumbnail.png
          test -s artifacts/mpfb_v86/scene/v86-authoring-overlay-anatomy.png
          test -s artifacts/mpfb_v86/scene/v86-unchanged-opaque-macro.png

      - name: Reopen and verify authoring-only boundary
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background artifacts/mpfb_v86/scene/peel-calm-grip-helper-authoring-overlay-v86.blend --python-expr "import bpy,json; arm=bpy.data.objects['MPFB_V84_AuthoringRig']; controls=json.loads(arm['editable_controls']); s=bpy.context.scene; assert arm['peel_calm_authoring_version']=='v86'; assert len(controls)==7; assert s['peel_calm_visual_verdict']=='PENDING_DIRECT_ARTIST_EDIT'; assert not s['production_candidate']; assert not s['v86_overlay_pose_mutation']; assert not s['v86_overlay_is_optimizer']; assert s['v86_overlay_control_max_matrix_delta'] <= 1e-9; assert bpy.data.objects['LOCKED_VesselProxy'].hide_select; assert bpy.data.objects['LOCKED_V84_Camera'].hide_select; print('MPFB_GRIP_HELPER_AUTHORING_OVERLAY_V86_REOPEN_PASS')" 2>&1 | tee artifacts/mpfb_v86/logs/reopen.log
          grep -Fq 'MPFB_GRIP_HELPER_AUTHORING_OVERLAY_V86_REOPEN_PASS' artifacts/mpfb_v86/logs/reopen.log
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v86/reports/build.json'))
          assert r['production_candidate'] is False, r
          assert r['visual_verdict']=='PENDING_DIRECT_ARTIST_EDIT', r
          assert r['reference_set']==['bar_v1','market_v1'], r
          assert r['overlay_is_optimizer'] is False, r
          assert r['automatic_retarget_used'] is False, r
          assert r['parameter_sweep_used'] is False, r
          assert r['pose_control_max_matrix_delta_from_v85'] <= 1e-9, r
          assert set(r['digit_discrepancies']) == {'thumb','index','middle','ring','pinky'}, r
          assert len(r['editable_controls'])==7, r
          print('MPFB_GRIP_HELPER_AUTHORING_OVERLAY_V86_BOUNDARY_PASS')
          PY

      - name: Upload editable authoring-overlay scene
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-grip-helper-authoring-overlay-v86
          path: artifacts/mpfb_v86/
          if-no-files-found: error
          retention-days: 14
