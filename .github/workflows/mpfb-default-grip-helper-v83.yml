name: MPFB Default Grip Helper v83

on:
  push:
    branches:
      - spike/mpfb-default-grip-helper-v83
    paths:
      - 'tools/render_mpfb_default_grip_helper_v83.py'
      - '.github/workflows/mpfb-default-grip-helper-v83.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  semantic-grip:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-default-grip-helper-v83

      - name: Install headless runtime and pinned Blender/MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v83/{previews,reports,logs}
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Build one semantic support-grip candidate
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/render_mpfb_default_grip_helper_v83.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_v83/previews \
            artifacts/mpfb_v83/reports/support-grip-helper-v83.json \
            2>&1 | tee artifacts/mpfb_v83/logs/render.log
          grep -Fq 'MPFB_DEFAULT_GRIP_HELPER_V83_SUCCESS' artifacts/mpfb_v83/logs/render.log
          test -s artifacts/mpfb_v83/previews/support-grip-helper-v83-full.png
          test -s artifacts/mpfb_v83/previews/support-grip-helper-v83-thumbnail.png
          test -s artifacts/mpfb_v83/previews/support-grip-helper-v83-oblique.png

      - name: Enforce semantic-helper experiment boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v83/reports/support-grip-helper-v83.json'))
          assert r['staging_only'] is True, r
          assert r['production_candidate'] is False, r
          assert r['visual_verdict'] == 'PENDING_HUMAN_MACRO_MESO_REVIEW', r
          assert r['rig'] == 'MPFB canonical default (sacrificial)', r
          assert r['helper_mode'] == 'GRIP_AND_MASTER', r
          assert r['candidate_count'] == 1, r
          for k in ['parameter_sweep_used','ccd_used','endpoint_optimizer_used','contact_servo_used','contactpose_retarget_used','direct_phalanx_pose_table_used','production_gameengine_rig_touched']:
              assert r[k] is False, (k, r)
          assert r['baked_vertices'] >= 500, r
          controls=r['semantic_grip_controls']
          assert set(controls) == {'right_master_grip','right_finger1_grip','right_finger2_grip','right_finger3_grip','right_finger4_grip','right_finger5_grip'}, controls
          print('MPFB_DEFAULT_GRIP_HELPER_V83_BOUNDARY_PASS')
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-default-grip-helper-v83
          path: artifacts/mpfb_v83/
          if-no-files-found: error
          retention-days: 14
