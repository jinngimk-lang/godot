name: Paper Cup Structure Visual Capture

on:
  push:
    branches:
      - assist/paper-cup-structure-capture-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --editor --path . --quit
      - name: Render
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 45s ./godot --path . --display-driver x11 --rendering-method gl_compatibility --script res://tests/capture_scene.gd 2>&1 | tee visual-capture.log
          test -s artifacts/peel_scene.png
      - uses: actions/upload-artifact@v4
        with:
          name: paper-cup-structure-visual-audit
          path: |
            artifacts/peel_scene.png
            visual-capture.log
          retention-days: 7
