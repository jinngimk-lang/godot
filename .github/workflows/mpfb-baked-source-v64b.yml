name: MPFB Baked Source v64b

on:
  push:
    branches:
      - spike/mpfb-hero-limb-baked-source-v64b
    paths-ignore:
      - 'docs/superpowers/evidence/mpfb-v64b/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  baked-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-baked-source-v64b
      - name: Acquire official CC0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mpfb_v64b/{source,assets,reports,logs,previews} docs/superpowers/evidence/mpfb-v64b .preview-tools
          URL='https://files2.makehumancommunity.org/asset_packs/poses01/poses01_cc0.zip'
          curl -L --fail --retry 3 -o artifacts/mpfb_v64b/source/poses01_cc0.zip "$URL"
          python tools/inspect_makehuman_pose_v50.py \
            artifacts/mpfb_v64b/source/poses01_cc0.zip \
            artifacts/mpfb_v64b/source/holding-wine-glass \
            artifacts/mpfb_v64b/reports/source-pose.json \
            2>&1 | tee artifacts/mpfb_v64b/logs/source.log
          grep -Fq 'MAKEHUMAN_POSE_REFERENCE_V50_INSPECT_SUCCESS' artifacts/mpfb_v64b/logs/source.log
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Bake same pose with corrected evidence extraction
        shell: bash
        run: |
          set -euo pipefail
          BVH="$(find artifacts/mpfb_v64b/source/holding-wine-glass -type f -iname '*.bvh' -print -quit)"
          test -n "$BVH"
          .preview-tools/blender/blender --background --python tools/bake_mpfb_default_pose_v64b.py -- \
            bl_ext.mpfb_ci.mpfb \
            "$BVH" \
            artifacts/mpfb_v64b/previews \
            artifacts/mpfb_v64b/assets/right-support-wrap-v64b-static.glb \
            artifacts/mpfb_v64b/reports/right-support-wrap-v64b.json \
            2>&1 | tee artifacts/mpfb_v64b/logs/bake.log
          grep -Fq 'MPFB_BAKED_SOURCE_V64B_SUCCESS' artifacts/mpfb_v64b/logs/bake.log
          test -s artifacts/mpfb_v64b/previews/baked_source_v64_candidate.png
          test -s artifacts/mpfb_v64b/previews/baked_source_v64_thumbnail.png
      - name: Enforce evidence-only correction boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v64b/reports/right-support-wrap-v64b.json'))
          assert r['adaptive_crop_v64b'] is True, r
          assert r['pose_changed_from_v64'] is False, r
          assert r['pose_baked_static'] is True, r
          assert r['production_gameengine_rig_touched'] is False, r
          assert r['sacrificial_rig_deleted_before_render_export'] is True, r
          assert r['baked_vertices'] >= 1400, r
          assert r['palm_vertex_coverage'] >= 220, r
          assert r['min_segment_vertex_coverage'] >= 12, r
          required=['lowerarm02.R','wrist.R']+[f'finger{d}-{j}.R' for d in range(1,6) for j in range(1,4)]
          missing=[name for name in required if r['segment_vertex_coverage'].get(name,0) < 12]
          assert not missing, (missing, r)
          print('MPFB_BAKED_SOURCE_V64B_BOUNDARY_PASS')
          PY
      - name: Persist corrected visual evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v64b/previews/baked_source_v64_candidate.png docs/superpowers/evidence/mpfb-v64b/support-wrap-full.png
          cp artifacts/mpfb_v64b/previews/baked_source_v64_thumbnail.png docs/superpowers/evidence/mpfb-v64b/support-wrap-thumbnail.png
          cp artifacts/mpfb_v64b/reports/right-support-wrap-v64b.json docs/superpowers/evidence/mpfb-v64b/support-wrap-report.json
          .preview-tools/blender/blender --background --python tools/export_render_rgbhex.py -- \
            docs/superpowers/evidence/mpfb-v64b/support-wrap-thumbnail.png \
            docs/superpowers/evidence/mpfb-v64b/support-wrap-thumbnail.rgbhex 192 108
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v64b
          git commit -m 'evidence: persist corrected baked support mesh v64b'
          git push origin HEAD:spike/mpfb-hero-limb-baked-source-v64b
      - name: Upload redundant artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-baked-source-v64b
          path: artifacts/mpfb_v64b/
          if-no-files-found: error
          retention-days: 14
