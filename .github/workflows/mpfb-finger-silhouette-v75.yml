name: MPFB Finger Silhouette v75

on:
  push:
    branches:
      - spike/mpfb-hero-limb-finger-silhouette-v75
    paths:
      - 'tools/diagnose_mpfb_finger_silhouette_v75.py'
      - '.github/workflows/mpfb-finger-silhouette-v75.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  finger-silhouette:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-finger-silhouette-v75
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v75/{reports,logs,frames} docs/superpowers/evidence/mpfb-v75
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip
      - name: Diagnose four-finger camera-space silhouette
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/diagnose_mpfb_finger_silhouette_v75.py -- \
            bl_ext.mpfb_ci.mpfb artifacts/mpfb_v75/frames artifacts/mpfb_v75/reports/finger-silhouette-v75.json \
            2>&1 | tee artifacts/mpfb_v75/logs/diagnose.log
          grep -Fq 'MPFB_FINGER_SILHOUETTE_V75_SUCCESS' artifacts/mpfb_v75/logs/diagnose.log
      - name: Enforce diagnostic-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v75/reports/finger-silhouette-v75.json'))
          assert r['diagnostic_only'] and r['staging_only'] and not r['production_candidate']
          assert r['pose_authoring_in_v75'] is False
          assert r['thumb_pose_from_v74_frozen'] is True
          assert r['digits_2_to_5_changed_from_v65_b'] is False
          assert r['parameter_sweep_used'] is False and r['ccd_used'] is False
          assert r['endpoint_optimizer_used'] is False and r['contact_servo_used'] is False
          assert r['thumb_distal_outside_vessel_px'] >= 2.0, r['thumb_distal_outside_vessel_px']
          assert set(r['finger_screen_metrics']) == {'index','middle','ring','pinky'}
          for digit,m in r['finger_screen_metrics'].items():
              assert m['high_weight_vertex_count'] > 0, (digit,m)
              assert 0.0 <= m['inside_vessel_x_fraction'] <= 1.0, (digit,m)
          print('MPFB_FINGER_SILHOUETTE_V75_STRUCTURAL_PASS')
          PY
      - name: Persist v75 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v75/reports/finger-silhouette-v75.json docs/superpowers/evidence/mpfb-v75/
          cp artifacts/mpfb_v75/frames/*.png docs/superpowers/evidence/mpfb-v75/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v75
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist finger silhouette v75'
            git pull --rebase origin spike/mpfb-hero-limb-finger-silhouette-v75
            git push origin HEAD:spike/mpfb-hero-limb-finger-silhouette-v75
          fi
      - name: Upload v75 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-finger-silhouette-v75
          path: artifacts/mpfb_v75/
          if-no-files-found: error
          retention-days: 14
