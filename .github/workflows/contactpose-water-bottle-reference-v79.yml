name: ContactPose Water Bottle Reference v80

on:
  push:
    branches:
      - spike/contactpose-water-bottle-reference-v80
    paths:
      - '.github/workflows/contactpose-water-bottle-reference-v79.yml'
      - 'tools/contactpose_water_bottle_reference_v79.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib

      - name: Download public Explorer water-bottle joint annotations
        run: |
          set -euo pipefail
          BASE='https://contactpose.cc.gatech.edu/contactpose_data'
          mkdir -p /tmp/contactpose-explorer
          curl -L --fail --retry 2 --connect-timeout 10 --max-time 60 \
            "$BASE/datapoints.json" -o /tmp/contactpose-explorer/datapoints.json
          python - <<'PY'
          import json, pathlib, subprocess
          base='https://contactpose.cc.gatech.edu/contactpose_data'
          root=pathlib.Path('/tmp/contactpose-explorer')
          d=json.loads((root/'datapoints.json').read_text())
          rows=[]
          for intent, objects in d.items():
              sessions=objects.get('water_bottle', [])
              for s in sessions:
                  rows.append((intent, int(s)))
          if not rows:
              raise SystemExit('public Explorer datapoints has no water_bottle sessions')
          print('water_bottle sessions:', rows)
          for intent, s in rows:
              out=root/f'full{s}_{intent}'/'water_bottle'
              out.mkdir(parents=True, exist_ok=True)
              url=f'{base}/annotations/full{s}_{intent}_water_bottle.json'
              subprocess.run(['curl','-L','--fail','--retry','2','--connect-timeout','10','--max-time','60',url,'-o',str(out/'annotations.json')],check=True)
          PY
          find /tmp/contactpose-explorer -name annotations.json -print

      - name: Extract and rank real water-bottle hand poses
        run: |
          python tools/contactpose_water_bottle_reference_v79.py \
            --root /tmp/contactpose-explorer \
            --out /tmp/contactpose-v80

      - name: Upload anatomical reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contactpose-water-bottle-reference-v80
          path: /tmp/contactpose-v80
          if-no-files-found: warn
          retention-days: 30
