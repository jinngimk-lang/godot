name: Reference Multiscale V1 Independent Challenger

on:
  push:
    branches: [verify/reference-multiscale-v1-challenger]

permissions:
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 55ea65db8cae29adc25432e82768f3528aed7fa5
      BASE_SHA: 17fe40b41ae2e1fc8d10d5e4b4bfc5e689ddc875
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin "$BASE_SHA" --depth=1 || true

      - name: Build adversarial packets
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "EXACT_CANDIDATE=$CANDIDATE_SHA"
            echo "BASE=$BASE_SHA"
            echo '=== DIFF STAT ==='
            git diff --stat "$BASE_SHA...$CANDIDATE_SHA"
            echo '=== PEEL LAB ROOT ==='
            sed -n '1,520p' scripts/peel_lab.gd
            echo '=== PEEL MODEL ==='
            cat scripts/peel/peel_model.gd
            echo '=== PEEL CONTROLLER ==='
            cat scripts/peel/peel_controller.gd
            echo '=== INSPECTION ==='
            cat scripts/inspection/inspection_controller.gd
            echo '=== SESSION ==='
            cat scripts/session/session_model.gd
            echo '=== RESET + REFERENCE SMOKE ==='
            cat tests/smoke_reset_loop.gd
            cat tests/smoke_reference_scene.gd
          } > /tmp/state-packet.txt

          {
            echo "EXACT_CANDIDATE=$CANDIDATE_SHA"
            echo "BASE=$BASE_SHA"
            echo '=== CHOREOGRAPHY ==='
            cat scripts/presentation/hand_choreography_presentation.gd
            echo '=== FOREARM ==='
            cat scripts/presentation/forearm_presentation.gd
            echo '=== HAND VISUAL RELEVANT DIFF ==='
            git diff "$BASE_SHA...$CANDIDATE_SHA" -- scripts/hands/hand_visual.gd scripts/presentation/hand_choreography_presentation.gd scripts/presentation/forearm_presentation.gd scenes/peel_lab/peel_lab.tscn
            echo '=== FOREARM SMOKE ==='
            cat tests/smoke_forearm_presentation.gd
            echo '=== ACCEPTANCE MANIFEST ==='
            cat art/acceptance_refs/v1/MANIFEST.md
            echo '=== CHECKPOINT 03 ==='
            cat docs/superpowers/checkpoints/2026-08-14-reference-convergence-checkpoint-03.md
          } > /tmp/presentation-packet.txt

          echo "state bytes=$(wc -c < /tmp/state-packet.txt)"
          echo "presentation bytes=$(wc -c < /tmp/presentation-packet.txt)"
          test "$(wc -c < /tmp/state-packet.txt)" -lt 90000
          test "$(wc -c < /tmp/presentation-packet.txt)" -lt 90000

      - name: Install independent local model runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in {1..45}; do
            ollama list >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull independent code model
        run: ollama pull qwen2.5-coder:3b

      - name: Challenge gameplay ownership and reset
        shell: bash
        run: |
          set -u
          {
            cat <<'PROMPT'
          You are an independent adversarial reviewer of an exact Godot candidate. Try to falsify it.
          Focus on deterministic state-ownership defects, reset/next-item one-shot behavior, input separation, inspection-vs-peel ownership, venue switching, glass-vs-paper behavior, stale transforms, null/resource hazards, and regressions introduced by the multiscale reference integration.
          Existing green tests are evidence, not proof. Construct at least one concrete boundary counterexample. Return NEEDS_FIX only for a reproducible technical defect in this exact batch; otherwise VERIFIED. Future aesthetic reds alone are not technical blockers.
          Output exactly four lines:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: <strongest boundary scenario checked>
          EVIDENCE: <concise reason>
          Or use NEEDS_FIX plus a concrete reproducer.
          PACKET:
          PROMPT
            cat /tmp/state-packet.txt
          } > /tmp/state-prompt.txt
          timeout 240s ollama run qwen2.5-coder:3b < /tmp/state-prompt.txt > /tmp/state-report.txt 2>&1 || true
          cat /tmp/state-report.txt

      - name: Challenge hand choreography and presentation ownership
        shell: bash
        run: |
          set -u
          {
            cat <<'PROMPT'
          You are a second independent adversarial reviewer. Attack the exact multiscale candidate's presentation integration.
          Focus on duplicate hand-root writers, coordinate-space errors, inspection yaw follow, café-vs-glass ownership leakage, stale hand transforms after scene/reset changes, brittle AABB/test assumptions, accidental gameplay authority in presentation code, or changes that contradict the locked acceptance-manifest rules.
          Construct at least one boundary scenario. Return NEEDS_FIX only for a reproducible technical defect; otherwise VERIFIED. Known visual need for a higher-quality continuous human limb is not by itself a failure of this technical batch.
          Output exactly four lines:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: <strongest boundary scenario checked>
          EVIDENCE: <concise reason>
          Or use NEEDS_FIX plus a concrete reproducer.
          PACKET:
          PROMPT
            cat /tmp/presentation-packet.txt
          } > /tmp/presentation-prompt.txt
          timeout 240s ollama run qwen2.5-coder:3b < /tmp/presentation-prompt.txt > /tmp/presentation-report.txt 2>&1 || true
          cat /tmp/presentation-report.txt

      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          echo '=== STATE CHALLENGER ==='
          cat /tmp/state-report.txt 2>/dev/null || true
          echo '=== PRESENTATION CHALLENGER ==='
          cat /tmp/presentation-report.txt 2>/dev/null || true
          echo "REVIEWED_EXACT_HEAD=$CANDIDATE_SHA"

      - name: Gate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          for report in /tmp/state-report.txt /tmp/presentation-report.txt; do
            test -s "$report"
            grep -Eq '^VERDICT: (VERIFIED|NEEDS_FIX)$' "$report"
            grep -Eq '^DEFECT:' "$report"
            grep -Eq '^MIN_TEST:' "$report"
            grep -Eq '^EVIDENCE:' "$report"
            grep -Fxq 'VERDICT: VERIFIED' "$report"
          done
          echo "Independent Challenger VERIFIED exact candidate $CANDIDATE_SHA"
