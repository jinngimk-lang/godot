name: Reference Multiscale V1 Independent Challenger

on:
  push:
    branches: [verify/reference-multiscale-v1-challenger]

permissions:
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: f43f0e229ce7989d8febddc6fa753422565cadbb
      BASE_SHA: 17fe40b41ae2e1fc8d10d5e4b4bfc5e689ddc875
      TERM: dumb
      NO_COLOR: "1"
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin "$BASE_SHA" --depth=1 || true

      - name: Build bounded adversarial packets
        shell: bash
        run: |
          set -euo pipefail
          grep -n -E -C 6 '(reset|restart|next_item|variant|scene|pause|inspect|peel)' scripts/peel_lab.gd > /tmp/root-context.txt || true
          grep -n -E -C 5 '(reset|next|variant|label|glass|paper|owner|pause)' tests/smoke_reset_loop.gd > /tmp/reset-context.txt || true
          grep -n -E -C 6 '(setup|_apply_pose|_apply_authored_pose|set_grip_target|snap_to|tick|Wrist|Pinch|Cup)' scripts/hands/hand_visual.gd > /tmp/hand-context.txt || true
          grep -n -E -C 5 '(owner|support|forearm|hand|venue|inspect|update)' tests/smoke_forearm_presentation.gd > /tmp/forearm-test-context.txt || true

          {
            echo "EXACT_CANDIDATE=$CANDIDATE_SHA"
            echo "BASE=$BASE_SHA"
            echo '=== CURRENT PEEL MODEL ==='
            cat scripts/peel/peel_model.gd
            echo '=== CURRENT PEEL CONTROLLER ==='
            cat scripts/peel/peel_controller.gd
            echo '=== CURRENT INSPECTION ==='
            cat scripts/inspection/inspection_controller.gd
            echo '=== CURRENT SESSION ==='
            cat scripts/session/session_model.gd
            echo '=== ROOT TRANSITION CONTEXT ==='
            sed -n '1,240p' /tmp/root-context.txt
            echo '=== RESET ASSERTIONS ==='
            sed -n '1,180p' /tmp/reset-context.txt
          } > /tmp/state-packet.txt

          {
            echo "EXACT_CANDIDATE=$CANDIDATE_SHA"
            echo "BASE=$BASE_SHA"
            echo '=== CURRENT CHOREOGRAPHY OWNER ==='
            cat scripts/presentation/hand_choreography_presentation.gd
            echo '=== CURRENT FOREARM OWNER ==='
            cat scripts/presentation/forearm_presentation.gd
            echo '=== HAND POSE CONTEXT ==='
            sed -n '1,220p' /tmp/hand-context.txt
            echo '=== FOREARM CONTRACT ASSERTIONS ==='
            sed -n '1,180p' /tmp/forearm-test-context.txt
            echo '=== LOCKED ACCEPTANCE RULES ==='
            sed -n '1,170p' art/acceptance_refs/v1/MANIFEST.md
          } > /tmp/presentation-packet.txt

          echo "state bytes=$(wc -c < /tmp/state-packet.txt)"
          echo "presentation bytes=$(wc -c < /tmp/presentation-packet.txt)"
          test "$(wc -c < /tmp/state-packet.txt)" -lt 30000
          test "$(wc -c < /tmp/presentation-packet.txt)" -lt 30000

      - name: Install independent local model runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in {1..45}; do
            ollama list >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull independent code model
        run: ollama pull qwen2.5-coder:3b

      - name: Challenge gameplay ownership and reset
        shell: bash
        run: |
          set -u
          {
            cat <<'PROMPT'
          You are an independent adversarial reviewer of one exact Godot candidate.
          FALSIFY it; do not summarize it. Focus only on reproducible technical defects in state ownership, reset/next-item one-shot behavior, input separation, inspection-vs-peel ownership, venue switching, glass-vs-paper behavior, stale transforms, and null/resource hazards. Green tests are evidence, not proof. Known future visual-quality work is not a technical blocker.

          PACKET START
          PROMPT
            cat /tmp/state-packet.txt
            cat <<'PROMPT'
          PACKET END

          Return ONLY four lines:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: <strongest boundary scenario checked>
          EVIDENCE: <concise code-based reason>
          Use VERDICT: NEEDS_FIX only if you found a reproducible defect in this exact batch; then replace DEFECT with the concrete defect and MIN_TEST with the reproducer.
          PROMPT
          } > /tmp/state-prompt.txt
          timeout 240s ollama run qwen2.5-coder:3b < /tmp/state-prompt.txt > /tmp/state-report.txt 2>/tmp/state-stderr.log || true
          cat /tmp/state-report.txt

      - name: Challenge hand choreography and presentation ownership
        shell: bash
        run: |
          set -u
          {
            cat <<'PROMPT'
          You are a second independent adversarial reviewer of one exact Godot candidate.
          FALSIFY the presentation integration; do not summarize it. Focus only on reproducible technical defects: duplicate hand-root writers, coordinate-space errors, inspection-yaw follow, cafe-vs-glass ownership leakage, stale hand transforms after scene/reset changes, brittle AABB assumptions, accidental gameplay authority in presentation code, or violations of the locked acceptance rules. The known need for a higher-quality continuous human limb is not by itself a technical failure.

          PACKET START
          PROMPT
            cat /tmp/presentation-packet.txt
            cat <<'PROMPT'
          PACKET END

          Return ONLY four lines:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: <strongest boundary scenario checked>
          EVIDENCE: <concise code-based reason>
          Use VERDICT: NEEDS_FIX only if you found a reproducible defect in this exact batch; then replace DEFECT with the concrete defect and MIN_TEST with the reproducer.
          PROMPT
          } > /tmp/presentation-prompt.txt
          timeout 240s ollama run qwen2.5-coder:3b < /tmp/presentation-prompt.txt > /tmp/presentation-report.txt 2>/tmp/presentation-stderr.log || true
          cat /tmp/presentation-report.txt

      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          echo '=== STATE CHALLENGER ==='
          cat /tmp/state-report.txt 2>/dev/null || true
          echo '=== PRESENTATION CHALLENGER ==='
          cat /tmp/presentation-report.txt 2>/dev/null || true
          echo "REVIEWED_EXACT_HEAD=$CANDIDATE_SHA"

      - name: Persist challenger reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-multiscale-challenger-reports
          path: |
            /tmp/state-report.txt
            /tmp/presentation-report.txt
            /tmp/state-stderr.log
            /tmp/presentation-stderr.log
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14

      - name: Gate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          for report in /tmp/state-report.txt /tmp/presentation-report.txt; do
            test -s "$report"
            test "$(wc -l < "$report")" -le 8
            grep -Eq '^VERDICT: (VERIFIED|NEEDS_FIX)$' "$report"
            grep -Eq '^DEFECT:' "$report"
            grep -Eq '^MIN_TEST:' "$report"
            grep -Eq '^EVIDENCE:' "$report"
            grep -Fxq 'VERDICT: VERIFIED' "$report"
          done
          echo "Independent Challenger VERIFIED exact candidate $CANDIDATE_SHA"
