name: Reference Multiscale V1 Independent Challenger

on:
  push:
    branches: [verify/reference-multiscale-v1-challenger]

permissions:
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: f43f0e229ce7989d8febddc6fa753422565cadbb
      BASE_SHA: 17fe40b41ae2e1fc8d10d5e4b4bfc5e689ddc875
      TERM: dumb
      NO_COLOR: "1"
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin "$BASE_SHA" --depth=1 || true

      - name: Build concise adversarial packets
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "EXACT_CANDIDATE=$CANDIDATE_SHA"
            echo "BASE=$BASE_SHA"
            echo '=== STATE-OWNERSHIP DIFF ==='
            git diff --unified=12 "$BASE_SHA...$CANDIDATE_SHA" -- \
              scripts/peel_lab.gd \
              scripts/peel/peel_model.gd \
              scripts/peel/peel_controller.gd \
              scripts/inspection/inspection_controller.gd \
              scripts/session/session_model.gd
            echo '=== RESET CONTRACT ==='
            sed -n '1,260p' tests/smoke_reset_loop.gd
            echo '=== REFERENCE-SCENE CONTRACT ==='
            sed -n '1,260p' tests/smoke_reference_scene.gd
          } > /tmp/state-packet.txt

          {
            echo "EXACT_CANDIDATE=$CANDIDATE_SHA"
            echo "BASE=$BASE_SHA"
            echo '=== PRESENTATION OWNERSHIP DIFF ==='
            git diff --unified=18 "$BASE_SHA...$CANDIDATE_SHA" -- \
              scripts/presentation/hand_choreography_presentation.gd \
              scripts/presentation/forearm_presentation.gd \
              scripts/hands/hand_visual.gd \
              scenes/peel_lab/peel_lab.tscn
            echo '=== CURRENT CHOREOGRAPHY OWNER ==='
            cat scripts/presentation/hand_choreography_presentation.gd
            echo '=== FOREARM CONTRACT TEST ==='
            sed -n '1,260p' tests/smoke_forearm_presentation.gd
            echo '=== LOCKED ACCEPTANCE RULES ==='
            sed -n '1,220p' art/acceptance_refs/v1/MANIFEST.md
          } > /tmp/presentation-packet.txt

          echo "state bytes=$(wc -c < /tmp/state-packet.txt)"
          echo "presentation bytes=$(wc -c < /tmp/presentation-packet.txt)"
          test "$(wc -c < /tmp/state-packet.txt)" -lt 36000
          test "$(wc -c < /tmp/presentation-packet.txt)" -lt 36000

      - name: Install independent local model runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in {1..45}; do
            ollama list >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull independent code model
        run: ollama pull qwen2.5-coder:3b

      - name: Challenge gameplay ownership and reset
        shell: bash
        run: |
          set -u
          {
            cat <<'PROMPT'
          You are an independent adversarial reviewer of one exact Godot candidate.
          Your job is to FALSIFY the candidate, not summarize the packet.
          Focus only on reproducible technical defects in deterministic state ownership, reset/next-item one-shot behavior, input separation, inspection-vs-peel ownership, venue switching, glass-vs-paper behavior, stale transforms, null/resource hazards, and regressions introduced by this batch.
          Green tests are evidence, not proof. Construct the strongest concrete boundary counterexample you can from the packet.
          Known future visual-quality work is NOT a technical blocker.

          PACKET START
          PROMPT
            cat /tmp/state-packet.txt
            cat <<'PROMPT'
          PACKET END

          Do not summarize. Return ONLY these four lines and nothing else:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: <strongest boundary scenario checked>
          EVIDENCE: <concise code-based reason>

          If and only if you found a reproducible defect in this exact batch, replace VERIFIED with NEEDS_FIX and describe that concrete defect and reproducer.
          PROMPT
          } > /tmp/state-prompt.txt
          timeout 240s ollama run qwen2.5-coder:3b < /tmp/state-prompt.txt > /tmp/state-report.txt 2>/tmp/state-stderr.log || true
          cat /tmp/state-report.txt

      - name: Challenge hand choreography and presentation ownership
        shell: bash
        run: |
          set -u
          {
            cat <<'PROMPT'
          You are a second independent adversarial reviewer of one exact Godot candidate.
          Your job is to FALSIFY the presentation integration, not summarize it.
          Focus only on reproducible technical defects: duplicate hand-root writers, coordinate-space errors, inspection-yaw follow, cafe-vs-glass ownership leakage, stale hand transforms after scene/reset changes, brittle AABB/test assumptions, accidental gameplay authority in presentation code, or violations of the locked acceptance-manifest ownership rules.
          Construct the strongest concrete boundary scenario you can from the packet.
          The known need for a higher-quality continuous human limb is NOT by itself a failure of this technical batch.

          PACKET START
          PROMPT
            cat /tmp/presentation-packet.txt
            cat <<'PROMPT'
          PACKET END

          Do not summarize. Return ONLY these four lines and nothing else:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: <strongest boundary scenario checked>
          EVIDENCE: <concise code-based reason>

          If and only if you found a reproducible defect in this exact batch, replace VERIFIED with NEEDS_FIX and describe that concrete defect and reproducer.
          PROMPT
          } > /tmp/presentation-prompt.txt
          timeout 240s ollama run qwen2.5-coder:3b < /tmp/presentation-prompt.txt > /tmp/presentation-report.txt 2>/tmp/presentation-stderr.log || true
          cat /tmp/presentation-report.txt

      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          echo '=== STATE CHALLENGER ==='
          cat /tmp/state-report.txt 2>/dev/null || true
          echo '=== PRESENTATION CHALLENGER ==='
          cat /tmp/presentation-report.txt 2>/dev/null || true
          echo "REVIEWED_EXACT_HEAD=$CANDIDATE_SHA"

      - name: Persist challenger reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-multiscale-challenger-reports
          path: |
            /tmp/state-report.txt
            /tmp/presentation-report.txt
            /tmp/state-stderr.log
            /tmp/presentation-stderr.log
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14

      - name: Gate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          for report in /tmp/state-report.txt /tmp/presentation-report.txt; do
            test -s "$report"
            test "$(wc -l < "$report")" -le 8
            grep -Eq '^VERDICT: (VERIFIED|NEEDS_FIX)$' "$report"
            grep -Eq '^DEFECT:' "$report"
            grep -Eq '^MIN_TEST:' "$report"
            grep -Eq '^EVIDENCE:' "$report"
            grep -Fxq 'VERDICT: VERIFIED' "$report"
          done
          echo "Independent Challenger VERIFIED exact candidate $CANDIDATE_SHA"
