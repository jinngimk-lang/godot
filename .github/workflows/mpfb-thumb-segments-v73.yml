name: MPFB Thumb Segments Diagnostic v73

on:
  push:
    branches:
      - spike/mpfb-hero-limb-thumb-segments-v73
    paths:
      - 'tools/diagnose_mpfb_thumb_segments_v73.py'
      - '.github/workflows/mpfb-thumb-segments-v73.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  thumb-segments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-thumb-segments-v73

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v73/{renders,reports,logs} docs/superpowers/evidence/mpfb-v73
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Render v65-B and rejected v72 thumb segments
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/diagnose_mpfb_thumb_segments_v73.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_v73/renders \
            artifacts/mpfb_v73/reports/thumb-segments-v73.json \
            2>&1 | tee artifacts/mpfb_v73/logs/diagnose.log
          grep -Fq 'MPFB_THUMB_SEGMENTS_V73_SUCCESS' artifacts/mpfb_v73/logs/diagnose.log

      - name: Enforce per-segment diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/mpfb_v73/reports/thumb-segments-v73.json')
          r=json.load(p.open())
          assert r['diagnostic_only'] is True and r['production_candidate'] is False, r
          assert r['new_pose_authored_in_v73'] is False, r
          assert r['render_space_only'] is True and r['bone_projection_used'] is False, r
          assert r['reference_set']==['bar_v1','market_v1'], r
          for state in ['pristine_v65_b','rejected_v72']:
              s=r['states'][state]
              assert set(s['segment_signed_side_px'])=={'thumb_root','thumb_proximal','thumb_distal'}, s
              assert s['vessel_centerline']['row_count'] >= 8, s
              assert 'distal_opposition_gate' in s, s
          for name in [
              'thumb-segments-v65b-192x108.png','thumb-segments-v65b-anatomy-192x108.png',
              'thumb-segments-v72-192x108.png','thumb-segments-v72-anatomy-192x108.png']:
              q=Path('artifacts/mpfb_v73/renders')/name
              assert q.is_file() and q.stat().st_size>0, q
          print('MPFB_THUMB_SEGMENTS_V73_CONTRACT_PASS')
          print(json.dumps({
            'v65b':r['states']['pristine_v65_b']['segment_signed_side_px'],
            'v72':r['states']['rejected_v72']['segment_signed_side_px'],
            'delta':r['v72_minus_v65b_segment_side_delta_px'],
            'v65b_gate':r['states']['pristine_v65_b']['distal_opposition_gate'],
            'v72_gate':r['states']['rejected_v72']['distal_opposition_gate'],
          },indent=2))
          PY

      - name: Persist v73 evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v73/reports/thumb-segments-v73.json docs/superpowers/evidence/mpfb-v73/
          cp artifacts/mpfb_v73/renders/*.png docs/superpowers/evidence/mpfb-v73/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v73
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist thumb segment diagnostic v73'
            git pull --rebase origin spike/mpfb-hero-limb-thumb-segments-v73
            git push origin HEAD:spike/mpfb-hero-limb-thumb-segments-v73
          fi

      - name: Upload v73 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-thumb-segments-v73
          path: artifacts/mpfb_v73/
          if-no-files-found: error
          retention-days: 14
