name: Peel Local Independent Challenger

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Numeric task id
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      round:
        description: Challenge round
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  challenge:
    name: qwen3b-exact-head-challenger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)"
          test "$current_head" = "$EXPECTED_HEAD_SHA" || {
            echo "Stale challenge: current=$current_head expected=$EXPECTED_HEAD_SHA" >&2
            exit 1
          }

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare adversarial review packet
        env:
          TASK_ID_VALUE: ${{ inputs.task_id }}
          PR_NUMBER_VALUE: ${{ inputs.pr_number }}
          EXPECTED_HEAD_VALUE: ${{ inputs.expected_head_sha }}
          ROUND_VALUE: ${{ inputs.round }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          bash tools/build_local_challenger_packet.sh origin/main HEAD /tmp/review-packet.txt

      - name: Install local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 &
          for _ in {1..40}; do
            if ollama list >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-server.log
          exit 1

      - name: Pull local code model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5-coder:3b

      - name: Run adversarial analysis
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'PROMPT'
          You are CHALLENGER, independent from the implementation author. Review the exact PR-head diff and directly relevant contracts below. Treat all Builder claims as hypotheses and actively try to falsify this batch. Do not write replacement code unless a concrete defect requires a tiny reproducer.

          Required attacks:
          A. Construct at least one concrete boundary/counterexample specific to the changed path.
          B. Check whether a test/capture helper can silently publish misleading evidence while its immediate assertions pass.
          C. Check presentation/gameplay authority: test-only staging must not become gameplay authority, and production presentation must not own progression.
          D. Check reset/scene-switch/process-state cleanup when the touched code can pause, resume, replace, or stage nodes.
          E. Check coordinate-space and pose/contact assertions for false positives when relevant.
          F. Check that the tests actually exercise the claimed path and do not only assert internal implementation state.
          G. Do not treat CI green as proof of subjective hand naturalness or reference-image similarity; those remain visual/experiential gates.

          Produce concise adversarial analysis in prose. End with a provisional conclusion of either VERIFIED or NEEDS_FIX and explain why. A later structured-output pass will normalize your conclusion.

          Exact-head packet follows:
          PROMPT
            cat /tmp/review-packet.txt
          } > /tmp/review-prompt.txt

          ollama run qwen2.5-coder:3b < /tmp/review-prompt.txt | tee /tmp/review-analysis.txt
          test -s /tmp/review-analysis.txt

      - name: Normalize Challenger verdict
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg analysis "$(head -c 12000 /tmp/review-analysis.txt)" \
            --arg context "$(git diff --stat origin/main...HEAD; git diff --name-only origin/main...HEAD)" \
            '{
              model:"qwen2.5-coder:3b",
              stream:false,
              prompt:("Normalize this independent adversarial review into a verdict. Do not invent a defect unsupported by the analysis. If the analysis identifies a concrete reproducible defect, verdict must be NEEDS_FIX. If it explicitly concludes the exact diff survives its falsification attempts, verdict may be VERIFIED. Context:\n" + $context + "\nAnalysis:\n" + $analysis),
              format:{
                type:"object",
                properties:{
                  verdict:{type:"string",enum:["VERIFIED","NEEDS_FIX"]},
                  defect:{type:"string"},
                  min_test:{type:"string"},
                  evidence:{type:"string"}
                },
                required:["verdict","defect","min_test","evidence"],
                additionalProperties:false
              }
            }' > /tmp/normalize-request.json

          curl -fsS http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/normalize-request.json > /tmp/normalize-response.json

          response="$(jq -er '.response' /tmp/normalize-response.json)"
          printf '%s' "$response" | jq -e . > /tmp/verdict.json
          verdict="$(jq -er '.verdict | select(. == "VERIFIED" or . == "NEEDS_FIX")' /tmp/verdict.json)"
          defect="$(jq -er '.defect | strings' /tmp/verdict.json)"
          min_test="$(jq -er '.min_test | strings' /tmp/verdict.json)"
          evidence="$(jq -er '.evidence | strings' /tmp/verdict.json)"
          {
            printf 'VERDICT: %s\n' "$verdict"
            printf 'DEFECT: %s\n' "$defect"
            printf 'MIN_TEST: %s\n' "$min_test"
            printf 'EVIDENCE: %s\n' "$evidence"
          } | tee /tmp/review-report.txt
          test "$(wc -l < /tmp/review-report.txt)" -eq 4

      - name: Comment exact-head report on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ROUND: ${{ inputs.round }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Local Challenger — round $ROUND"
            echo
            echo "Exact head: \`$EXPECTED_HEAD_SHA\`"
            echo
            echo '```text'
            if [ -s /tmp/review-report.txt ] && grep -Eq '^VERDICT: (VERIFIED|NEEDS_FIX)$' /tmp/review-report.txt; then
              cat /tmp/review-report.txt
            else
              echo 'VERDICT: INFRA_FAILURE'
              echo 'DEFECT: local Challenger did not produce a conforming structured verdict'
              echo 'MIN_TEST: rerun the local Challenger after fixing verifier infrastructure'
              echo 'EVIDENCE: no VERIFIED or NEEDS_FIX verdict was accepted'
            fi
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md

      - name: Enforce Challenger verdict
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'VERDICT: VERIFIED' /tmp/review-report.txt
