name: Peel Local Independent Challenger

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Numeric task id
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      round:
        description: Challenge round
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  challenge:
    name: qwen3b-exact-head-challenger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)"
          test "$current_head" = "$EXPECTED_HEAD_SHA" || {
            echo "Stale challenge: current=$current_head expected=$EXPECTED_HEAD_SHA" >&2
            exit 1
          }

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare adversarial review packet
        shell: bash
        run: |
          set -euo pipefail
          # Checkout already uses fetch-depth: 0. Refresh main without re-shallowing
          # history so origin/main...HEAD always has the real merge base even when
          # main advanced after the PR was opened.
          git fetch origin main:refs/remotes/origin/main
          {
            echo "TASK_ID=${{ inputs.task_id }}"
            echo "PR_NUMBER=${{ inputs.pr_number }}"
            echo "EXPECTED_HEAD_SHA=${{ inputs.expected_head_sha }}"
            echo "ROUND=${{ inputs.round }}"
            echo '=== CHANGE STAT ==='
            git diff --stat origin/main...HEAD
            echo '=== EXACT PR DIFF ==='
            git diff --unified=60 origin/main...HEAD
            echo '=== CHANGED PATHS ==='
            git diff --name-only origin/main...HEAD
            echo '=== DIRECT PRESENTATION/INTERACTION CONTRACTS ==='
            cat scripts/presentation/hand_choreography_presentation.gd
            cat scripts/hands/hand_visual.gd
            echo '=== REFERENCE CAPTURE CONTRACT ==='
            cat tests/capture_reference_frames.gd
            echo '=== HAND REGRESSION CONTRACTS ==='
            cat tests/test_hand_visual.gd
            cat tests/test_authored_hand_asset.gd
          } > /tmp/review-packet.txt
          bytes="$(wc -c < /tmp/review-packet.txt)"
          echo "review packet bytes=$bytes"
          test "$bytes" -lt 42000

      - name: Install local Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 &
          for _ in {1..40}; do
            if ollama list >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-server.log
          exit 1

      - name: Pull local code model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5-coder:3b

      - name: Run independent exact-head challenge
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'PROMPT'
          You are CHALLENGER, independent from the implementation author. Review the exact PR-head diff and directly relevant contracts below. Treat all Builder claims as hypotheses and try to falsify this batch; do not praise or summarize.

          Required attacks:
          A. Construct at least one concrete boundary/counterexample specific to the changed path.
          B. Check whether a test/capture helper can silently publish misleading evidence while its immediate assertions pass.
          C. Check presentation/gameplay authority: test-only staging must not become gameplay authority, and production presentation must not own progression.
          D. Check reset/scene-switch/process-state cleanup when the touched code can pause, resume, replace, or stage nodes.
          E. Check coordinate-space and pose/contact assertions for false positives when relevant.
          F. Check that the tests actually exercise the claimed path and do not only assert internal implementation state.
          G. Do not treat CI green as proof of subjective hand naturalness or reference-image similarity; those remain visual/experiential gates.

          The deterministic Godot wrapper is a separate gate. Your job is adversarial code/test review of this exact diff.

          Respond EXACTLY with these four single-line fields and no markdown/headings:
          VERDICT: VERIFIED
          DEFECT: none
          MIN_TEST: none
          EVIDENCE: <concise reason the strongest falsification attempt did not break this exact batch>

          If you find a concrete defect, use VERDICT: NEEDS_FIX, name exact function/state transition in DEFECT, and give one deterministic reproducer in MIN_TEST.

          Exact-head packet follows:
          PROMPT
            cat /tmp/review-packet.txt
          } > /tmp/review-prompt.txt

          ollama run qwen2.5-coder:3b < /tmp/review-prompt.txt | tee /tmp/review-report.txt
          test -s /tmp/review-report.txt
          grep -Eq '^VERDICT: (VERIFIED|NEEDS_FIX)$' /tmp/review-report.txt
          for field in DEFECT MIN_TEST EVIDENCE; do
            grep -Eq "^${field}:" /tmp/review-report.txt
          done

      - name: Comment exact-head report on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ROUND: ${{ inputs.round }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Local Challenger — round $ROUND"
            echo
            echo "Exact head: \`$EXPECTED_HEAD_SHA\`"
            echo
            echo '```text'
            if [ -s /tmp/review-report.txt ]; then
              cat /tmp/review-report.txt
            else
              echo 'VERDICT: INFRA_FAILURE'
              echo 'DEFECT: local model did not produce a conforming report'
            fi
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md

      - name: Enforce Challenger verdict
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'VERDICT: VERIFIED' /tmp/review-report.txt
