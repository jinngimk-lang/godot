name: Peel Local Independent Challenger

on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      round:
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  challenge:
    name: qwen7b-exact-head-challenger
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Validate exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)"
          test "$current_head" = "$EXPECTED_HEAD_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact-head review packet
        env:
          TASK_ID_VALUE: ${{ inputs.task_id }}
          PR_NUMBER_VALUE: ${{ inputs.pr_number }}
          EXPECTED_HEAD_VALUE: ${{ inputs.expected_head_sha }}
          ROUND_VALUE: ${{ inputs.round }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:tools/build_local_challenger_packet.sh > /tmp/build-local-challenger-packet.sh
          bash /tmp/build-local-challenger-packet.sh origin/main HEAD /tmp/review-packet.txt

      - name: Install Ollama and pull reviewer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-server.log 2>&1 &
          for _ in {1..50}; do
            ollama list >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen2.5-coder:7b

      - name: Run one bounded independent review
        shell: bash
        run: |
          set -euo pipefail
          packet="$(head -c 30000 /tmp/review-packet.txt)"
          prompt="$(cat <<'PROMPT'
          You are an independent code-review Challenger. The exact packet below is the ONLY source of truth. Try to falsify the candidate by checking changed-path boundaries, reset/scene-switch state, presentation-vs-gameplay authority, coordinate-space mistakes, and whether tests actually exercise the claimed path. Never invent code or symbols. Do not output replacement code.

          Return ONLY these five labelled lines and nothing else:
          PROVISIONAL_VERDICT: VERIFIED | NEEDS_FIX
          DEFECT: NONE | one concrete reproducible defect
          MIN_TEST: NONE | one concrete falsifiable regression check
          EVIDENCE: one concise sentence
          EVIDENCE_ANCHOR: NO_CONCRETE_DEFECT | one contiguous 16-240 character verbatim quote from the exact packet proving the defect

          If no exact-packet quote proves a concrete defect, use VERIFIED / NONE / NONE / NO_CONCRETE_DEFECT.
          PROMPT
          )"
          jq -n --arg prompt "$prompt\n\nEXACT PACKET:\n$packet" '{model:"qwen2.5-coder:7b",stream:false,prompt:$prompt,options:{temperature:0,num_predict:420,num_ctx:16384}}' > /tmp/review-request.json
          curl -fsS http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' --data-binary @/tmp/review-request.json > /tmp/review-response.json
          jq -er '.response' /tmp/review-response.json | tee /tmp/review-analysis.txt
          test -s /tmp/review-analysis.txt

      - name: Parse and ground verdict
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:tools/extract_local_challenger_report.py > /tmp/extract-local-challenger-report.py
          git show origin/main:tools/validate_local_challenger_verdict.sh > /tmp/validate-local-challenger-verdict.sh
          chmod +x /tmp/validate-local-challenger-verdict.sh
          python3 /tmp/extract-local-challenger-report.py /tmp/review-analysis.txt /tmp/verdict.json
          bash /tmp/validate-local-challenger-verdict.sh /tmp/verdict.json /tmp/review-packet.txt
          verdict="$(jq -er '.verdict' /tmp/verdict.json)"
          defect="$(jq -er '.defect' /tmp/verdict.json)"
          min_test="$(jq -er '.min_test' /tmp/verdict.json)"
          evidence="$(jq -er '.evidence' /tmp/verdict.json)"
          anchor="$(jq -er '.evidence_anchor' /tmp/verdict.json)"
          printf 'VERDICT: %s\nDEFECT: %s\nMIN_TEST: %s\nEVIDENCE: %s | ANCHOR: %s\n' "$verdict" "$defect" "$min_test" "$evidence" "$anchor" | tee /tmp/review-report.txt

      - name: Comment exact-head report on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ROUND: ${{ inputs.round }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Local Challenger — round $ROUND"
            echo
            echo "Exact head: \`$EXPECTED_HEAD_SHA\`"
            echo
            echo '```text'
            if [ -s /tmp/review-report.txt ]; then cat /tmp/review-report.txt; else
              echo 'VERDICT: INFRA_FAILURE'
              echo 'DEFECT: reviewer did not produce a grounded verdict'
              echo 'MIN_TEST: rerun after verifier repair'
              echo 'EVIDENCE: no accepted exact-packet verdict'
            fi
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md

      - name: Enforce verdict
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'VERDICT: VERIFIED' /tmp/review-report.txt
