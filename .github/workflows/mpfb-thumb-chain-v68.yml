name: MPFB Thumb Chain v68

on:
  push:
    branches:
      - spike/mpfb-hero-limb-thumb-abduction-v67
    paths:
      - 'tools/author_mpfb_thumb_chain_v68.py'
      - '.github/workflows/mpfb-thumb-chain-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  thumb-chain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-thumb-abduction-v67

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v68/{previews,reports,logs} docs/superpowers/evidence/mpfb-v68
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Render coherent direct-visual thumb chain
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/author_mpfb_thumb_chain_v68.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_v68/previews \
            artifacts/mpfb_v68/reports/thumb-chain-v68.json \
            2>&1 | tee artifacts/mpfb_v68/logs/author.log
          grep -Fq 'MPFB_THUMB_CHAIN_V68_SUCCESS' artifacts/mpfb_v68/logs/author.log
          for f in \
            support-wrap-B68-with-vessel.png \
            support-wrap-B68-thumbnail.png \
            support-wrap-B68-anatomy-oblique.png \
            support-wrap-B68-anatomy-thumbnail.png \
            right-support-wrap-v65-B68-static.glb \
            support-wrap-v68-canonical-pose.json; do
            test -s "artifacts/mpfb_v68/previews/$f"
          done

      - name: Enforce direct-visual authoring boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v68/reports/thumb-chain-v68.json'))
          assert r['staging_only'] is True and r['production_candidate'] is False, r
          assert r['base_candidate'] == 'pristine v65-B' and r['base_palmar_sign'] == -1.0, r
          assert r['direct_visual_thumb_chain'] is True, r
          assert r['thumb_bones_authored_together'] == ['finger1-1.R','finger1-2.R','finger1-3.R'], r
          assert r['non_thumb_fingers_changed_from_v65_b'] is False, r
          assert r['wrist_changed_from_v65_b'] is False and r['palm_vessel_relationship_changed_from_v65_b'] is False, r
          assert r['camera_changed_from_v65_b'] is False and r['crop_changed_from_v65_b'] is False, r
          assert r['ccd_used'] is False and r['endpoint_optimizer_used'] is False and r['parameter_sweep_used'] is False, r
          assert r['single_axis_thumb_sweep_used'] is False, r
          assert r['same_rig_pose_persisted'] is True, r
          c=r['candidate']
          assert c['baked_vertices'] >= 1400 and c['palm_vertex_coverage'] >= 220 and c['min_segment_vertex_coverage'] >= 12, c
          pose=json.load(open('artifacts/mpfb_v68/previews/support-wrap-v68-canonical-pose.json'))
          assert pose['rig'] == 'mpfb-default-canonical' and pose['side'] == 'right', pose
          assert len(pose['bones']) == 16, len(pose['bones'])
          print('MPFB_THUMB_CHAIN_V68_BOUNDARY_PASS')
          PY

      - name: Persist visual evidence
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v68/previews/support-wrap-B68-with-vessel.png docs/superpowers/evidence/mpfb-v68/support-wrap-with-vessel.png
          cp artifacts/mpfb_v68/previews/support-wrap-B68-thumbnail.png docs/superpowers/evidence/mpfb-v68/support-wrap-thumbnail.png
          cp artifacts/mpfb_v68/previews/support-wrap-B68-anatomy-oblique.png docs/superpowers/evidence/mpfb-v68/anatomy-oblique.png
          cp artifacts/mpfb_v68/previews/support-wrap-B68-anatomy-thumbnail.png docs/superpowers/evidence/mpfb-v68/anatomy-thumbnail.png
          cp artifacts/mpfb_v68/previews/support-wrap-v68-canonical-pose.json docs/superpowers/evidence/mpfb-v68/support-wrap-v68-canonical-pose.json
          cp artifacts/mpfb_v68/reports/thumb-chain-v68.json docs/superpowers/evidence/mpfb-v68/thumb-chain-v68.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v68
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist coherent thumb chain v68'
            git push origin HEAD:spike/mpfb-hero-limb-thumb-abduction-v67
          fi

      - name: Upload redundant artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-thumb-chain-v68
          path: artifacts/mpfb_v68/
          if-no-files-found: error
          retention-days: 14
