name: Apply support scaling semantics v94

on:
  push:
    branches:
      - spike/cc0-makehuman-support-hand-v94

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[support-scale-semantics]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/cc0-makehuman-support-hand-v94
          fetch-depth: 1
      - name: Apply exact role-semantic patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/presentation/forearm_presentation.gd')
          text=p.read_text()
          old_calls='''\t_scale_hand_preserve_pinch(parent.get_node_or_null("RightHand") as HandVisual)\n\t_scale_hand_preserve_pinch(parent.get_node_or_null("LeftHand") as HandVisual)'''
          new_calls='''\t_scale_hand_preserve_pinch(parent.get_node_or_null("RightHand") as HandVisual)\n\t_scale_support_hand_keep_root(parent.get_node_or_null("LeftHand") as HandVisual)'''
          if old_calls not in text:
              raise SystemExit('exact dual pinch-preserve call site not found; refusing fuzzy patch')
          text=text.replace(old_calls,new_calls,1)
          anchor='''\thand.position += old_pinch-new_pinch\n\thand.set_grip_target(old_pinch)\n\nfunc _build_for_hand(hand_name: String, dynamic_hand: bool) -> void:'''
          insertion='''\thand.position += old_pinch-new_pinch\n\thand.set_grip_target(old_pinch)\n\nfunc _scale_support_hand_keep_root(hand: HandVisual) -> void:\n\t# The left hand is staged around the vessel by its HandVisual root. Its\n\t# semantic contract is Cup support, not the thumb/index pinch anchor. Scale\n\t# only the authored child so a valid support grasp is never translated away\n\t# from the cup by peel-hand-specific anchor preservation.\n\tif hand == null:\n\t\treturn\n\tvar authored := hand.get_node_or_null("AuthoredHand") as Node3D\n\tif authored == null:\n\t\treturn\n\tauthored.scale = Vector3.ONE*AUTHORED_HAND_SCALE\n\nfunc _build_for_hand(hand_name: String, dynamic_hand: bool) -> void:'''
          if anchor not in text:
              raise SystemExit('exact scale helper anchor not found; refusing fuzzy patch')
          text=text.replace(anchor,insertion,1)
          p.write_text(text)
          PY
          grep -Fq '_scale_support_hand_keep_root(parent.get_node_or_null("LeftHand") as HandVisual)' scripts/presentation/forearm_presentation.gd
          grep -Fq 'func _scale_support_hand_keep_root(hand: HandVisual) -> void:' scripts/presentation/forearm_presentation.gd
      - name: Commit patch and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-support-scale-semantics-v94.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/presentation/forearm_presentation.gd .github/workflows/apply-support-scale-semantics-v94.yml
          git commit -m 'fix: keep support-hand root fixed while scaling [support-scale-semantics]'
          git push origin HEAD:spike/cc0-makehuman-support-hand-v94
