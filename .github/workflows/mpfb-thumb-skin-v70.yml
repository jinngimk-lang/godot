name: MPFB Thumb Skin Diagnostic v70

on:
  push:
    branches:
      - spike/mpfb-hero-limb-thumb-abduction-v67
    paths:
      - 'tools/diagnose_mpfb_thumb_skin_v70.py'
      - '.github/workflows/mpfb-thumb-skin-v70.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  HOME: ${{ github.workspace }}/.preview-home

jobs:
  thumb-skin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/mpfb-hero-limb-thumb-abduction-v67

      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          mkdir -p "$HOME" .preview-tools artifacts/mpfb_v70/{reports,logs} docs/superpowers/evidence/mpfb-v70
          curl -L --fail --retry 3 -o .preview-tools/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          echo '4f4fd7646af01f6fee9d420408318381a6e52571268eb7cf9cd5033bd9e7a359  .preview-tools/blender.tar.xz' | sha256sum -c -
          tar -xJf .preview-tools/blender.tar.xz -C .preview-tools
          mv .preview-tools/blender-4.2.0-linux-x64 .preview-tools/blender
          curl -L --fail --retry 3 -o .preview-tools/mpfb.tar.gz https://github.com/makehumancommunity/mpfb2/archive/refs/tags/v2.0.17.tar.gz
          echo '92409ef66fa1108fa13a9b842048e0568a5a7dec5983cc5ccb728e0696195bbe  .preview-tools/mpfb.tar.gz' | sha256sum -c -
          tar -xzf .preview-tools/mpfb.tar.gz -C .preview-tools
          .preview-tools/blender/blender --command extension build --source-dir .preview-tools/mpfb2-2.0.17/src/mpfb --output-filepath .preview-tools/mpfb.zip --valid-tags=""
          mkdir -p .preview-tools/extensions
          .preview-tools/blender/blender --command extension repo-add mpfb_ci --name 'MPFB CI' --directory "$PWD/.preview-tools/extensions" --clear-all
          .preview-tools/blender/blender --command extension install-file -r mpfb_ci -e .preview-tools/mpfb.zip

      - name: Measure thumb bone-to-skin deformation
        shell: bash
        run: |
          set -euo pipefail
          .preview-tools/blender/blender --background --python tools/diagnose_mpfb_thumb_skin_v70.py -- \
            bl_ext.mpfb_ci.mpfb \
            artifacts/mpfb_v70/reports/thumb-skin-v70.json \
            2>&1 | tee artifacts/mpfb_v70/logs/diagnose.log
          grep -Fq 'MPFB_THUMB_SKIN_V70_SUCCESS' artifacts/mpfb_v70/logs/diagnose.log

      - name: Enforce diagnostic-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('artifacts/mpfb_v70/reports/thumb-skin-v70.json'))
          assert r['diagnostic_only'] is True and r['production_candidate'] is False, r
          assert r['base_pose'] == 'pristine v65-B', r
          assert r['tested_change'] == 'exact rejected v69 thumb opposition arc', r
          assert r['thumb_bones'] == ['finger1-1.R','finger1-2.R','finger1-3.R'], r
          for bone,count in r['thumb_vertex_group_counts_weight_gt_0_01'].items():
              assert count > 0, (bone,count)
          moved=max(v['tail_displacement_m'] for v in r['thumb_bone_motion'].values())
          assert moved > 0.005, moved
          print('MPFB_THUMB_SKIN_V70_DIAGNOSTIC_PASS')
          PY

      - name: Persist diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/mpfb_v70/reports/thumb-skin-v70.json docs/superpowers/evidence/mpfb-v70/thumb-skin-v70.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/evidence/mpfb-v70
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist thumb skin diagnostic v70'
            git pull --rebase origin spike/mpfb-hero-limb-thumb-abduction-v67
            git push origin HEAD:spike/mpfb-hero-limb-thumb-abduction-v67
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-thumb-skin-v70
          path: artifacts/mpfb_v70/
          if-no-files-found: error
          retention-days: 14
