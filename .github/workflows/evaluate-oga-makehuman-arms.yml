name: Evaluate CC0 MakeHuman FPS arms

on:
  push:
    branches:
      - spike/oga-makehuman-arms-v93

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install asset inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full blender python3-numpy
          blender --version | head -1
      - name: Download CC0 source and inspect archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/oga-arms.7z 'https://opengameart.org/sites/default/files/fps%20arms.7z'
          mkdir -p /tmp/oga-arms /tmp/oga-eval
          7z l /tmp/oga-arms.7z | tee /tmp/oga-eval/archive-list.txt
          7z x -y -o/tmp/oga-arms /tmp/oga-arms.7z >/tmp/oga-eval/extract.log
          find /tmp/oga-arms -type f -printf '%p\n' | sort | tee /tmp/oga-eval/files.txt
          find /tmp/oga-arms -type f \( -iname '*.fbx' -o -iname '*.blend' \) | grep -q .
      - name: Blender mesh rig and neutral preview
        run: |
          set -euo pipefail
          cat > /tmp/eval_arms.py <<'PY'
          import bpy, os, glob, json
          from mathutils import Vector

          root='/tmp/oga-arms'
          out='/tmp/oga-eval'
          fbx=sorted(glob.glob(root+'/**/*.fbx', recursive=True))
          if not fbx:
              raise RuntimeError('no FBX found')
          pick=next((p for p in fbx if 'pose' in os.path.basename(p).lower()), fbx[0])
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.fbx(filepath=pick)
          meshes=[o for o in bpy.context.scene.objects if o.type=='MESH']
          arms=[o for o in bpy.context.scene.objects if o.type=='ARMATURE']
          if not meshes or not arms:
              raise RuntimeError('candidate must import both mesh and armature')
          report={
              'selected_fbx':pick,
              'mesh_objects':[o.name for o in meshes],
              'vertices':sum(len(o.data.vertices) for o in meshes),
              'polygons':sum(len(o.data.polygons) for o in meshes),
              'armatures':[a.name for a in arms],
              'bones':sum(len(a.data.bones) for a in arms),
              'materials':sorted({slot.material.name for o in meshes for slot in o.material_slots if slot.material}),
              'images':sorted({img.name for img in bpy.data.images if img.name!='Render Result'}),
              'actions':[a.name for a in bpy.data.actions],
          }
          with open(out+'/report.json','w') as f: json.dump(report,f,indent=2)
          with open(out+'/report.txt','w') as f:
              for k,v in report.items(): f.write(f'{k}: {v}\n')
          bpy.ops.export_scene.gltf(filepath=out+'/candidate.glb', export_format='GLB', export_animations=True)

          corners=[o.matrix_world @ Vector(c) for o in meshes for c in o.bound_box]
          mins=Vector((min(c.x for c in corners),min(c.y for c in corners),min(c.z for c in corners)))
          maxs=Vector((max(c.x for c in corners),max(c.y for c in corners),max(c.z for c in corners)))
          center=(mins+maxs)*0.5
          radius=max((maxs-mins).length*0.55,0.5)

          world=bpy.data.worlds.new('EvalWorld'); world.color=(0.055,0.055,0.055); bpy.context.scene.world=world
          try: bpy.context.scene.render.engine='BLENDER_EEVEE_NEXT'
          except Exception: bpy.context.scene.render.engine='BLENDER_EEVEE'
          bpy.context.scene.render.resolution_x=768; bpy.context.scene.render.resolution_y=768; bpy.context.scene.render.resolution_percentage=100
          bpy.context.scene.render.image_settings.file_format='PNG'

          key=bpy.data.lights.new('Key','AREA'); key.energy=900; key.shape='DISK'; key.size=radius*1.2
          keyo=bpy.data.objects.new('Key',key); bpy.context.collection.objects.link(keyo); keyo.location=center+Vector((radius,-radius*1.2,radius*1.4))
          fill=bpy.data.lights.new('Fill','AREA'); fill.energy=500; fill.size=radius*1.4
          fillo=bpy.data.objects.new('Fill',fill); bpy.context.collection.objects.link(fillo); fillo.location=center+Vector((-radius*1.3,-radius*0.5,radius*0.8))
          def point(obj,target): obj.rotation_euler=(Vector(target)-obj.location).to_track_quat('-Z','Y').to_euler()
          point(keyo,center); point(fillo,center)
          camd=bpy.data.cameras.new('Camera'); cam=bpy.data.objects.new('Camera',camd); bpy.context.collection.objects.link(cam); bpy.context.scene.camera=cam; camd.lens=58
          for name,d in {'front':Vector((0,-1,0.12)),'three_quarter':Vector((0.8,-1,0.45)),'side':Vector((1,0,0.12))}.items():
              d.normalize(); cam.location=center+d*(radius*2.25); point(cam,center)
              bpy.context.scene.render.filepath=out+f'/{name}.png'; bpy.ops.render.render(write_still=True)
          PY
          blender -b --python-exit-code 1 --python /tmp/eval_arms.py 2>&1 | tee /tmp/oga-eval/blender.log
          test -s /tmp/oga-eval/report.json
          test -s /tmp/oga-eval/candidate.glb
          test -s /tmp/oga-eval/front.png
          test -s /tmp/oga-eval/three_quarter.png
          test -s /tmp/oga-eval/side.png
      - uses: actions/upload-artifact@v4
        with:
          name: oga-cc0-makehuman-arms-eval
          path: /tmp/oga-eval
          if-no-files-found: error
